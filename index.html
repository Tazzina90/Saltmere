<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Nebbie di Saltmere</title>
<meta name="description" content="Un gioco investigativo testuale gotico ambientato in una città portuale vittoriana.">
<meta name="theme-color" content="#0c1313">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saltmere">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: colonna unica mobile-first; barra di stato fissa in alto, sotto una "carta" di scena su fondo di nebbia portuale. Tema scuro unico, voluto. */
:root{
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);
  --ink:#0c1313; --surface:#131d1d; --surface2:#1a2726; --line:#2a3b39;
  --bone:#e7e1d1; --muted:#97a39d; --gas:#e2a94b; --gas-dim:#8c6a33;
  --verd:#6fae9d; --rust:#cf6146; --mind:#a094dc;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--ink);color:var(--bone);margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px;position:relative;overflow-x:hidden}
.fog{position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.55;
  background:radial-gradient(40% 30% at 20% 30%, rgba(111,174,157,.10), transparent 70%),
             radial-gradient(35% 25% at 80% 60%, rgba(226,169,75,.07), transparent 70%),
             radial-gradient(50% 40% at 50% 100%, rgba(151,163,157,.08), transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,0,0)}to{transform:translate3d(3%,-2%,0)}}
@media (prefers-reduced-motion: reduce){.fog{animation:none}}
#app{position:relative;z-index:1;max-width:620px;margin:0 auto}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gas);outline-offset:2px}

/* barra di stato */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(var(--ink) 75%, transparent);}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.when{font-family:var(--f-display);font-size:1.45rem;font-style:italic;line-height:1.1}
.when small{font-family:var(--f-mono);font-style:normal;font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.purse{font-family:var(--f-mono);font-size:.9rem;color:var(--gas);font-variant-numeric:tabular-nums}
.meters{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter{display:flex;align-items:center;gap:6px}
.pips{display:flex;gap:3px}
.pip{width:8px;height:8px;border-radius:50%;border:1px solid var(--line)}
.pip.on{background:var(--mind);border-color:var(--mind)}
.pip.rep.on{background:var(--verd);border-color:var(--verd)}
.low .pip.on{background:var(--rust);border-color:var(--rust)}
.tide{margin-top:6px;font-family:var(--f-mono);font-size:.68rem;color:var(--rust);letter-spacing:.06em;text-transform:uppercase}

.tabs{display:flex;gap:4px;margin:10px 0 14px;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto}
.tab{background:none;border:0;padding:8px 10px 10px;white-space:nowrap;cursor:pointer;color:var(--muted);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--bone);border-color:var(--gas)}

h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gas-dim)}

/* luoghi */
.notes{border-left:2px solid var(--gas);padding:8px 12px;margin-bottom:16px;background:var(--surface)}
.notes p{margin:.2em 0;font-size:.92rem}
.notes button{margin-top:6px}
.locs{display:grid;gap:8px}
.loc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 14px;cursor:pointer}
.loc:hover{border-color:var(--gas-dim)}
.loc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.loc-n{font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
.loc-d{color:var(--muted);font-size:.85rem;margin-top:2px}
.dots{display:flex;gap:4px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--verd)}
.dot.main{background:var(--rust)}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.loc-head{margin-bottom:14px}
.loc-head h2{font-size:2rem;line-height:1.1}
.loc-head p{color:var(--muted);margin:.4em 0 0;font-style:italic}

.acts{display:grid;gap:8px}
.act{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-height:48px}
.act:hover:not(:disabled){border-color:var(--gas)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .lbl{min-width:0}
.act .case{display:block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--verd);margin-bottom:2px}
.act .case.main{color:var(--rust)}
.tag{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);white-space:nowrap;flex-shrink:0}

/* scena */
.scene{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:20px 18px 18px}
.scene h2{font-size:1.9rem;line-height:1.1;font-style:italic;margin-bottom:12px}
.scene p{margin:0 0 .9em;max-width:62ch}
.pre{color:var(--muted)}
.roll{font-family:var(--f-mono);font-size:.74rem;padding:6px 10px;border:1px solid var(--line);display:inline-block;margin-bottom:12px;font-variant-numeric:tabular-nums}
.roll.ok{color:var(--verd);border-color:rgba(111,174,157,.4)}
.roll.ko{color:var(--rust);border-color:rgba(207,97,70,.4)}
.vision{color:var(--mind);font-style:italic}
.choices{display:grid;gap:8px;margin-top:16px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-height:48px}
.choice:hover:not(:disabled){border-color:var(--gas)}
.choice:disabled{opacity:.42;cursor:not-allowed}
.btn{background:var(--gas);color:#1b1206;border:0;border-radius:3px;padding:12px 18px;cursor:pointer;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.btn.ghost{background:none;color:var(--bone);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* taccuino e casi */
.sec{margin-bottom:22px}
.sec h3{font-size:1.4rem;margin-bottom:8px}
.clue{padding:8px 0 8px 14px;border-left:1px solid var(--line);font-size:.92rem;margin:0}
.clue.frag{border-color:var(--rust)}
.clue.odd{color:var(--mind)}
.people{display:grid;gap:6px}
.person{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;border-bottom:1px dotted var(--line);padding-bottom:4px}
.person b{font-weight:600}
.att{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.att.good{color:var(--verd)} .att.bad{color:var(--rust)}
.casecard{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:10px}
.casecard.main{border-color:rgba(207,97,70,.5)}
.casecard h3{font-size:1.45rem}
.casecard .meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;margin:4px 0 8px;text-transform:uppercase}
.casecard p{margin:0 0 10px;font-size:.92rem}
.stat{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.8rem;padding:4px 0;border-bottom:1px dotted var(--line)}

/* deduzione */
.q{margin:18px 0}
.q h3{font-size:1.3rem;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;cursor:pointer;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:6px}
.opt[aria-pressed="true"]{border-color:var(--gas);background:rgba(226,169,75,.08)}

/* slot di salvataggio */
.bar-right{display:flex;align-items:center;gap:12px}
.menu{background:none;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;cursor:pointer}
.slots{display:grid;gap:10px;margin-top:10px}
.slotc{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px}
.slotc.empty{border-style:dashed;background:none}
.slotc h3{font-size:1.45rem;line-height:1.15}
.slotc .meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em;margin:4px 0 12px}
.slotc .row .btn{padding:10px 12px}
.slot-n{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gas-dim);margin-bottom:4px}
.muted{color:var(--muted)}
.slotc p.muted{margin:.2em 0 .8em}
.btn.danger{color:var(--rust);border-color:rgba(207,97,70,.45)}
.btn.danger-fill{background:var(--rust);color:#1b0c07}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px;color:var(--bone);font-family:var(--f-mono);font-size:.74rem;resize:vertical;word-break:break-all}
.code-box{border:1px solid var(--gas-dim);padding:14px;border-radius:3px}
.code-box p{margin:.3em 0 .8em;font-size:.9rem}
.err{color:var(--rust);font-size:.88rem;margin:.5em 0 0}
/* titolo */
.title{padding-top:12vh;padding-bottom:20px}
.title h1{font-size:clamp(3rem,13vw,5.2rem);line-height:.92;font-style:italic;letter-spacing:-.01em}
.title h1 span{display:block;font-style:normal;color:var(--gas)}
.title p{color:var(--muted);max-width:44ch;margin:18px 0 26px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px;color:var(--bone);font:inherit}
.pick{display:grid;gap:8px}
.pick .opt b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;display:block}
.pick .opt small{color:var(--muted);display:block;font-size:.85rem}
.pick.inline{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.ending h1{font-size:clamp(2.4rem,10vw,3.6rem);font-style:italic;line-height:1;margin:8px 0 16px}
.ending p{max-width:62ch}
.coda{color:var(--mind);font-style:italic;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--verd);color:#0b1716;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;padding:8px 14px;border-radius:3px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
</style>

</head>
<body>
<div class="fog" aria-hidden="true"></div>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ DATI ============ */
const KEY='saltmere_v1';
const HOWTO=[
  ['Lo scopo',`Sei un investigatore appena arrivato a Saltmere. Risolvi i casi che ti arrivano per lettera, guadagna denaro e reputazione, e soprattutto scopri chi c'è dietro gli «annegati asciutti» prima della notte della grande marea, il giorno 18.`],
  ['Il tempo',`Ogni giorno ha quattro fasce: mattina, pomeriggio, sera e notte. Quasi ogni azione consuma una fascia. Alcune azioni si possono fare solo di notte, altre solo di giorno. Per recuperare, torna allo studio e dormi: se la notte passa senza che tu dorma, perdi sanità. Ogni sette giorni la signora Pell chiede 6 sterline di affitto.`],
  ['Le risorse',`Le sterline servono per affitto, mance e informazioni. La sanità scende quando vedi cose che non sai spiegare: a 4 o meno compaiono visioni, a 3 o meno anche i tiri peggiorano, a zero la partita finisce. La reputazione apre porte che altrimenti restano chiuse. Le persone ricorrenti (Harrow, Nell Quill, Padre Ambrose, la signora Pell) ricordano come le hai trattate.`],
  ['Muoversi in città',`Nella scheda Città tocca un luogo per vedere cosa puoi fare lì. I pallini verdi indicano azioni legate ai casi aperti, quelli rossi al caso principale. Alcuni luoghi compaiono solo quando servono a un'indagine.`],
  ['Le prove di abilità',`Molte scelte mettono alla prova Osservazione, Persuasione o Sangue freddo: il valore della tua abilità più un dado a sei facce deve raggiungere la difficoltà indicata. Se fallisci, di solito puoi ritentare, ma ti costa altro tempo e a volte sanità o denaro.`],
  ['Indizi e interrogatori',`Gli indizi finiscono nel Taccuino. Negli interrogatori scegli l'approccio: gentilezza, pressione, oppure mettere il testimone davanti a un indizio, che funziona sempre ma richiede di averlo trovato prima.`],
  ['Chiudere un caso',`Quando sei pronto, torna allo studio e scegli «Ricostruisci il caso». Rispondi a chi, come e perché. Una risposta giusta vale di più se hai l'indizio che la sostiene. Poi decidi cosa fare del colpevole: le scelte morali cambiano il finale. Ogni caso ha una scadenza nella scheda Casi.`],
  ['I salvataggi',`La partita si salva da sola dopo ogni scelta, in uno dei tre slot della schermata iniziale. Il salvataggio resta su questo dispositivo e in questo browser. Per spostarlo su un altro dispositivo, o tenerne una copia, usa «Copia codice» e poi «Carica un codice» dall'altra parte. Il pulsante Menu, in alto, riporta alla schermata iniziale.`],
  ['Il caso principale',`Dopo qualche giorno l'ispettore Harrow busserà alla tua porta. I casi minori risolti bene lasciano frammenti che aiutano a capire il mistero. Per un'accusa ti servono abbastanza prove; senza, potrai solo tentare di salvare la prossima vittima.`],
];
const SLOTS=['Mattina','Pomeriggio','Sera','Notte'];
const STATN={oss:'Osservazione',per:'Persuasione',ner:'Sangue freddo'};
const TIDE=18;
const BGS={
  ispettore:{n:`Ex ispettore di Scotland Yard`,d:`Hai lasciato Londra dopo un caso finito male. La polizia ti rispetta; i criminali ti fiutano a un miglio.`,st:{oss:3,per:2,ner:3},san:8,rep:4,money:8,rel:{harrow:2}},
  medico:{n:`Medico chirurgo`,d:`Hai aperto più cadaveri di quanti ne abbia visti un becchino. Puoi leggere un corpo come una lettera.`,st:{oss:3,per:2,ner:2},san:9,rep:3,money:14,rel:{}},
  cronista:{n:`Cronista della Gazette`,d:`Conosci ogni bettola e ogni pettegolezzo del porto. La gente ti parla, anche quando non dovrebbe.`,st:{oss:2,per:4,ner:2},san:8,rep:3,money:9,rel:{nell:2}},
  occultista:{n:`Studioso dell'occulto`,d:`Leggi simboli che gli altri non vedono. Il prezzo è che, a volte, sono loro a vedere te.`,st:{oss:3,per:2,ner:2},san:7,rep:2,money:12,rel:{ambrose:1}},
};
const TRAITS={oss:['Occhio fino','+1 Osservazione'],per:['Lingua sciolta','+1 Persuasione'],ner:['Nervi saldi','+1 Sangue freddo']};

const LOCS={
  studio:{n:`Lo studio`,d:`Lantern Row 7, sopra la merceria della signora Pell.`},
  porto:{n:`Il Porto Vecchio`,d:`Gru, catrame, gabbiani e carbone bagnato.`},
  taverna:{n:`L'Ancora Annegata`,d:`Birra scura, marinai, voci che costano un giro.`},
  polizia:{n:`Commissariato di Wharf Lane`,d:`L'ispettore Harrow e le sue pratiche polverose.`},
  obitorio:{n:`Obitorio dei Marinai`,d:`Piastrelle bianche, acido fenico, silenzio.`},
  archivio:{n:`Registro Marittimo`,d:`Archivio di navi, equipaggi, nascite e naufragi.`},
  chiesa:{n:`St. Brendan sul Molo`,d:`Chiesa dei pescatori. Padre Ambrose tiene accese le candele.`},
  collina:{n:`Ashcombe Hill`,d:`Ville, salotti e cancelli chiusi sopra la nebbia.`},
  villa:{n:`Villa Marlowe`,d:`Edera nera e tende sempre tirate.`,c:()=>act('ritratto')},
  carrow:{n:`Carrow Street 13`,d:`Il salotto delle sedute di Madame Varga, sigillato dalla polizia.`,c:()=>act('seduta')},
  pegni:{n:`Banco dei pegni Voss`,d:`Tre sfere d'ottone sopra una porta stretta.`,c:()=>act('pegno')},
  cripta:{n:`La cripta sommersa`,d:`Sotto le rovine della vecchia St. Brendan. Si raggiunge solo con la bassa marea.`,c:()=>S.main==='attivo'&&has('m_cripta')},
};

const CL={
  // principale
  m_lividi:['main',`Lividi agli angoli della bocca di Fenn, come da un cannello forzato tra i denti.`],
  m_acqua:['main',`Nei polmoni di Fenn c'è acqua di mare limpida, senza sabbia: acqua portata, non un annegamento in mare.`],
  m_spago:['main',`Graffi freschi sul sopraluce della porta di Fenn: la chiave è stata rimessa dentro con uno spago.`],
  m_impronte:['main',`Impronte bagnate attraversano la stanza di Fenn e finiscono contro il muro. Non tornano indietro.`,'odd'],
  m_meridian:['main',`Il Meridian affondò nove anni fa al largo di Gull Point: quaranta morti. Sopravvissuti: Tobias Fenn, Agnes Coyle, Ned Garrow, l'assessore Pryce.`],
  m_assicurazione:['main',`Il Sindacato del Porto incassò l'assicurazione del Meridian. Soci: il capitano di porto Mortimer Gaunt e il dottor Silas Wren.`],
  m_affondato:['main',`Pryce confessa: il Meridian fu affondato di proposito. I sopravvissuti videro le falle aperte dall'interno.`],
  m_cripta:['main',`Qualcuno si riunisce nella cripta della vecchia St. Brendan, che l'alta marea sommerge.`],
  m_simboli:['main',`La campana dentro l'onda è il segno della Marea Grigia. Il loro rito chiede «quaranta per quaranta».`,'odd'],
  m_laudano:['main',`Una boccetta di laudano del dispensario del porto, etichetta firmata «Dott. S. Wren».`],
  m_wren:['main',`Nell: il dottor Wren firma i certificati di morte del porto da dieci anni. Anche quelli di Fenn e Coyle.`],
  m_pompa:['main',`Nella cripta, una pompa gastrica da medico ancora umida d'acqua salata.`],
  m_tavola:['main',`Una tavola delle maree con date scritte a mano: le morti di Fenn e Coyle, e la notte d'equinozio accanto al nome Pryce.`],
  // frammenti dai casi minori
  f_marlowe:['frag',`Lord Marlowe aveva investito nel Sindacato del Porto l'anno del Meridian, e se n'era pentito.`],
  f_luci:['frag',`I contrabbandieri vedono luci sott'acqua sul relitto del Meridian, nelle notti di marea alta.`,'odd'],
  f_gaunt:['frag',`Rook: il capitano di porto Gaunt prende una parte di ogni carico, e paga qualcuno per «tenere chiusa la bocca ai vecchi del Meridian».`],
  f_sindacato:['frag',`La banca Thorne & Blythe custodiva il conto del Sindacato del Porto. Firmatari: Gaunt e Wren.`],
  f_campane:['frag',`Jonah Quayle è annegato sul relitto del Meridian mentre cercava di recuperarne la campana.`],
  f_simbolo:['frag',`Il ciondolo di Ned Garrow: una campana dentro un'onda. Ned dice: «Il dottore lo rivuole.»`],
  // ritratto
  a_tubicino:['ritratto',`Dietro la tela, un tubicino di vetro collegato a due fori all'altezza degli occhi.`],
  a_nerofumo:['ritratto',`Le «lacrime» sono nerofumo sciolto in olio di lino.`],

const CODE_PREFIX='SALTMERE1:';
function encodeSave(v){return CODE_PREFIX+btoa(unescape(encodeURIComponent(JSON.stringify(v))))}

function apply(o){
  if(!o)return;
  if(o.clue)[].concat(o.clue).forEach(addClue);
  if(o.san)S.san=clamp(S.san+o.san,0,S.maxSan);
  if(o.rep)S.rep=clamp(S.rep+o.rep,0,10);
  if(o.money)S.money=Math.max(0,S.money+o.money);
  if(o.rel)for(const k in o.rel)S.rel[k]=clamp(S.rel[k]+o.rel[k],-3,4);
  if(o.flag)[].concat(o.flag).forEach(f=>S.flags[f]=1);
  if(o.fn)o.fn();
}
function roll(stat,diff){
  const d=1+Math.floor(Math.random()*6), v=S.stats[stat], m=S.san<=3?-1:0, tot=v+d+m;
  return {ok:tot>=diff,txt:`${STATN[stat]} ${v} + dado ${d}${m?' − 1 nervi scossi':''} = ${tot} su ${diff} · ${tot>=diff?'riuscito':'fallito'}`};
}

function advance(n){
  for(let i=0;i<n;i++){
    S.slot++;
    if(S.slot>3){S.slot=0;S.day++;S.san=clamp(S.san-1,0,S.maxSan);note(`Hai passato la notte in piedi. L'alba ti trova con gli occhi che bruciano (−1 sanità).`);dayStart()}
  }
}
function sleep(){S.day++;S.slot=0;S.san=clamp(S.san+1,0,S.maxSan);dayStart()}
function dayStart(){
  if(S.day===8||S.day===15){
    if(S.money>=6){S.money-=6;note(`La signora Pell bussa per l'affitto della settimana: 6 sterline. Le conta due volte e ti augura buona giornata.`)}
    else{S.rep=clamp(S.rep-1,0,10);S.rel.pell--;S.san=clamp(S.san-1,0,S.maxSan);note(`Non hai le 6 sterline dell'affitto. La signora Pell lo racconta a mezza Lantern Row (−1 reputazione, −1 sanità).`)}
  }
  for(const id in S.cases){
    const c=S.cases[id];
    if(c.st==='attivo'&&S.day>c.due){c.st='fallito';S.rep=clamp(S.rep-1,0,10);note(`${CASES[id].client} ha smesso di aspettarti. «${CASES[id].title}» resta senza soluzione (−1 reputazione).`);refill()}
  }
  if(S.main==='attivo'&&S.day>=10&&!F('coyle_safe')&&!F('coyle_dead')){
    S.flags.coyle_dead=1;S.san=clamp(S.san-1,0,S.maxSan);
    note(`Harrow ti manda un ragazzo con un biglietto: Agnes Coyle è stata trovata morta nel suo letto, la porta chiusa a chiave. Annegata. Le lenzuola sono asciutte (−1 sanità).`);
  }
  if(S.main==='attivo'&&S.day===TIDE){
    note(`Stanotte è la notte della grande marea d'equinozio.`);
    if(!has('m_cripta')&&S.rel.nell>=1){addClue('m_cripta');note(`Nell Quill ti infila un biglietto sotto la porta: «Ho seguito Gaunt. Scende nella cripta della vecchia St. Brendan. Stanotte. Non andarci da solo.»`)}
  }
}
function refill(){
  const open=S.pool.filter(id=>S.cases[id]&&['offerto','attivo'].includes(S.cases[id].st)).length;
  if(open<2){const n=S.pool.find(id=>!S.cases[id]);if(n){S.cases[n]={st:'offerto'};note(`Una nuova lettera ti aspetta allo studio.`)}}
}
function solvedCount(){return Object.values(S.cases).filter(c=>c.st==='risolto').length}

function afterAction(){
  if(S.ending)return;
  if(S.san<=0){S.ending='dinfna';return}
  if(!S.main&&((solvedCount()>=1&&S.day>=4)||S.day>=6)){S.main='attivo';S.pend.push('mainIntro')}
  if(S.main==='attivo'&&S.day>TIDE){S.ending='tardi'}
}

campana:{
  title:`La Campana delle Tre`,client:`Padre Ambrose`,days:6,fee:10,frag:'f_luci',
  letter:`Grafia tremante su carta da messale. «La campana di St. Brendan suona alle tre di notte e nessuno la tocca. Martedì il sagrestano Amos Penhallow è stato trovato morto ai piedi del campanile. In paese dicono che la campana l'abbia chiamato. Io non ci credo. Ma ho paura.»`,
  actions:[
    {id:'campanile',loc:'chiesa',label:`Sali sul campanile`,run:()=>({t:`Il campanile`,x:`Centoquattro gradini di pietra consumata, viscidi d'umido. Lassù il vento fa vibrare la campana con un ronzio basso, quasi una voce.`,ch:[
      {t:`Arrampicati fino alla cella campanaria`,check:['ner',4],ok:{x:`La corda è stata giuntata di recente: cima catramata, un nodo piano che solo un marinaio fa così. Dalla finestra si vede tutto il porto.`,clue:'b_corda'},ko:{x:`Un gradino cede sotto il piede. Ti aggrappi alla corda e la campana dà un rintocco sordo che ti entra nelle ossa. Scendi.`,san:-1,retry:true}},
    ]})},
    {id:'kit',loc:'chiesa',label:`Parla con Kit, il ragazzo muto`,run:()=>({t:`Kit`,x:`Kit avrà dieci anni. Serve messa, pulisce i candelieri, non parla da quando l'hanno ripescato dal porto da piccolo. Ti guarda come un gatto randagio.`,ch:[
      {t:`Dagli carta e un pezzo di carbone`,check:['per',4],ok:{x:`Disegna a lungo. Un uomo con una lanterna sul campanile. Sul polso, un amo da pesca. Poi una figura che cade.`,clue:'b_disegno'},ko:{x:`Kit scarabocchia un'onda enorme, poi strappa il foglio e scappa in sagrestia.`,retry:true}},
      {t:`Portagli un pasticcio caldo dalla taverna`,cost:1,ok:{x:`Mangia senza alzare gli occhi, poi prende il carbone da solo. Un uomo con una lanterna. Un amo tatuato sul polso. Una figura che cade. Padre Ambrose, sulla porta, ti guarda in un altro modo.`,clue:'b_disegno',rel:{ambrose:1}}},
      {t:`Insisti: deve dirti cosa ha visto`,ok:{x:`Kit si irrigidisce, poi scappa nella nebbia. Non lo rivedrai per giorni.`,flag:'kit_fuga'}},
    ]})},
    {id:'moli',loc:'porto',notte:true,label:`Apposta sui moli alle tre`,run:()=>({t:`Le tre di notte`,x:`Nebbia fitta come lana. Dietro di te, St. Brendan. Alle tre in punto, la campana suona.`,ch:[
      {t:`Resta immobile e guarda il largo`,check:['ner',5],ok:{x:`Una, due, tre lanterne si accendono sull'acqua, molto al largo, e una barca senza luci scivola verso il molo vecchio. Riconosci la sagoma di Dunstan Rook, il pescatore.`,clue:'b_barca'},ko:{x:`Un passo dietro di te. Un colpo alla nuca. Ti risvegli sulle assi bagnate, senza portafoglio.`,money:-2,san:-1,retry:true}},
    ]})},
    {id:'rook',loc:'taverna',label:`Interroga Dunstan Rook`,run:()=>({t:`Dunstan Rook`,x:`Rook occupa un tavolo intero con le spalle. Ha le maniche abbassate fino alle nocche.`,ch:[
      {t:`Offrigli rum e ascolta`,check:['per',6],cost:1,ok:{x:`Al terzo rum si tira su la manica per grattarsi: un amo tatuato sul polso. «Sì, la campana è il mio segnale. Ma il vecchio Amos non l'ho toccato.»`,clue:'b_tatuaggio'},ko:{x:`Beve il tuo rum e non dice una parola.`,retry:true}},
      {t:`Butta sul tavolo un pezzo della corda catramata`,need:()=>has('b_corda')||has('b_barca'),why:`serve un indizio`,ok:{x:`Rook fissa la corda, poi te. Si scopre il polso: l'amo. «Sì, la campana è mia. Il segnale per le barche. Ma Amos è caduto. È caduto, capito?»`,clue:'b_tatuaggio'}},
      {t:`Afferragli il polso`,check:['ner',6],ok:{x:`Gli strappi la manica: un amo tatuato. Per un attimo vedi il pugno partire, poi ci ripensa. «Il segnale è mio. Il resto no.»`,clue:'b_tatuaggio'},ko:{x:`Ti scaraventa contro il bancone. La taverna intera ride.`,rep:-1,san:-1,retry:true}},
    ]})},
    {id:'amos',loc:'obitorio',label:`Esamina il corpo di Amos Penhallow`,run:()=>({t:`L'obitorio`,x:`Amos Penhallow è piccolo e grigio sotto il lenzuolo. Il collo è spezzato come quello di un uccello.`,ch:autopsy()?[
      {t:`Esamina il corpo da medico`,ok:{x:`Ai polsi, quattro lividi ovali per lato: dita. Qualcuno lo ha afferrato con forza prima della caduta.`,clue:'b_lividi'}}]:[
      {t:`Osserva con attenzione mani e braccia`,check:['oss',5],ok:{x:`Ai polsi, lividi a forma di dita. Qualcuno lo ha afferrato prima della caduta.`,clue:'b_lividi'},ko:{x:`Vedi solo un vecchio morto. L'inserviente ti chiede di uscire.`,retry:true}},
    ]})},
  ],
  deduce:[
    {q:`Chi ha ucciso Amos Penhallow?`,o:[[`Dunstan Rook, il pescatore`,1,['b_tatuaggio','b_disegno']],[`Kit, il ragazzo muto`,0],[`Nessuno: è scivolato`,0],[`La campana, che chiama i suoi`,0]]},
    {q:`Come è morto?`,o:[[`Afferrato e spinto giù dalle scale`,1,['b_lividi']],[`Scivolato sui gradini bagnati`,0],[`Morto di paura prima di cadere`,0]]},
    {q:`Perché?`,o:[[`Aveva scoperto il segnale dei contrabbandieri`,1,['b_barca','b_corda']],[`Un debito di gioco`,0],[`Aveva visto qualcosa nell'acqua`,0]]},
  ],
  finale:ok=>ok?{t:`Il molo vecchio, sotto la pioggia`,x:`Rook non scappa. Si siede su una bitta e si guarda le mani.\n\n«Amos voleva andare dalla polizia. L'ho preso per i polsi, solo per parlargli. Il gradino era bagnato.» Alza gli occhi. «Mio fratello è annegato sul Meridian. Mantengo sua moglie e tre bambini. E so cose che a voi servono, ${tit()}. Su chi comanda in questo porto.»`,ch:[
      {t:`Consegnalo a Harrow`,ok:{x:`Rook allunga i polsi da solo. Padre Ambrose suona la campana a mezzogiorno, per la prima volta dopo una settimana.`,rep:1,rel:{harrow:1,ambrose:1},flag:'cam_arresto'}},
      {t:`Lascialo andare in cambio di quello che sa`,ok:{x:`«Gaunt. Il capitano di porto. Prende la sua parte di ogni carico e paga qualcuno per tenere chiusa la bocca ai vecchi del Meridian.» All'alba la barca di Rook non c'è più. Padre Ambrose non te lo perdona.`,clue:'f_gaunt',rel:{harrow:-1,ambrose:-1},flag:'cam_fuga'}},
    ]}:{t:`St. Brendan`,x:`La tua versione convince qualcuno, ma non Padre Ambrose. La campana continua a suonare alle tre, e lui smette di salutarti.`,ch:[],rel:{ambrose:-1}},
},
seduta:{
  title:`La Seduta di Carrow Street`,client:`Nell Quill, per Madame Varga`,days:6,fee:12,frag:'f_sindacato',
  letter:`«Hanno arrestato Madame Ysolde Varga, la medium di Carrow Street: il banchiere Edmund Thorne è morto durante una sua seduta. La città vuole una strega da impiccare. Lei giura di essere innocente e mi ha chiesto qualcuno che non creda ai fantasmi. Pago io. — N. Quill, Saltmere Gazette»`,
  actions:[
    {id:'sala',loc:'carrow',label:`Esamina la sala delle sedute`,run:()=>({t:`Il salotto di Madame Varga`,x:`Velluto viola, un tavolo rotondo, sei sedie, una sfera di vetro coperta da un panno. Sei bicchieri ancora sul tavolo: la polizia non ha toccato niente.`,ch:[
      {t:`Ispeziona il tavolo e la stanza`,check:['oss',5],ok:{x:`Sotto il tavolo, dalla parte della medium, un pedale collegato a un martelletto: i «colpi degli spiriti». E il bicchiere di Thorne ha un odore amaro che gli altri non hanno.`,clue:['c_meccanismo','c_bicchiere']},ko:{x:`Ti siedi al posto di Thorne, al buio. Qualcosa batte tre colpi sotto il tavolo. Ti alzi di scatto.`,san:-1,retry:true}},
      {t:`Annusa uno per uno i bicchieri`,ok:{x:`Brandy, brandy, brandy. Quello di Thorne ha sotto un odore amaro, erbaceo.`,clue:'c_bicchiere'}},
    ]})},
    {id:'varga',loc:'polizia',label:`Visita Madame Varga in cella`,run:()=>({t:`La cella numero tre`,x:`Senza turbante e senza gioielli, Ysolde Varga sembra una sarta stanca. Solo gli occhi sono ancora da medium.`,ch:[
      {t:`Ascoltala con pazienza`,check:['per',4],ok:{x:`«Il brandy l'ha portato Cornelius Blythe, il socio di Thorne. Un regalo, ha detto. Ha versato lui.»`,clue:'c_varga'},ko:{x:`Ti parla per un'ora di spiriti e aure. Non ne ricavi nulla.`,retry:true}},
      {t:`Dille che sai del pedale`,need:()=>has('c_meccanismo'),why:`serve un indizio`,ok:{x:`Ride, finalmente sincera. «Allora sapete che sono una ladra, non un'assassina.» Ti racconta tutto: Blythe, il brandy, il bicchiere riempito per primo.`,clue:'c_varga',flag:'varga_ammette'}},
      {t:`Spaventala: la forca è vicina`,check:['ner',5],ok:{x:`Trema. «Blythe! Il brandy l'ha portato Blythe!» Non ti perdonerà facilmente.`,clue:'c_varga',flag:'varga_odio'},ko:{x:`«Le ho viste, le forche, signore. Non mi fanno più paura di voi.» Chiama la guardia.`,retry:true}},
    ]})},
    {id:'thorne',loc:'obitorio',label:`Esamina il corpo di Edmund Thorne`,run:()=>({t:`L'obitorio`,x:`Edmund Thorne, sessant'anni, una vita di cene abbondanti. Il coroner ha scritto «arresto cardiaco per forte emozione».`,ch:autopsy()?[
      {t:`Esamina il cuore`,ok:{x:`Pupille anomale, cuore dilatato, rallentato fino a fermarsi. Digitale. Molta.`,clue:'c_digitale'}}]:[
      {t:`Chiedi di vedere il referto completo`,check:['oss',6],ok:{x:`Tra le note a margine: pupille gialle, vomito, polso rallentato. Sintomi da digitale.`,clue:'c_digitale'},ko:{x:`Il referto è un muro di latino e abbreviazioni.`,retry:true}},
      {t:`Paga l'inserviente perché te lo spieghi`,cost:2,ok:{x:`«Il dottore ha detto: questo è veleno di digitale, ma il coroner non vuole grane.»`,clue:'c_digitale'}},
    ]})},
    {id:'clara',loc:'collina',label:`Fai visita a Clara Thorne`,run:()=>({t:`Casa Thorne`,x:`Clara Thorne porta il lutto come un'uniforme. Ti riceve in piedi.`,ch:[
      {t:`Parlale del padre, non della morte`,check:['per',5],ok:{x:`Si siede, alla fine. «Papà aveva trovato un ammanco nei conti della banca. Doveva parlarne con Blythe quella stessa settimana.»`,clue:'c_libri'},ko:{x:`«Avete cinque minuti.» Ne usi quattro male.`,retry:true}},
    ]})},
    {id:'hobb',loc:'porto',label:`Visita la farmacia Hobb`,run:()=>({t:`Farmacia Hobb`,x:`Vasi di porcellana, sanguisughe in un barattolo, un garzone foruncoloso dietro il banco.`,ch:[
      {t:`Allunga due sterline al garzone`,cost:2,ok:{x:`Sfoglia il registro dei veleni. «Tintura di digitale. Signor C. Blythe. Per il cuore, ha detto.» Tre giorni prima della seduta.`,clue:'c_acquisto'}},
      {t:`Esigi il registro dei veleni`,need:()=>S.rep>=5||S.bg==='ispettore',why:`reputazione 5`,ok:{x:`Il garzone non osa discutere. «Signor C. Blythe, tintura di digitale», tre giorni prima della seduta.`,clue:'c_acquisto'}},
    ]})},
  ],
  deduce:[
    {q:`Chi ha ucciso Edmund Thorne?`,o:[[`Cornelius Blythe, il socio`,1,['c_varga','c_acquisto']],[`Madame Varga`,0],[`Clara Thorne, la figlia`,0],[`Lo spirito evocato`,0]]},
    {q:`Come?`,o:[[`Digitale versata nel brandy`,1,['c_digitale','c_bicchiere']],[`Lo spavento della seduta`,0],[`Arsenico nel tè della medium`,0]]},
    {q:`Perché?`,o:[[`Thorne aveva scoperto un ammanco nei conti`,1,['c_libri']],[`Per l'eredità`,0],[`Per vendicare un vecchio torto`,0]]},
  ],
  finale:ok=>ok?{t:`Uscita dal carcere`,x:`Blythe viene arrestato nel suo ufficio, con la penna ancora in mano. Madame Varga esce dalla cella al tramonto, si sistema il turbante e ti sorride.\n\nNell Quill ha già il taccuino aperto. «Allora, ${tit()}: la scriviamo tutta, la storia?»`,ch:[
      {t:`Sì, anche la truffa del pedale`,ok:{x:`La storia esce in prima pagina. Varga lascia Saltmere entro la settimana; Nell ti offre da bere per un mese.`,rep:1,rel:{nell:1},flag:'sed_smaschera'}},
      {t:`Lascia fuori i trucchi di Varga`,ok:{x:`Nell storce il naso ma obbedisce. Varga ti mette in mano cinque sterline. «Vi devo una lettura. Una vera, stavolta.»`,money:5,rel:{nell:-1},flag:'varga_debt'}},
    ]}:{t:`Carrow Street`,x:`La tua ricostruzione non regge. Madame Varga resta in cella; Nell ti restituisce il fascicolo senza dire una parola.`,ch:[],rel:{nell:-2}},
},
marinaio:{
  title:`Il Marinaio Tornato`,client:`Hester Quayle`,days:7,fee:8,frag:'f_campane',
  letter:`Una grafia incerta, da chi ha imparato tardi. «Mio marito Jonah è annegato due anni fa. Il mese scorso è tornato a casa. Ha la sua faccia, la sua voce. I bambini sono felici. Io no. Non so chi dorme nel mio letto.»`,
  actions:[
    {id:'osserva',loc:'porto',label:`Osserva «Jonah» al lavoro sul molo`,run:()=>({t:`Il molo delle reti`,x:`Jonah Quayle ricuce reti con altri tre uomini. Ride poco, lavora il doppio.`,ch:[
      {t:`Studia ogni gesto`,check:['oss',5],ok:{x:`Annoda con la sinistra. Firma il registro della paga con la sinistra. Hester ti ha detto che il marito era destro.`,clue:'d_mancino'},ko:{x:`Ti nota. Ti fissa a lungo. Ti allontani.`,retry:true}},
    ]})},
    {id:'battesimi',loc:'archivio',label:`Cerca i Quayle nei registri di battesimo`,run:()=>({t:`I registri parrocchiali`,x:`Volumi rilegati in pelle, nascite e morti di tre generazioni di pescatori.`,ch:[
      {t:`Sfoglia l'anno di nascita di Jonah`,check:['oss',4],ok:{x:`Quayle, Jonah. E subito sotto, stessa data: Quayle, Elias. Gemelli. A margine: «emigrato a Halifax».`,clue:'d_gemelli'},ko:{x:`Un'ora di nomi. Nessun Quayle.`,retry:true}},
    ]})},
    {id:'ambrose',loc:'chiesa',label:`Chiedi a Padre Ambrose delle vedove del porto`,run:()=>({t:`La sagrestia`,x:`Padre Ambrose ti offre un tè annacquato.`,ch:[
      {t:`Chiedigli dei Quayle`,ok:{x:`«Da un mese qualcuno lascia denaro per le vedove del porto, nella cassetta. Ho visto chi è, una sera. Jonah Quayle.» Esita. «Un uomo che torna dalla morte e pensa prima alle vedove degli altri.»`,clue:'d_soldi'}},
    ]})},
    {id:'kittiwake',loc:'taverna',label:`Ascolta i vecchi della Kittiwake`,run:()=>({t:`Il tavolo dei vecchi`,x:`Tre marinai della Kittiwake, la barca su cui Jonah scomparve.`,ch:[
      {t:`Offri un giro`,cost:1,ok:{x:`«Jonah voleva la campana del Meridian. Diceva che valeva una fortuna in bronzo. Si è immerso sul relitto e non è più risalito. Poi la barca ha imbarcato acqua.» Uno si fa il segno della croce. «Mentre affondavamo, sotto di noi suonava.»`,clue:'d_relitto'}},
    ]})},
    {id:'parla',loc:'porto',label:`Parla con «Jonah»`,run:()=>({t:`Casa Quayle, a sera`,x:`Jonah ti fa entrare. I bambini dormono di là. Ti versa un bicchiere d'acqua e non si siede.`,ch:[
      {t:`Chiedigli con calma chi è`,check:['per',5],ok:{x:`Resta in silenzio a lungo. «Sono Elias. Jonah è morto. Gli avevo promesso che se fosse successo qualcosa avrei pensato io a loro.»`,clue:'d_confessione'},ko:{x:`«Sono Jonah Quayle. E lei è in casa mia.»`,retry:true}},
      {t:`Mostragli il registro dei battesimi`,need:()=>has('d_gemelli'),why:`serve un indizio`,ok:{x:`Lo guarda, poi chiude gli occhi. «Sono Elias. Jonah è annegato. Gli avevo promesso che avrei pensato io a loro.»`,clue:'d_confessione'}},
      {t:`Smascheralo davanti ai bambini`,check:['ner',4],ok:{x:`Il più piccolo comincia a piangere. Lui confessa per farlo smettere: «Sono Elias. Jonah è morto.» Hester, sulla porta, ti guarda come un nemico.`,clue:'d_confessione',flag:'mar_crudele'},ko:{x:`Ti mette alla porta senza alzare la voce.`,retry:true}},
    ]})},
  ],
  deduce:[
    {q:`Chi è l'uomo tornato?`,o:[[`Elias Quayle, il gemello`,1,['d_gemelli','d_confessione']],[`Jonah, sopravvissuto al naufragio`,0],[`Un truffatore estraneo`,0],[`Un annegato restituito dal mare`,0]]},
    {q:`Cosa lo tradisce?`,o:[[`Usa la mano sinistra; Jonah era destro`,1,['d_mancino']],[`Non ricorda i nomi dei figli`,0],[`Non proietta ombra`,0]]},
    {q:`Perché lo fa?`,o:[[`Per mantenere la famiglia del fratello`,1,['d_soldi','d_confessione']],[`Per prendersi la casa`,0],[`Per sfuggire alla legge`,0]]},
  ],
  finale:ok=>ok?{t:`Davanti a casa Quayle`,x:`Elias ti accompagna fuori. «Le chiedo una cosa sola. Decida lei cosa dire a Hester. Io accetterò.»`,ch:[
      {t:`Di' a Hester tutta la verità`,ok:{x:`Hester ascolta in silenzio. Poi va in cucina e apparecchia per quattro, come ogni sera. Non saprai mai cosa si sono detti.`,rep:1,flag:'mar_verita'}},
      {t:`Custodisci il segreto`,ok:{x:`Dici a Hester che l'uomo è suo marito, cambiato dal mare. Lei annuisce. Forse ti crede. Forse ha deciso di crederti.`,san:1,rel:{ambrose:1},flag:'mar_segreto'}},
      {t:`Denuncialo per frode`,ok:{x:`Elias viene arrestato per usurpazione d'identità. Hester perde la pensione da vedova e il secondo marito nello stesso giorno.`,rel:{harrow:1},san:-1,flag:'mar_denuncia'}},
    ]}:{t:`Casa Quayle`,x:`La tua conclusione sbagliata finisce in un verbale. Hester ti paga quello che può. L'uomo che dorme nel suo letto ti guarda passare dal molo, ogni giorno.`,ch:[]},
},
pegno:{
  title:`Il Pegno di Mr. Voss`,client:`Ezra Voss`,days:6,fee:12,frag:'f_simbolo',
  letter:`Inchiostro verde, grafia da contabile. «Qualcuno ha forzato il mio banco stanotte. Ha lasciato l'argenteria e la cassa. Ha preso solo un ciondolo da quattro soldi impegnato da un marinaio. Voglio sapere chi entra in casa mia per rubare spazzatura. Pago bene. — E. Voss»`,
  actions:[
    {id:'finestra',loc:'pegni',label:`Esamina la finestra forzata`,run:()=>({t:`Il retrobottega`,x:`Una finestra con il vetro in frantumi, la serratura intatta, la polvere di mesi sugli scaffali.`,ch:[
      {t:`Guarda dove sono caduti i vetri`,check:['oss',4],ok:{x:`I frammenti sono quasi tutti fuori, sul selciato. La finestra è stata rotta dall'interno.`,clue:'e_finto'},ko:{x:`Vetri dappertutto. Ti tagli un dito.`,retry:true}},
    ]})},
    {id:'registro',loc:'pegni',label:`Consulta il registro dei pegni`,run:()=>({t:`Il registro`,x:`Voss ti porge il registro con le dita guantate.`,ch:[
      {t:`Cerca la voce del ciondolo`,ok:{x:`«Ciondolo d'argento, campana e onda. Ned Garrow, marinaio.» Il nome lo conosci: è uno dei sopravvissuti del Meridian.`,clue:'e_ned'}},
    ]})},
    {id:'lucy',loc:'pegni',label:`Interroga Lucy Marsh, l'apprendista`,run:()=>({t:`Lucy Marsh`,x:`Lucy ha le unghie mangiate e un nastro nuovo nei capelli.`,ch:[
      {t:`Complimentati per il nastro e falla parlare`,check:['per',5],ok:{x:`Arrossisce, poi crolla. «Un signore. Cinque sterline per aprire la finestra e romperla da dentro. Non ha preso altro, lo giuro.»`,clue:'e_lucy'},ko:{x:`«È un regalo di mia zia.» Torna al banco.`,retry:true}},
      {t:`Mostrale dove sono caduti i vetri`,need:()=>has('e_finto'),why:`serve un indizio`,ok:{x:`Si copre la faccia. «Un signore mi ha dato cinque sterline. Aveva una borsa da dottore e odorava come l'ospedale.»`,clue:['e_lucy','e_borsa']}},
      {t:`Minacciala con la polizia`,check:['ner',4],ok:{x:`Confessa piangendo: cinque sterline da un signore per aprire la finestra. Del signore non sa altro, o non lo dirà a te.`,clue:'e_lucy',flag:'lucy_odio'},ko:{x:`Voss interviene: «In casa mia non si urla.»`,retry:true}},
    ]})},
    {id:'ned',loc:'taverna',label:`Cerca Ned Garrow`,if:()=>has('e_ned'),run:()=>({t:`Il retro dell'Ancora`,x:`Ned Garrow si nasconde nel ripostiglio della birra, magro come una cima, gli occhi che vanno alla porta ogni tre secondi.`,ch:[
      {t:`Convincilo che sei dalla sua parte`,check:['per',5],ok:{x:`«L'ho rubato a lui. Al dottore. Volevo una prova. Una campana dentro un'onda: è il loro segno. Poi ho avuto paura e l'ho impegnato.» Trema. «Il dottore lo rivuole.»`,clue:'e_simbolo',next:nedShelter},ko:{x:`Scivola via dalla porta di servizio.`,retry:true}},
      {t:`Pagagli una notte di letto e una cena`,cost:2,ok:{x:`Mangia come un lupo, poi parla. «Il ciondolo l'ho rubato al dottore. Volevo una prova. È il loro segno, la campana nell'onda.»`,clue:'e_simbolo',next:nedShelter}},
    ]})},
  ],
  deduce:[
    {q:`Chi ha aperto il banco?`,o:[[`Lucy Marsh, l'apprendista`,1,['e_lucy','e_finto']],[`Ned Garrow`,0],[`Un ladro di passaggio`,0],[`Voss stesso, per l'assicurazione`,0]]},
    {q:`Chi l'ha pagata?`,o:[[`Un gentiluomo con una borsa da medico`,1,['e_borsa']],[`Ned Garrow`,0],[`Nessuno: ha agito da sola`,0]]},
    {q:`Perché proprio quel ciondolo?`,o:[[`È il segno di una confraternita che vuole restare nascosta`,1,['e_simbolo']],[`È argento massiccio`,0],[`Voss l'aveva promesso a un collezionista`,0]]},
  ],
  finale:ok=>ok?{t:`Il banco dei pegni`,x:`Voss ascolta tutto con le mani giunte. «La ragazza va in prigione. Il resto non mi interessa.»\n\nLucy, dietro il banco, ha smesso di respirare.`,ch:[
      {t:`Consegnala alla polizia`,ok:{x:`Lucy esce in manette. Voss paga fino all'ultimo penny.`,rep:1,rel:{harrow:1},flag:'peg_arresto'}},
      {t:`Convinci Voss a tenerla, in cambio di uno sconto`,ok:{x:`Voss accetta, tagliando quattro sterline dalla parcella. Lucy ti raggiunge in strada: «Quel signore lo rivedrò. Al dispensario del porto. Se serve, lo riconosco davanti a chiunque.»`,money:-4,flag:'lucy_ally'}},

function proofs(){
  const keys=['m_pompa','m_laudano','m_tavola','m_spago','m_wren','m_affondato','m_assicurazione','f_sindacato','f_simbolo','f_gaunt'];
  let n=keys.filter(has).length;
  if(has('m_lividi')||has('m_acqua'))n++;
  if(F('ned_safe'))n++; if(F('lucy_ally'))n++; if(F('coyle_safe'))n++;
  return n;
}
const NEED=5;
function harrowWith(){return S.rel.harrow>=2||S.rep>=6}
function finale(skipOffer){
  const hw=harrowWith(), p=proofs();
  const ch=[
    {t:`Accusali, prove alla mano`,tag:`${Math.min(p,NEED)}/${NEED} prove`,need:()=>p>=NEED,why:`servono ${NEED} prove`,...(hw?{ok:{fn:()=>S.ending='nebbia'}}:{check:['ner',6],ok:{fn:()=>S.ending='nebbia'},ko:{fn:()=>{S.flags.wren_fuga=1;S.ending='marea'}}})},
    {t:`Taglia le corde di Pryce e trascinalo fuori`,check:['ner',5],ok:{fn:()=>S.ending='marea'},ko:{fn:()=>{S.flags.pryce_morto=1;S.san=clamp(S.san-2,0,10);S.ending='marea'}}},
  ];
  if(!skipOffer)ch.push({t:`Ascolta l'offerta di Gaunt`,ok:{next:offerta}});
  if(S.san<=4)ch.push({t:`Ascolta la campana`,ok:{fn:()=>S.ending='abisso'}});
  return {t:`La notte della marea`,x:`L'acqua nella cripta ti arriva alle ginocchia e sale. Le candele galleggiano su tavolette di sughero. Una dozzina di figure in grigio. Pryce è legato all'altare, la bocca forzata da un morso di cuoio.\n\nIl dottor Silas Wren sta riempiendo la pompa da un secchio. Mortimer Gaunt ti vede per primo.\n\n«${tit()}. Quaranta per quaranta. Il mare vuole che i conti si chiudano.»\n\nSotto l'acqua, distinta, suona una campana.${hw?`\n\nDietro di te, sugli scalini, l'ispettore Harrow e due agenti con le lanterne coperte.`:`\n\nNessuno è venuto con te.`}`,ch};
}
function offerta(){return {t:`L'offerta`,x:`Gaunt si avvicina nell'acqua, tranquillo. «Trecento sterline. Sono più di quanto guadagnerà in dieci anni di mariti infedeli e ritratti che piangono. Domani lei lascia Saltmere, e il mare chiude il suo conto. Nessuno saprà niente.»`,ch:[
  {t:`Accetta`,ok:{fn:()=>{S.money+=300;S.ending='oro'}}},
  {t:`Rifiuta`,ok:{next:()=>finale(true)}},
]}}

/* ============ SCENE IN SOSPESO ============ */
const PEND={
  guida:()=>({t:`Come si gioca`,x:HOWTO.map(([h,t])=>`<b>${h}.</b> ${t}`).join('\n\n'),ch:[]}),
  prologo:()=>({t:`Saltmere, autunno 1887`,x:`La diligenza ti lascia sul lungomare all'imbrunire. Saltmere: un porto che puzza di catrame e di pesce, chiese annerite, una collina di ville che guarda il mare dall'alto senza mai scendere a toccarlo.\n\nHai preso in affitto due stanze a Lantern Row, sopra la merceria della signora Pell. Sulla porta, una targa d'ottone ancora lucida: ${ESC(S.name)}, indagini riservate.\n\nLa signora Pell ti consegna le chiavi e un consiglio: «Qui la gente ha due paure, ${tit()}. Il mare e chi fa domande. Lei farà domande.»\n\nSullo scrittoio ti aspettano già due lettere.`,ch:[]}),
  mainIntro:()=>({t:`Un colpo alla porta`,x:`L'ispettore Harrow è sulla soglia, il cappello gocciolante.\n\n«Tobias Fenn, cordaio. Trovato stamattina nel suo letto, a Rope Walk. Porta chiusa a chiave dall'interno, finestra sbarrata, secondo piano. Annegato. Polmoni pieni d'acqua di mare. E i vestiti asciutti.»\n\nSi guarda le scarpe. «Il coroner scriverà "accidentale". Io vorrei avere un motivo per non firmare. In paese li chiamano già gli annegati asciutti.»\n\nPrima di andare si volta. «Padre Ambrose dice che la notte del giorno ${TIDE} c'è la grande marea d'equinozio. Dice che dovrei preoccuparmene. Io non so perché.»`,ch:[]}),
};

const ENDINGS={
  nebbia:()=>({h:`La Nebbia si Alza`,x:`${harrowWith()?`Harrow e i suoi agenti scendono nell'acqua mentre tu elenchi le prove ad alta voce, una per una, come un rosario.`:`Non hai Harrow alle spalle, solo le prove e la voce. Le elenchi una per una, come un rosario, finché le figure in grigio cominciano a guardarsi tra loro.`} Il primo a cedere non è Wren ma Gaunt: si toglie il cappuccio e alza le mani.\n\nAl processo, Gaunt confessa il Meridian. Quaranta morti per una polizza. Wren non dice una parola in tre giorni di udienze; il giudice lo condanna all'impiccagione. Pryce testimonia piangendo${F('ned_safe')?`, e accanto a lui Ned Garrow, vivo, pallido, finalmente creduto`:''}.\n\nLa Gazette ti chiama «la persona più ostinata di Saltmere». La signora Pell incornicia l'articolo.`,coda:`La notte dell'esecuzione di Wren, la marea è stranamente alta. Rientri a Lantern Row e trovi sul pavimento dello studio una fila di impronte bagnate. Entrano dalla porta. Si fermano davanti al tuo scrittoio. Non escono.`}),
  marea:()=>({h:`Marea Calante`,x:F('pryce_morto')?`L'acqua sale troppo in fretta. Tagli la prima corda, la seconda ti scivola dalle dita, e quando riemergi con Pryce tra le braccia lui non respira più. Le figure in grigio sono sparite nella nebbia.\n\nIl coroner scrive «annegamento accidentale». Harrow firma senza guardarti.`:`Trascini Pryce su per gli scalini mentre l'acqua invade la cripta. Dietro di te, le candele si spengono una dopo l'altra.${F('wren_fuga')?` Wren si getta nell'acqua nera e non riemerge.`:''}\n\nPryce vive. Gaunt si dimette per motivi di salute e lascia Saltmere. ${F('wren_fuga')?`Il corpo di Wren non viene mai trovato.`:`Wren continua a firmare certificati di morte al dispensario del porto, e ti saluta togliendosi il cappello.`} Non ci sono prove sufficienti per un processo.`,coda:`Ogni notte di marea alta, da Lantern Row, senti suonare una campana al largo di Gull Point. Hai contato i rintocchi, una volta. Erano trentanove.`}),
  oro:()=>({h:`L'Oro del Sindacato`,x:`Risali gli scalini con trecento sterline nel cappotto. Dietro di te, l'acqua copre l'altare. Non ti volti.\n\nLasci Saltmere il giorno dopo. Apri uno studio a Londra, poi un altro a Manchester. Gli affari vanno bene. Pryce viene trovato annegato nel suo letto, asciutto, e nessuno ti chiede niente.`,coda:`Dove vai, l'acqua dei rubinetti sa di sale. I medici dicono che è suggestione. Tu dormi con la luce accesa e un catino vuoto accanto al letto, rovesciato, per sicurezza.`}),
  abisso:()=>({h:`Quaranta per Quaranta`,x:`La campana suona sotto l'acqua, e finalmente capisci le parole. Non è un richiamo, è un conteggio. Trentotto. Trentanove.\n\nPosi la lanterna. Wren ti guarda con qualcosa di simile alla pietà. Scendi i gradini dell'altare, nell'acqua che sale, e il freddo è meno freddo di quanto pensavi.`,coda:`Il mattino dopo Pryce viene trovato vivo sull'altare, slegato, in una cripta vuota. Della persona che indagava sugli annegati asciutti restano solo un cappotto piegato con cura e, sui gradini, una fila di impronte bagnate che scende nell'acqua. Quaranta.`}),
  dinfna:()=>({h:`Il Ricovero di Santa Dinfna`,x:`Hai smesso di dormire, poi di mangiare, poi di distinguere la pioggia dalla voce che ti chiama per nome. La signora Pell ti trova nello studio con la finestra spalancata, a contare le onde.\n\nIl ricovero di Santa Dinfna ha stanze bianche e infermiere gentili. Ti lasciano tenere il taccuino. Ci scrivi sempre la stessa cosa.`,coda:`Le infermiere dicono che di notte, nella tua stanza, il pavimento è sempre bagnato.`}),
  tardi:()=>({h:`Troppo Tardi`,x:`La notte d'equinozio passa senza che tu sappia dove guardare. All'alba, Harrow bussa alla tua porta.\n\nL'assessore Pryce è stato trovato annegato nella sua casa con le finestre murate. Asciutto.\n\n«Il coroner scriverà "accidentale"», dice Harrow. «E stavolta firmo.»`,coda:`Al largo di Gull Point, quella notte, i pescatori hanno sentito la campana del Meridian suonare a lungo. Poi più niente.`}),
};

/* ============ RENDER ============ */
function statusBar(){
  const pips=(n,max,cls='')=>Array.from({length:max},(_,i)=>`<span class="pip ${cls} ${i<n?'on':''}"></span>`).join('');
  return `<div class="bar"><div class="bar-row"><div class="when">Giorno ${S.day}<small>${SLOTS[S.slot]}</small></div><div class="bar-right"><div class="purse">£ ${S.money}</div>${!UI.scene&&!UI.ded?'<button class="menu" data-menu>Menu</button>':''}</div></div>
  <div class="meters"><div class="meter ${S.san<=3?'low':''}" title="Sanità ${S.san} su ${S.maxSan}">Sanità <span class="pips">${pips(S.san,S.maxSan)}</span></div>
  <div class="meter" title="Reputazione ${S.rep} su 10">Reputazione <span class="pips">${pips(S.rep,10,'rep')}</span></div></div>
  ${S.main==='attivo'?`<div class="tide">Marea d'equinozio: ${S.day<TIDE?`tra ${TIDE-S.day} ${TIDE-S.day===1?'giorno':'giorni'}`:'stanotte'}</div>`:''}</div>`;
}
function para(t){return String(t||'').split('\n\n').filter(Boolean).map(p=>`<p>${p}</p>`).join('')}

function render(){
  const app=$('#app');
  if(!S){app.innerHTML=UI.confirm?confirmView():UI.howto?howtoView(true):UI.creating?createView():titleView();bindTitle();window.scrollTo(0,0);return}
  if(S.ending){app.innerHTML=endingView();return}
  if(!UI.scene&&S.pend.length){const k=S.pend.shift();UI.cur=null;UI.scene=PEND[k]();UI.scene.pend=true;save()}
  let body='';
  if(UI.scene)body=sceneView(UI.scene);

  else{
    const tabs=[['citta','Città'],['casi','Casi'],['taccuino','Taccuino'],['guida','Guida']];

function newGame(name,t,bg,tr,slotN){
  const b=BGS[bg];
  S={v:1,saveSlot:slotN||1,name,tit:t,bg,stats:{...b.st},san:b.san,maxSan:10,rep:b.rep,money:b.money,day:1,slot:0,
    clues:[],flags:{},done:{},rel:Object.assign({harrow:0,nell:0,ambrose:0,pell:1},b.rel),
    pool:shuffle(Object.keys(CASES)).slice(0,3),cases:{},main:null,notes:[],pend:['guida','prologo'],ending:null};

function visibleLocs(){return Object.keys(LOCS).filter(k=>!LOCS[k].c||LOCS[k].c())}
function actionsAt(loc){
  const list=(GENERIC[loc]||[]).map(a=>({...a,key:'g.'+a.id,once:false}));
  for(const id in S.cases){if(S.cases[id].st!=='attivo')continue;CASES[id].actions.forEach(a=>{if(a.loc===loc)list.push({...a,key:id+'.'+a.id,caseId:id})})}
  if(S.main==='attivo')MAIN.actions.forEach(a=>{if(a.loc===loc)list.push({...a,key:'main.'+a.id,caseId:'main'})});
  if(loc==='studio')for(const id in S.cases)if(S.cases[id].st==='attivo')list.push({key:'ded.'+id,id:'ded',label:`Ricostruisci il caso: ${CASES[id].title}`,caseId:id,ded:id,once:false});
  return list.filter(a=>!(a.once!==false&&S.done[a.key])&&(!a.if||a.if()));
}
function actBlocked(a){
  if(a.notte&&!night())return 'solo di notte';
  if(a.giorno&&night())return 'solo di giorno';
  if(a.cost&&S.money<a.cost)return `servono £${a.cost}`;
  return '';
}
function mapView(){
  const notes=S.notes.length?`<div class="notes">${S.notes.map(n=>`<p>${n}</p>`).join('')}<button class="btn ghost" data-clear>Ho letto</button></div>`:'';
  return notes+`<div class="locs">${visibleLocs().map(k=>{
    const acts=actionsAt(k);
    const dots=acts.filter(a=>a.caseId).map(a=>`<span class="dot ${a.caseId==='main'?'main':''}"></span>`).slice(0,5).join('');

}
function caseName(id){return id==='main'?MAIN.title:CASES[id].title}
function locView(k){

    return `<button class="act" data-act="${i}" ${bl?'disabled':''}><span class="lbl">${a.caseId?`<span class="case ${a.caseId==='main'?'main':''}">${caseName(a.caseId)}</span>`:''}${a.label}</span><span class="tag">${tg}</span></button>`}).join(''):`<p style="color:var(--muted)">Non c'è niente da fare qui, per ora.</p>`}</div>`;

function startAction(a){
  if(actBlocked(a))return;
  if(a.ded){UI.ded={id:a.ded,ans:[]};render();return}
  if(a.cost)S.money-=a.cost;
  UI.cur=a;UI.retry=false;UI.night=night();
  UI.scene=a.run();
  render();
}
function sceneView(sc){
  const vis=!sc.pend&&S.san<=4&&Math.random()<.5?`<p class="vision">${rnd(VISIONS)}</p>`:'';
  const ch=(sc.ch||[]);
  return `<div class="scene"><div class="eyebrow">${UI.cur&&UI.cur.caseId?caseName(UI.cur.caseId):LOCS[UI.loc]&&!sc.pend?LOCS[UI.loc].n:'Saltmere'}</div><h2>${sc.t}</h2>
  ${sc.roll?`<div class="roll ${sc.rollOk?'ok':'ko'}">${sc.roll}</div>`:''}
  ${sc.pre?`<div class="pre">${para(sc.pre)}</div>`:''}${para(sc.x)}${vis}
  <div class="choices">${ch.length?ch.map((c,i)=>{const dis=(c.need&&!c.need())||(c.cost&&S.money<c.cost);
    const tag=c.need&&!c.need()?c.why:[c.tag,c.check?`${STATN[c.check[0]]} ${c.check[1]}`:'',c.cost?`£${c.cost}`:''].filter(Boolean).join(' · ');
    return `<button class="choice" data-ch="${i}" ${dis?'disabled':''}><span>${c.t}</span><span class="tag">${tag}</span></button>`}).join(''):`<button class="btn" data-close>Continua</button>`}</div></div>`;
}
function choose(i){
  const sc=UI.scene,c=sc.ch[i];
  if(c.need&&!c.need())return;
  if(c.cost){if(S.money<c.cost)return;S.money-=c.cost}
  let out,rt=null,ok=true;
  if(c.check){const r=roll(c.check[0],c.check[1]);rt=r.txt;ok=r.ok;out=r.ok?c.ok:c.ko}else out=c.ok;
  out=out||{};
  apply(out);
  UI.retry=!!out.retry;
  if(S.ending){UI.scene=null;closeAction(true);return}
  if(out.next){const n=typeof out.next==='function'?out.next():out.next;UI.scene={...n,pre:out.x,roll:rt,rollOk:ok}}
  else UI.scene={t:sc.t,x:out.x||'',roll:rt,rollOk:ok,ch:[],pend:sc.pend};
  save();render();
}
function closeAction(fromEnding){
  const a=UI.cur;UI.scene=null;
  if(a){
    if(!UI.retry)S.done[a.key]=1;
    if(!fromEnding&&a.time!==0)advance(1);
    if(!fromEnding&&UI.night&&UI.loc!=='studio'&&Math.random()<.3){UI.cur=null;afterAction();UI.scene=nightEvent();save();render();return}
  }
  UI.cur=null;UI.retry=false;
  afterAction();save();render();
}
function nightEvent(){
  const evs=[
    {t:`Passi nella nebbia`,x:`Rientrando, senti dei passi che si fermano quando ti fermi tu. Ripartono quando riparti.`,ch:[{t:`Voltati e affrontalo`,check:['ner',4],ok:{x:`Un ragazzino con un coltello troppo grande per lui. Scappa appena lo guardi.`},ko:{x:`Ti colpiscono alle spalle. Quando ti rialzi, ti manca il portafoglio.`,money:-2}}]},
    {t:`L'acqua sul selciato`,x:`Sul selciato asciutto, davanti a te, compare una pozza. Poi un'altra, un passo più avanti. Come impronte che camminano verso di te.`,ch:[{t:`Non distogliere lo sguardo`,check:['ner',4],ok:{x:`Un tombino che rigurgita, la marea che spinge nelle fogne. Solo questo. Ti ripeti che è solo questo.`},ko:{x:`Corri fino a casa senza voltarti.`,san:-1}}]},
    {t:`La campana`,x:`Dal porto, attraverso la nebbia, arriva un rintocco basso. Nessuna chiesa suona a quest'ora.`,ch:[{t:`Conta i rintocchi`,check:['ner',5],ok:{x:`Dopo il terzo, silenzio. Solo il vento sulle sartie.`},ko:{x:`Ne conti quaranta. Poi ti accorgi di averli contati ad alta voce.`,san:-1}}]},

/* ============ CASI / TACCUINO / DEDUZIONE ============ */
function casesView(){
  let h='';
  if(S.main){h+=`<div class="casecard main"><div class="eyebrow" style="color:var(--rust)">Il caso della città</div><h3>${MAIN.title}</h3><div class="meta">Scadenza: notte del giorno ${TIDE} · ${S.clues.filter(c=>CL[c][0]==='main'||CL[c][0]==='frag').length} indizi</div><p>Tobias Fenn annegato in una stanza chiusa, asciutto. ${F('coyle_dead')?'Agnes Coyle, stessa morte. ':''}${has('m_cripta')?`La risposta è nella cripta sommersa: la notte della marea, ci saranno tutti.`:`Trova chi c'è dietro prima della grande marea.`}</p><p style="font-family:var(--f-mono);font-size:.74rem;color:var(--muted)">Prove per un'accusa: ${Math.min(proofs(),NEED)} su ${NEED}${harrowWith()?' · Harrow verrà con te':''}</p></div>`}
  const ids=Object.keys(S.cases);
  ids.forEach(id=>{const c=S.cases[id],d=CASES[id];
    const st={offerto:'Lettera in attesa allo studio',attivo:`Aperto · scade a fine giorno ${c.due}`,risolto:'Chiuso',fallito:'Abbandonato'}[c.st];
    h+=`<div class="casecard"><h3>${d.title}</h3><div class="meta">${d.client} · ${st}</div>${c.st==='attivo'?`<p>Indizi raccolti: ${S.clues.filter(k=>CL[k][0]===id).length}. Quando vuoi, ricostruisci il caso dallo studio.</p>`:''}${c.st==='risolto'?`<p>${c.score>=5?'Soluzione impeccabile.':c.score>=3?'Soluzione parziale.':'Hai sbagliato.'}</p>`:''}</div>`});
  if(!ids.length&&!S.main)h=`<p>Nessun caso, per ora.</p>`;
  return h;
}
function attitude(v){return v<=-2?['Ostile','bad']:v<0?['Diffidente','bad']:v===0?['Neutrale','']:v<2?['Cordiale','good']:['Alleato','good']}
function notebookView(){
  const groups={};
  S.clues.forEach(c=>{const g=CL[c][0]==='frag'?'main':CL[c][0];(groups[g]=groups[g]||[]).push(c)});
  let h=`<div class="sec"><div class="eyebrow">${BGS[S.bg].n}</div><h3>${ESC(S.tit)} ${ESC(S.name)}</h3>${Object.keys(STATN).map(k=>`<div class="stat"><span>${STATN[k]}</span><span>${S.stats[k]}</span></div>`).join('')}<div class="stat"><span>Sanità</span><span>${S.san} / ${S.maxSan}</span></div><div class="stat"><span>Reputazione</span><span>${S.rep} / 10</span></div></div>`;
  h+=`<div class="sec"><h3>Persone</h3><div class="people">${Object.keys(PEOPLE).map(k=>{const [a,c]=attitude(S.rel[k]);return `<div class="person"><span><b>${PEOPLE[k][0]}</b>, ${PEOPLE[k][1]}</span><span class="att ${c}">${a}</span></div>`}).join('')}</div></div>`;
  const order=['main',...Object.keys(S.cases)];
  order.forEach(g=>{if(!groups[g])return;h+=`<div class="sec"><h3>${caseName(g)}</h3>${groups[g].map(c=>`<p class="clue ${CL[c][0]==='frag'?'frag':''} ${CL[c][2]==='odd'?'odd':''}">${CL[c][1]}</p>`).join('')}</div>`});
  if(!S.clues.length)h+=`<p style="color:var(--muted)">Il taccuino è ancora vuoto.</p>`;
  return h;
}
function dedView(){
  const d=CASES[UI.ded.id];
  return `<div class="scene"><div class="eyebrow">Studio · ricostruzione</div><h2>${d.title}</h2><p class="pre">Sullo scrittoio, il taccuino aperto. Ogni risposta giusta vale di più se hai un indizio che la sostenga. Formulare la soluzione richiede una fascia del giorno e chiude il caso.</p>
  ${d.deduce.map((q,qi)=>`<div class="q"><h3>${q.q}</h3>${q.o.map((o,oi)=>`<button class="opt" data-q="${qi}" data-o="${oi}" aria-pressed="${UI.ded.ans[qi]===oi}">${o[0]}</button>`).join('')}</div>`).join('')}
  <div class="row"><button class="btn" id="dsub" ${UI.ded.ans.filter(v=>v!==undefined).length===d.deduce.length?'':'disabled'}>Esponi la soluzione</button><button class="btn ghost" id="dback">Non ancora</button></div></div>`;
}
function submitDed(){
  const id=UI.ded.id,d=CASES[id];let score=0;
  d.deduce.forEach((q,qi)=>{const o=q.o[UI.ded.ans[qi]];if(o[1])score+=(o[2]||[]).some(has)?2:1});
  const culprit=!!d.deduce[0].o[UI.ded.ans[0]][1];
  const c=S.cases[id];c.st='risolto';c.score=score;
  let x;
  if(score>=5&&culprit){S.money+=d.fee;S.rep=clamp(S.rep+1,0,10);x=`Ogni tassello combacia. ${d.client} ti paga £${d.fee}.`}
  else if(score>=3&&culprit){const f=Math.round(d.fee*.6);S.money+=f;x=`Il quadro regge, ma con qualche crepa. ${d.client} ti paga £${f}.`}
  else{S.money+=3;S.rep=clamp(S.rep-1,0,10);S.flags[id+'_errore']=1;x=`Le tue conclusioni non reggono. ${d.client} ti paga £3 per il disturbo, e Saltmere ne parla.`}
  if(culprit&&score>=3)addClue(d.frag);
  refill();
  UI.ded=null;
  UI.cur={key:'ded.'+id,time:1,caseId:id};UI.retry=false;UI.night=false;
  const fin=d.finale(culprit&&score>=3);
  if(fin.rel)apply({rel:fin.rel});
  UI.scene={...fin,pre:x};
  save();render();
}

function endingView(){
  const e=ENDINGS[S.ending]();
  const epi=Object.keys(EPI).filter(F).map(k=>EPI[k]);
  const solvedN=solvedCount();
  return `<div class="ending" style="padding-top:8vh"><div class="eyebrow">Fine · giorno ${S.day}</div><h1>${e.h}</h1>${para(e.x)}
  ${epi.length?`<div class="sec" style="margin-top:24px"><div class="eyebrow">Che ne è stato degli altri</div>${epi.map(t=>`<p class="clue">${t}</p>`).join('')}</div>`:''}
  <p style="font-family:var(--f-mono);font-size:.74rem;color:var(--muted)">Casi risolti: ${solvedN} · Indizi: ${S.clues.length} · Reputazione finale: ${S.rep}/10 · Sanità: ${S.san}/10</p>
  <p class="coda">${e.coda}</p><div class="row" style="margin-top:20px"><button class="btn" id="again">Torna al titolo</button></div></div>`;
}

/* ============ EVENTI ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(!S){titleClick(t);return}
  if(t.id==='again'){save();S=null;UI.loc=null;render();return}
  if(t.hasAttribute('data-menu')){save();S=null;UI.loc=null;UI.scene=null;UI.ded=null;UI.cur=null;render();return}
  if(t.dataset.tab){UI.tab=t.dataset.tab;UI.loc=null;render();return}
  if(t.dataset.loc){UI.loc=t.dataset.loc;render();return}
  if(t.hasAttribute('data-back')){UI.loc=null;render();return}
  if(t.hasAttribute('data-clear')){S.notes=[];save();render();return}
  if(t.dataset.act!==undefined){startAction(actionsAt(UI.loc)[+t.dataset.act]);return}
  if(t.dataset.ch!==undefined){choose(+t.dataset.ch);return}
  if(t.hasAttribute('data-close')){closeAction();return}
  if(t.dataset.q!==undefined){UI.ded.ans[+t.dataset.q]=+t.dataset.o;render();return}
  if(t.id==='dsub'){submitDed();return}
  if(t.id==='dback'){UI.ded=null;render();return}
});

S=null;render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>

</body>
</html>
