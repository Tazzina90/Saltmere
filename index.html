<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Nebbie di Saltmere</title>
<meta name="description" content="Un gioco investigativo testuale gotico ambientato in una città portuale vittoriana.">
<meta name="theme-color" content="#0c1313">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saltmere">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: colonna unica mobile-first; barra di stato fissa in alto, sotto una "carta" di scena su fondo di nebbia portuale. Tema scuro unico, voluto. */
:root{
  padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);
  --ink:#0c1313; --surface:#131d1d; --surface2:#1a2726; --line:#2a3b39;
  --bone:#e7e1d1; --muted:#97a39d; --gas:#e2a94b; --gas-dim:#8c6a33;
  --verd:#6fae9d; --rust:#cf6146; --mind:#a094dc;
  --f-display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--ink);color:var(--bone);margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px;position:relative;overflow-x:hidden}
.fog{position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.55;
  background:radial-gradient(40% 30% at 20% 30%, rgba(111,174,157,.10), transparent 70%),
             radial-gradient(35% 25% at 80% 60%, rgba(226,169,75,.07), transparent 70%),
             radial-gradient(50% 40% at 50% 100%, rgba(151,163,157,.08), transparent 70%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-3%,0,0)}to{transform:translate3d(3%,-2%,0)}}
@media (prefers-reduced-motion: reduce){.fog{animation:none}}
#app{position:relative;z-index:1;max-width:620px;margin:0 auto}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gas);outline-offset:2px}

/* barra di stato */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding:10px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(var(--ink) 75%, transparent);}
.bar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.when{font-family:var(--f-display);font-size:1.45rem;font-style:italic;line-height:1.1}
.when small{font-family:var(--f-mono);font-style:normal;font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.purse{font-family:var(--f-mono);font-size:.9rem;color:var(--gas);font-variant-numeric:tabular-nums}
.meters{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter{display:flex;align-items:center;gap:6px}
.pips{display:flex;gap:3px}
.pip{width:8px;height:8px;border-radius:50%;border:1px solid var(--line)}
.pip.on{background:var(--mind);border-color:var(--mind)}
.pip.rep.on{background:var(--verd);border-color:var(--verd)}
.low .pip.on{background:var(--rust);border-color:var(--rust)}
.tide{margin-top:6px;font-family:var(--f-mono);font-size:.68rem;color:var(--rust);letter-spacing:.06em;text-transform:uppercase}

.tabs{display:flex;gap:4px;margin:10px 0 14px;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto}
.tab{background:none;border:0;padding:8px 10px 10px;white-space:nowrap;cursor:pointer;color:var(--muted);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--bone);border-color:var(--gas)}

h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gas-dim)}

/* luoghi */
.notes{border-left:2px solid var(--gas);padding:8px 12px;margin-bottom:16px;background:var(--surface)}
.notes p{margin:.2em 0;font-size:.92rem}
.notes button{margin-top:6px}
.locs{display:grid;gap:8px}
.loc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px 14px;cursor:pointer}
.loc:hover{border-color:var(--gas-dim)}
.loc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.loc-n{font-family:var(--f-display);font-size:1.3rem;line-height:1.2}
.loc-d{color:var(--muted);font-size:.85rem;margin-top:2px}
.dots{display:flex;gap:4px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--verd)}
.dot.main{background:var(--rust)}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.loc-head{margin-bottom:14px}
.loc-head h2{font-size:2rem;line-height:1.1}
.loc-head p{color:var(--muted);margin:.4em 0 0;font-style:italic}

.acts{display:grid;gap:8px}
.act{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-height:48px}
.act:hover:not(:disabled){border-color:var(--gas)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .lbl{min-width:0}
.act .case{display:block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--verd);margin-bottom:2px}
.act .case.main{color:var(--rust)}
.tag{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);white-space:nowrap;flex-shrink:0}

/* scena */
.scene{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:20px 18px 18px}
.scene h2{font-size:1.9rem;line-height:1.1;font-style:italic;margin-bottom:12px}
.scene p{margin:0 0 .9em;max-width:62ch}
.pre{color:var(--muted)}
.roll{font-family:var(--f-mono);font-size:.74rem;padding:6px 10px;border:1px solid var(--line);display:inline-block;margin-bottom:12px;font-variant-numeric:tabular-nums}
.roll.ok{color:var(--verd);border-color:rgba(111,174,157,.4)}
.roll.ko{color:var(--rust);border-color:rgba(207,97,70,.4)}
.vision{color:var(--mind);font-style:italic}
.choices{display:grid;gap:8px;margin-top:16px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:12px 14px;min-height:48px}
.choice:hover:not(:disabled){border-color:var(--gas)}
.choice:disabled{opacity:.42;cursor:not-allowed}
.btn{background:var(--gas);color:#1b1206;border:0;border-radius:3px;padding:12px 18px;cursor:pointer;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.btn.ghost{background:none;color:var(--bone);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* taccuino e casi */
.sec{margin-bottom:22px}
.sec h3{font-size:1.4rem;margin-bottom:8px}
.clue{padding:8px 0 8px 14px;border-left:1px solid var(--line);font-size:.92rem;margin:0}
.clue.frag{border-color:var(--rust)}
.clue.odd{color:var(--mind)}
.people{display:grid;gap:6px}
.person{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;border-bottom:1px dotted var(--line);padding-bottom:4px}
.person b{font-weight:600}
.att{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.att.good{color:var(--verd)} .att.bad{color:var(--rust)}
.casecard{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px;margin-bottom:10px}
.casecard.main{border-color:rgba(207,97,70,.5)}
.casecard h3{font-size:1.45rem}
.casecard .meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;margin:4px 0 8px;text-transform:uppercase}
.casecard p{margin:0 0 10px;font-size:.92rem}
.stat{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.8rem;padding:4px 0;border-bottom:1px dotted var(--line)}

/* deduzione */
.q{margin:18px 0}
.q h3{font-size:1.3rem;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;cursor:pointer;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-bottom:6px}
.opt[aria-pressed="true"]{border-color:var(--gas);background:rgba(226,169,75,.08)}

/* slot di salvataggio */
.bar-right{display:flex;align-items:center;gap:12px}
.menu{background:none;border:1px solid var(--line);border-radius:3px;color:var(--muted);font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;cursor:pointer}
.slots{display:grid;gap:10px;margin-top:10px}
.slotc{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:14px}
.slotc.empty{border-style:dashed;background:none}
.slotc h3{font-size:1.45rem;line-height:1.15}
.slotc .meta{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em;margin:4px 0 12px}
.slotc .row .btn{padding:10px 12px}
.slot-n{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gas-dim);margin-bottom:4px}
.muted{color:var(--muted)}
.slotc p.muted{margin:.2em 0 .8em}
.btn.danger{color:var(--rust);border-color:rgba(207,97,70,.45)}
.btn.danger-fill{background:var(--rust);color:#1b0c07}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px;color:var(--bone);font-family:var(--f-mono);font-size:.74rem;resize:vertical;word-break:break-all}
.code-box{border:1px solid var(--gas-dim);padding:14px;border-radius:3px}
.code-box p{margin:.3em 0 .8em;font-size:.9rem}
.err{color:var(--rust);font-size:.88rem;margin:.5em 0 0}
/* titolo */
.title{padding-top:12vh;padding-bottom:20px}
.title h1{font-size:clamp(3rem,13vw,5.2rem);line-height:.92;font-style:italic;letter-spacing:-.01em}
.title h1 span{display:block;font-style:normal;color:var(--gas)}
.title p{color:var(--muted);max-width:44ch;margin:18px 0 26px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:12px;color:var(--bone);font:inherit}
.pick{display:grid;gap:8px}
.pick .opt b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;display:block}
.pick .opt small{color:var(--muted);display:block;font-size:.85rem}
.pick.inline{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.ending h1{font-size:clamp(2.4rem,10vw,3.6rem);font-style:italic;line-height:1;margin:8px 0 16px}
.ending p{max-width:62ch}
.coda{color:var(--mind);font-style:italic;border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--verd);color:#0b1716;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;padding:8px 14px;border-radius:3px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}

/* ---- v2 ---- */
.pre-out p{margin:0 0 .9em;max-width:62ch}
.annot{border-left:2px solid var(--verd);background:rgba(111,174,157,.07);padding:8px 12px;margin:4px 0 14px}
.annot .eyebrow{color:var(--verd);margin-bottom:4px}
.annot-c{margin:.25em 0;font-size:.92rem}
.annot-c.frag{color:var(--rust)}
.hint{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em;margin:0 0 12px}
.sep{height:1px;background:var(--line);margin:6px 0 14px}
.mono-s{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.dot.job{background:var(--gas)}
.act .case.job{color:var(--gas)}
.choice.leave{border-style:dashed;color:var(--muted)}
.opt.muted-opt{color:var(--muted);font-style:italic}
.bg-stats{font-family:var(--f-mono);font-size:.7rem;margin-top:4px}
.q .opt{font-size:.92rem;line-height:1.45}
</style>
</head>
<body>
<div class="fog" aria-hidden="true"></div>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* =====================================================================
   CONTENUTI DI BASE: personaggio, guida, luoghi, voci, eventi, azioni
   ===================================================================== */
const CL = {}, CASES = {}, EPI = {};
const TIDE = 18;
const NEED = 6;
const CASES_PER_GAME = 5;
const LETTER_DAYS = [4, 7, 10, 13];
const MEETINGS = [12, 15];

const BGS = {
  ispettore: {n: `Ex ispettore di Scotland Yard`, d: `Hai lasciato Londra dopo un caso finito male, con una medaglia in un cassetto e un nome che non pronunci più. La polizia ti rispetta; i criminali ti fiutano a un miglio.`, st: {oss: 3, per: 2, ner: 3}, san: 8, rep: 4, money: 8, rel: {harrow: 2}},
  medico: {n: `Medico chirurgo`, d: `Hai aperto più cadaveri di quanti ne abbia visti un becchino, e hai imparato che i morti mentono meno dei vivi. Puoi leggere un corpo come una lettera.`, st: {oss: 3, per: 2, ner: 2}, san: 9, rep: 3, money: 14, rel: {}},
  cronista: {n: `Cronista della Gazette`, d: `Hai scritto di impiccagioni, scandali e incendi per un penny a riga. Conosci ogni bettola del porto, e la gente ti parla anche quando non dovrebbe.`, st: {oss: 2, per: 4, ner: 2}, san: 8, rep: 3, money: 9, rel: {nell: 2}},
  occultista: {n: `Studioso dell'occulto`, d: `Hai passato anni tra grimori, sedute e cimiteri, a separare il trucco dal mistero. Leggi simboli che gli altri non vedono. Il prezzo è che, a volte, sono loro a vedere te.`, st: {oss: 3, per: 2, ner: 2}, san: 7, rep: 2, money: 12, rel: {ambrose: 1}},
};
const TRAITS = {oss: ['Occhio fino', '+1 Osservazione'], per: ['Lingua sciolta', '+1 Persuasione'], ner: ['Nervi saldi', '+1 Sangue freddo']};

const HOWTO = [
  ['Lo scopo', `Sei un investigatore appena arrivato a Saltmere. Risolvi i casi che ti arrivano per lettera, guadagna denaro e reputazione, e soprattutto scopri chi c'è dietro gli «annegati asciutti» prima della notte della grande marea, il giorno 18.`],
  ['Il tempo', `Ogni giorno ha quattro fasce: mattina, pomeriggio, sera e notte. Ogni visita consuma una fascia, anche se durante una conversazione puoi fare più domande. Alcune azioni si fanno solo di notte, altre solo di giorno. Dormire allo studio fa passare la notte e restituisce un punto di sanità; un'azione fatta di notte, invece, ti fa rientrare all'alba senza riposo. Ogni sette giorni la signora Pell chiede 6 sterline di affitto. Dallo studio puoi anche lasciar passare i giorni fino alla prossima lettera.`],
  ['Le risorse', `Le sterline servono per l'affitto, le mance e le informazioni. La sanità scende quando vedi cose che non sai spiegare: a 4 o meno compaiono visioni, a 3 o meno anche le prove diventano più difficili, a zero la partita finisce. La reputazione apre porte che altrimenti restano chiuse. Harrow, Nell Quill, Padre Ambrose e la signora Pell ricordano come li hai trattati.`],
  ['Muoversi in città', `Nella scheda Città tocca un luogo per vedere cosa puoi fare lì. I pallini verdi indicano azioni dei casi aperti, quelli rossi il caso principale, quelli gialli gli incarichi della bacheca del porto. Alcuni luoghi compaiono solo quando servono a un'indagine. Quando scopri qualcosa di nuovo, possono comparire azioni nuove anche in luoghi già visitati.`],
  ['Le prove di abilità', `Molte scelte mettono alla prova Osservazione, Persuasione o Sangue freddo: il valore della tua abilità più un dado a sei facce deve raggiungere la difficoltà indicata. Se una prova fallisce, potrai ritentare quell'approccio solo dal giorno dopo. Con le persone la pazienza ha un limite: se fallisci due volte lo stesso approccio con qualcuno, quella strada si chiude per sempre, e dovrai trovarne un'altra.`],
  ['Indizi e interrogatori', `Tutto ciò che scopri viene annotato nel Taccuino, e lo vedi scritto subito sotto la scena. Negli interrogatori scegli l'approccio: gentilezza, pressione, oppure mettere il testimone davanti a una prova. Le opzioni che richiedono una prova compaiono solo quando quella prova ce l'hai.`],
  ['L\'accusa', `Quando sei pronto, torna allo studio e scegli «Ricostruisci il caso». Scegli chi accusare tra le persone che hai incontrato, poi indica dal taccuino la prova del come e quella del perché. Attenzione: ogni caso ha almeno un sospettato credibile che non è il colpevole. Più la tua accusa è provata, più vieni pagato. Poi decidi cosa fare del colpevole: le scelte morali cambiano il finale.`],
  ['Il caso principale', `Dopo qualche giorno l'ispettore Harrow busserà alla tua porta. I casi minori chiusi bene lasciano frammenti che aiutano a capire il mistero. Più scavi, più chi sta dietro alle morti si accorge di te. Con abbastanza prove non sei obbligato ad aspettare la marea: puoi colpire prima, se sai dove e quando.`],
  ['I salvataggi', `La partita si salva da sola dopo ogni scelta, in uno dei tre slot della schermata iniziale. Il salvataggio resta su questo dispositivo e in questo browser. Per spostarlo su un altro dispositivo, o tenerne una copia, usa «Copia codice» e poi «Carica un codice» dall'altra parte. Il pulsante Menu, in alto, riporta alla schermata iniziale.`],
];

const PEOPLE = {
  harrow: [`Ispettore Harrow`, `polizia di Wharf Lane`],
  nell: [`Nell Quill`, `cronista della Gazette`],
  ambrose: [`Padre Ambrose`, `parroco di St. Brendan`],
  pell: [`Signora Pell`, `la tua padrona di casa`],
};

const LOCS = {
  studio: {n: `Lo studio`, d: `Lantern Row 7, sopra la merceria della signora Pell.`,
    long: () => night() ? `La lampada a petrolio fa un cerchio giallo sullo scrittoio. Fuori la nebbia preme contro i vetri come un animale che vuole entrare, e dal piano di sotto sale il ticchettio dell'orologio della signora Pell.` : `Due stanze strette che odorano di carta, tabacco e lana bagnata. Dalla finestra si vede un triangolo di porto tra i tetti, e la targa d'ottone sulla porta brilla ancora troppo per essere quella di qualcuno che conta.`},
  porto: {n: `Il Porto Vecchio`, d: `Gru, catrame, gabbiani e carbone bagnato.`,
    long: () => night() ? `Di notte il porto è un labirinto di lanterne sospese e scafi che scricchiolano. L'acqua sbatte contro i pali con un rumore di mani che applaudono piano.` : `Scaricatori che bestemmiano in tre lingue, reti stese ad asciugare, l'odore dolciastro del pesce che marcisce sotto le assi. Accanto alla dogana, una bacheca di legno è coperta di avvisi scritti a mano.`},
  taverna: {n: `L'Ancora Annegata`, d: `Birra scura, marinai, voci che costano un giro.`,
    long: `Soffitto basso, travi annerite, un'ancora vera appesa sopra il bancone con le alghe ancora attaccate. Il barista, Big Toller, ha un orecchio solo e una memoria perfetta per chi gli deve dei soldi.`},
  polizia: {n: `Commissariato di Wharf Lane`, d: `L'ispettore Harrow e le sue pratiche polverose.`,
    long: `Un edificio di mattoni anneriti, una stufa che fuma più di quanto scaldi, due agenti che giocano a dama finché non entri. In fondo al corridoio, dietro una porta a vetri smerigliati, l'ispettore Harrow.`},
  obitorio: {n: `Obitorio dei Marinai`, d: `Piastrelle bianche, acido fenico, silenzio.`,
    long: `Sotto l'ospedale del porto, una sala lunga e fredda dove il mare restituisce ciò che si prende. L'inserviente, un uomo grigio di nome Stubbs, canticchia inni mentre lava il pavimento.`},
  archivio: {n: `Registro Marittimo`, d: `Archivio di navi, equipaggi, nascite e naufragi.`,
    long: `Scaffali fino al soffitto, scale a pioli, un silenzio da chiesa. L'archivista, la signorina Thursby, porta gli occhiali appesi a una catenella e ti guarda come si guarda un foglio scritto male.`},
  chiesa: {n: `St. Brendan sul Molo`, d: `Chiesa dei pescatori. Padre Ambrose tiene accese le candele.`,
    long: `Una chiesa piccola e storta, costruita dai pescatori con il legno delle loro barche. Sulle pareti, ex voto di naufraghi salvati e una lunga tavola con i nomi di quelli che non lo furono. Quaranta righe portano la stessa data.`},
  collina: {n: `Ashcombe Hill`, d: `Ville, salotti e cancelli chiusi sopra la nebbia.`,
    long: `Lassù la nebbia arriva solo a sfilacci, e le ville guardano il porto dall'alto come signore che sollevano l'orlo della gonna per non sporcarsi. Cancelli di ferro, giardini potati, finestre che non si aprono mai sul mare.`},
  villa: {n: `Villa Marlowe`, d: `Edera nera e tende sempre tirate.`, c: () => act('ritratto'),
    long: `Una villa di pietra grigia mangiata dall'edera. Dentro, gli specchi sono coperti di crespo nero come vuole il lutto, e ogni orologio è fermo all'ora in cui morì Lord Marlowe.`},
  carrow: {n: `Carrow Street 13`, d: `Il salotto delle sedute di Madame Varga, sigillato dalla polizia.`, c: () => act('seduta'),
    long: `Una casa stretta tra un sarto e un fabbricante di bare. Sulla porta, un sigillo di ceralacca della polizia e un cartello scolorito: «Madame Ysolde Varga. Consulti con l'aldilà. Martedì e venerdì».`},
  pegni: {n: `Banco dei pegni Voss`, d: `Tre sfere d'ottone sopra una porta stretta.`, c: () => act('pegno') || act('faro'),
    long: `Orologi che segnano tutti un'ora diversa, fedi nuziali in fila come denti, un violino senza corde. Ezra Voss conta il mondo in scellini e lo guarda attraverso una lente da gioielliere.`},
  faro: {n: `Il faro di Gull Point`, d: `Una torre bianca sugli scogli, a un'ora di cammino.`, c: () => act('faro'),
    long: `Il sentiero corre lungo la scogliera tra erica bagnata e ossa di gabbiano. In fondo, il faro: una torre bianca scrostata, la casetta del guardiano addossata alla base come un cane a una gamba.`},
  cere: {n: `Museo delle Cere di Mr. Quint`, d: `Assassini celebri e regine, a due pence l'ingresso.`, c: () => act('cera'),
    long: `Una vetrina polverosa su Fish Street: Maria Stuarda decapitata, il capitano Kidd con il cappio al collo, una sirena fatta con mezza scimmia e mezzo merluzzo. Dentro, odore di cera calda e di trementina.`},
  capitaneria: {n: `Capitaneria di porto`, d: `Il regno del capitano di porto Gaunt.`, c: () => act('lettere') || S.main === 'attivo',
    long: `Un palazzo di pietra con un orologio sulla facciata e una bandiera fradicia. Impiegati chini sui registri, il rumore dei pennini, e al primo piano una porta di mogano su cui una targa dice soltanto: «M. GAUNT».`},
  cripta: {n: `La cripta sommersa`, d: `Sotto le rovine della vecchia St. Brendan. Si raggiunge solo con la bassa marea.`, c: () => S.main === 'attivo' && has('m_cripta'),
    long: `Della vecchia chiesa restano un muro, un arco e una scala che scende nel buio. Con l'alta marea l'acqua la riempie fino in cima. Con la bassa, la scala respira.`},
};

const RUMORS = [
  `Un fuochista con le braccia tatuate giura che nelle notti di marea alta, al largo di Gull Point, suona una campana. «Il Meridian non ha mai smesso di chiamare. Mio zio era a bordo. Certe notti lo sento contare.»`,
  `Due scaricatori parlano a bassa voce del dottor Wren. «Ti cuce gratis, se sei del porto.» «Sì, e poi ti tiene d'occhio. Mio cognato dice che gli ha chiesto di ricordare il Meridian, con gli occhi chiusi, per un'ora.»`,
  `Una pescivendola con le mani rosse dice che il capitano di porto Gaunt si è comprato una carrozza nuova, con i fanali d'ottone. «Con lo stipendio di un capitano di porto? Ma fatemi il piacere. A me la licenza l'hanno raddoppiata.»`,
  `Un vecchio con un occhio solo ti afferra il braccio con una forza che non ti aspettavi. «Quaranta sono andati giù. Quaranta devono tornare su.» Poi ride, ti lascia, e chiede a nessuno in particolare un altro giro.`,
  `Si dice che la signora Pell, la tua padrona di casa, abbia perso un fratello sul Meridian. Ogni anno, il giorno del naufragio, chiude la merceria e va a sedersi sul molo fino a sera. Non ne parla mai.`,
  `Un mozzo di dodici anni racconta, a chi gli offre una salsiccia, di aver visto impronte bagnate salire le scale della dogana, di notte, con il mare a duecento metri. «E poi giù. E poi niente.»`,
  `Al bancone si scommette su chi sarà il prossimo a morire «asciutto». Big Toller tiene il registro con una matita da carpentiere. Le quote su Ned Garrow sono le più basse.`,
  `Il barista dice che l'assessore Pryce non esce più di casa dopo il tramonto. «Ha fatto murare le finestre che danno sul mare. Murare, capite? Uno che ha paura dei ladri mette le sbarre. Uno che ha paura del mare mette i mattoni.»`,
  `Una ragazza che vende acqua calda per la barba dice che il Museo delle Cere di Mr. Quint ha una figura nuova, coperta da un telo. «Dice che sarà la più bella di tutte. Dice che la gente pagherà sei pence per vederla.»`,
  `Due piloti del porto litigano sul faro di Gull Point. «Josiah Penrose beve.» «Josiah Penrose ha visto sua moglie morta sulla balconata, e anche tu berresti.» Finisce con un bicchiere rotto e nessuno che ha ragione.`,
  `Un uomo in giacca da impiegato, che qui dentro sta come un gatto in una vasca, beve da solo e paga in monete d'argento nuove. Quando Toller gli chiede da dove vengano, risponde: «Dalla penna, Toller. Dalla penna.»`,
  `Una donna in nero dice che il mare a Saltmere non restituisce i corpi. «Da nove anni. Prima li riportava a riva, almeno, che potevi seppellirli. Adesso se li tiene. Come se stesse mettendo da parte.»`,
];

  `Le fiamme delle lampade si piegano tutte nella stessa direzione: verso il mare.`,

const NIGHT_EVENTS = [
  {t: `Passi nella nebbia`, x: `Rientrando per Tanner's Lane senti dei passi dietro di te. Si fermano quando ti fermi tu. Ripartono quando riparti. La nebbia è così fitta che il lampione più vicino è solo una macchia gialla sospesa nel nulla.`, ch: [
    {t: `Voltati di scatto e affrontalo`, c: ['ner', 4], ok: {x: `Un ragazzino con un coltello troppo grande per la sua mano e una giacca troppo grande per le sue spalle. Ti guarda, guarda il coltello, e scappa senza una parola. Ti accorgi che stavi trattenendo il fiato.`}, ko: {x: `Il colpo arriva dal lato che non stavi guardando. Quando ti rialzi dal selciato bagnato hai un taglio sul sopracciglio e il portafoglio più leggero di due sterline.`, money: -2, done: true}},
    {t: `Affretta il passo verso le luci di Lantern Row`, ok: {x: `Arrivi alla tua porta con il cuore che batte in gola. Quando ti volti, la strada è vuota. Sulle pietre bagnate, però, c'è una fila di impronte che si ferma a pochi passi da te.`, san: -1}},
  ]},
  {t: `L'acqua sul selciato`, x: `Sul selciato asciutto, davanti a te, compare una pozza. Poi un'altra, un passo più avanti. Poi un'altra ancora, sempre un passo più vicina, come impronte di qualcuno che cammina verso di te senza farsi vedere.`, ch: [
    {t: `Non distogliere lo sguardo`, c: ['ner', 4], ok: {x: `Ti costringi a guardare, e capisci: un tombino che rigurgita, la marea che spinge nelle fogne e sputa acqua dalle fessure del lastricato. Solo questo. Te lo ripeti fino a casa: solo questo.`}, ko: {x: `Non ce la fai. Corri fino a casa senza voltarti, e solo quando hai chiuso la porta a doppia mandata ti accorgi che le tue scarpe sono bagnate fino alle caviglie.`, san: -1, done: true}},
  ]},
  {t: `La campana`, x: `Dal porto, attraverso la nebbia, arriva un rintocco basso e lungo, così grave che lo senti nello sterno prima che nelle orecchie. Nessuna chiesa suona a quest'ora. Le finestre di Lantern Row restano buie.`, ch: [
    {t: `Conta i rintocchi`, c: ['ner', 5], ok: {x: `Uno. Due. Tre. Poi silenzio, solo il vento che fa vibrare le sartie delle barche ormeggiate. Domani lo racconterai come una cosa curiosa.`}, ko: {x: `Ne conti quaranta. Poi ti accorgi di averli contati ad alta voce, e che una finestra di fronte si è aperta, e che qualcuno ti sta guardando dal buio senza dire niente.`, san: -1, done: true}},
  ]},
  {t: `La donna sul molo`, x: `Sul molo deserto c'è una donna con uno scialle grigio, immobile, rivolta verso il mare. Quando le passi accanto ti accorgi che piange senza fare rumore. Dalle frange dello scialle gocciola acqua.`, ch: [
    {t: `Chiedile se ha bisogno di aiuto`, c: ['per', 4], ok: {x: `Si volta. È una vecchia pescivendola che conosci di vista, e lo scialle è bagnato perché ha appena smesso di piovere. «Mio figlio era sul Meridian», dice. «Vengo qui a dirgli buonanotte.» La accompagni fino a casa.`, san: 1}, ko: {x: `Non risponde. Non si volta. Quando, dopo dieci passi, ti giri a guardarla, il molo è vuoto e c'è solo una pozza dove stava lei.`, san: -1, done: true}},
    {t: `Tira dritto`, ok: {x: `Tiri dritto. Per tutta la strada hai la sensazione precisa di uno sguardo sulla nuca, freddo come una mano bagnata.`}},
  ]},
  {t: `Il cane di Toller`, x: `Davanti all'Ancora Annegata, il cane di Big Toller, un mastino che ha paura solo dei gatti, sta ringhiando contro l'acqua del porto. Ha il pelo dritto e la coda tra le gambe.`, ch: [
    {t: `Guarda cosa sta fissando`, c: ['oss', 5], ok: {x: `Una barca a remi senza luci scivola verso il vecchio molo di St. Brendan. Dentro, tre figure incappucciate di grigio. Remano senza fare il minimo rumore. Il cane guaisce e si nasconde sotto una panca.`, heat: 0}, ko: {x: `Vedi solo acqua nera. Poi, per un istante, una faccia bianca appena sotto la superficie, con gli occhi aperti. Quando guardi meglio, è un riflesso della luna. Non c'è la luna, stanotte.`, san: -1, done: true}},
    {t: `Accarezza il cane e vai a dormire`, ok: {x: `Il mastino ti lecca la mano, grato, e ti segue fino all'angolo prima di tornare al suo posto. Per un po', almeno, non sei solo.`}},
  ]},
];

function offers() { return Object.keys(S.cases).filter(id => S.cases[id].st === 'offerto'); }
function harrowTalk() {
  const r = S.rel.harrow;
  const greet = r <= -1 ? `Harrow non alza nemmeno la testa dalle carte. «Se è per un altro dei suoi favori, ${tit()}, la porta è quella. La conosce, ci è già passato.»`
    : r >= 2 ? `Harrow ti versa due dita di whisky senza chiedere, in un bicchiere che ha l'aria di non essere stato lavato dall'ultima incoronazione. «Lei è l'unico in questa città che non mi fa perdere tempo. Si sieda.»`
    : `Harrow si sfrega gli occhi con il dorso della mano. Ha l'aria di un uomo che dorme in ufficio e mangia in piedi. «${tit()}. Cosa le serve?»`;
  return {t: `L'ufficio di Harrow`, talk: true, leave: `Saluta e vai`, x: `${greet}\n\nSul tavolo, tra pile di verbali, una foto incorniciata girata verso il muro e una pipa spenta.`, ch: [
    {t: `Offrigli una pista che ha già`, req: () => !F('pista' + S.day), q: 1, ok: {x: `Gli racconti un dettaglio di un furto di reti che conosce già, ma glielo racconti come se fosse un regalo. Lui lo capisce, e apprezza la cortesia. «Un piccolo debito, ${tit()}. Me lo ricorderò.»`, rel: {harrow: 1}, fn: () => S.flags['pista' + S.day] = 1}},
    {t: `Chiedigli come va la città`, q: 1, ok: {x: () => S.main === 'attivo' ? `«Male.» Si accende la pipa e la lascia spegnere. «Fenn${F('coyle_dead') ? ', la Coyle' : ''}… il coroner scrive "annegamento accidentale" e io firmo. Tutte le volte. Lei mi trovi qualcosa che mi permetta di non firmare, e io le offro da bere per un anno.»` : `«Il mare restituisce più del solito, quest'anno. Barche, reti, una scarpa da donna. Ieri un cane, vivo, a dieci miglia dalla costa.» Scuote la testa. «I vecchi dicono che è un brutto segno. I vecchi dicono sempre che è un brutto segno.»`}},
    {t: `Chiedigli della foto girata verso il muro`, req: () => S.rel.harrow >= 1 && !F('foto'), q: 1, ok: {flag: 'foto', x: `Harrow tace a lungo. «Mia moglie. Morta di colera, nel settantanove.» Gira la cornice, la guarda, la rimette com'era. «La giro perché non mi veda firmare certe cose.» È la frase più lunga che gli hai sentito dire su di sé.`, rel: {harrow: 1}}},
  ]};
}

  unproven: `Accusi Julian, ma non hai in mano niente di solido. Lui ti ascolta fino alla fine con un sorriso paziente, poi chiama il maggiordomo. «Accompagni fuori il nostro ospite. E prepari la carrozza: domani andiamo dal dottor Wren, zia.» Lady Eleanor ti guarda andare via. Ti pagano tre sterline per il disturbo.`,

  finale: () => ({t: `Il salotto di Villa Marlowe`, x: `Julian ascolta la tua ricostruzione in piedi, le mani in tasca, il sorriso sempre più sottile. Quando arrivi ai debiti, le mani escono dalle tasche. Quando arrivi al testamento, il sorriso se ne va.\n\nLady Eleanor non guarda il nipote. Guarda te, e ha gli occhi asciutti per la prima volta da quando la conosci.\n\n«Cosa mi consigliate, ${tit()}?»`, ch: [
    {t: `Chiama l'ispettore Harrow`, ok: {x: `Julian esce dalla villa tra due agenti, senza cappello, sotto la pioggia, gridando che è tutto un malinteso. La Gazette ne parlerà per una settimana. Lady Eleanor sopporterà lo scandalo a testa alta, e ti stringerà la mano come si stringe quella di un ufficiale dopo una battaglia.`, rep: 1, rel: {harrow: 1}, flag: 'rit_denuncia'}},
    {t: `Lascia che sia lei ad allontanarlo, in silenzio`, ok: {x: `Julian parte per le colonie il giorno dopo, con un biglietto di sola andata e una lettera di presentazione che la zia ha scritto con la mano ferma. Lady Eleanor ti stringe la mano più a lungo del necessario e aggiunge sei sterline alla parcella. «Per il silenzio. Il vostro e il mio.»`, money: 6, flag: 'rit_silenzio'}},
    {t: `Prendi Julian da parte: il tuo silenzio ha un prezzo`, ok: {x: `Nel corridoio, a bassa voce. Dodici sterline in una busta, consegnate con un odio che ti scivola addosso come acqua sporca. Le conti a casa, una per una. Non ti senti meglio.`, money: 12, rep: -1, san: -1, flag: 'rit_ricatto'}},
  ]}),
};

CASES.campana = {
  title: `La Campana delle Tre`, client: `Padre Ambrose`, days: 6, fee: 10, frag: 'f_luci',
  letter: `Grafia tremante su un foglio strappato da un messale, con una macchia di cera in un angolo.\n\n«La campana di St. Brendan suona alle tre di notte, e nessuno la tocca. Martedì il mio sagrestano, Amos Penhallow, è stato trovato morto ai piedi del campanile, con il collo spezzato. In paese dicono che la campana l'abbia chiamato, come chiama i pescatori che devono morire. Il piccolo Kit, il nostro chierichetto, era in chiesa quella notte, ma Kit non parla da quando era bambino. Io non credo alle campane che chiamano. Ma ho paura, e non mi vergogno di dirlo.»`,
  actions: [
    {id: 'campanile', loc: 'chiesa', label: `Sali sul campanile`, scene: () => ({
      t: `Il campanile`, x: `Centoquattro gradini di pietra consumata, viscidi d'umido, che girano su se stessi in un buio che sa di guano e di sale. A metà salita trovi una macchia scura sul quarto gradino di una rampa, lavata male. Lassù il vento fa vibrare la campana con un ronzio basso, continuo, quasi una voce che canticchia a bocca chiusa.`,
      ch: [{t: `Arrampicati fino alla cella campanaria`, c: ['ner', 4], ok: {x: `La cella è un quadrato di travi nere aperto ai quattro venti. La corda della campana è stata giuntata di recente: un tratto di cima catramata da barca, legato con un nodo piano che solo un marinaio fa così, stretto e pulito. Dalla finestra a nord si vede tutto il porto, e oltre il porto il mare aperto, nero fino all'orizzonte.`, clue: 'b_corda'}, ko: {x: `Un gradino cede sotto il piede con un rumore di dente rotto. Ti aggrappi alla corda per non cadere, e la campana risponde con un rintocco sordo che ti entra nelle ossa e ci resta. Scendi a ritroso, piano, con le ginocchia che non ti obbediscono.`, san: -1}}]})},
    {id: 'kit', loc: 'chiesa', label: `Avvicina Kit, il chierichetto muto`, if: () => !F('kit_fuga'), scene: () => ({
      t: `Kit`, talk: true, leave: `Lascialo in pace`,
      x: `Kit avrà dieci anni. Serve messa, pulisce i candelieri, dorme in un ripostiglio dietro la sagrestia. L'hanno ripescato dal porto quando aveva quattro anni, attaccato a un relitto, e da allora non ha mai detto una parola. Ti guarda da dietro una colonna come un gatto randagio che non ha ancora deciso se scappare.`,
      ch: [
        {t: `Guardagli le mani mentre lucida i candelieri`, q: 1, ok: {x: `Kit lucida i candelieri con uno straccio, e lo tiene in un modo strano, con la punta delle dita. Quando si gira vedi perché: ha i palmi segnati da bruciature di corda, rosse e lucide, appena cicatrizzate. Si accorge che guardi e nasconde le mani dietro la schiena.`, clue: 'b_mani'}},
        {t: `Dagli un foglio e un pezzo di carbone`, c: ['per', 4], p: 1, g: 'b_disegno', ok: {x: `Kit guarda il foglio a lungo, poi si siede per terra e disegna, la lingua tra i denti. Un campanile. Sopra, un uomo grande con una lanterna in mano e, sul polso, un segno a forma di amo da pesca. Sotto, lungo la scala, una figura piccola che cade a braccia aperte. Poi Kit ripassa la figura che cade, ancora e ancora, finché il carbone non buca la carta.`, clue: 'b_disegno'}, ko: {x: `Kit scarabocchia un'onda enorme che riempie tutto il foglio, poi lo strappa in due e scappa in sagrestia. Senti la chiave girare nella serratura.`}},
        {t: `Portagli un pasticcio caldo dalla taverna`, cost: 1, g: 'b_disegno', ok: {x: `Kit mangia senza alzare gli occhi, a morsi piccoli e veloci come quelli di chi ha imparato che il cibo può sparire. Poi, da solo, prende il carbone dalla tasca del tuo cappotto. Un uomo con una lanterna sul campanile. Un amo tatuato sul polso. Una figura che cade. Padre Ambrose, sulla porta della sagrestia, ti guarda in un modo nuovo.`, clue: 'b_disegno', rel: {ambrose: 1}}},
        {t: `Insisti: deve dirti cosa ha visto, adesso`, req: () => !has('b_disegno'), ok: {x: `Gli prendi il braccio, piano, ma Kit si irrigidisce come se lo avessi bruciato. Si divincola e scappa fuori dalla chiesa, nella nebbia, a piedi nudi. Padre Ambrose lo cerca fino a sera. Lo ritrova due giorni dopo, nascosto in una barca rovesciata, e da allora Kit scappa ogni volta che ti vede.`, flag: 'kit_fuga', rel: {ambrose: -1}, close: true}},
      ]})},
    {id: 'ambrose', loc: 'chiesa', label: `Parla con Padre Ambrose di Amos`, scene: () => ({
      t: `La sagrestia`, talk: true, leave: `Ringrazialo e vai`,
      x: `Padre Ambrose è un uomo alto e curvo, con le mani grandi da pescatore che non ha mai smesso di essere. Ti fa sedere in sagrestia tra paramenti piegati e casse di candele, e ti versa un tè così annacquato che è quasi una preghiera.`,
      ch: [
        {t: `Chiedigli com'era Amos`, q: 1, ok: {x: `«Testardo come un mulo e onesto come un bambino.» Ambrose sorride, poi smette. «Saliva sul campanile ogni sera a controllare la corda. Una settimana fa è sceso bianco come un lenzuolo: aveva visto delle luci in mare, alle tre, e una barca che rispondeva. Contrabbandieri, diceva. Il giorno prima di morire mi ha detto che sarebbe andato dalla polizia, perché la chiesa non deve fare da lanterna ai ladri.»`, clue: 'b_amos'}},
        {t: `Chiedigli di Kit e di quella notte`, q: 1, ok: {x: `Ambrose abbassa la voce, anche se siete soli. «Quella notte Kit è rientrato in canonica all'alba, fradicio, con le mani ferite. Non ha voluto farsele medicare. Da allora non dorme: lo trovo seduto sul suo pagliericcio con gli occhi aperti.» Ti guarda. «So cosa pensa la gente. Non lo pensi anche lei.»`, clue: 'b_notte'}},
      ]})},
    {id: 'moli', loc: 'porto', notte: true, label: `Apposta sui moli alle tre di notte`, scene: () => ({
      t: `Le tre di notte`, x: `Nebbia fitta come lana bagnata, il freddo che sale dalle assi e ti entra nelle scarpe. Dietro di te, la sagoma nera di St. Brendan. Davanti, il mare, che senti ma non vedi. Aspetti, e l'orologio della dogana batte le tre. Un istante dopo, sopra la tua testa, la campana suona.`,
      ch: [{t: `Resta immobile e guarda il largo`, c: ['ner', 5], ok: {x: `Una, due, tre lanterne si accendono sull'acqua, molto al largo, una accanto all'altra. Poi si spengono. Qualche minuto dopo una barca senza luci scivola fuori dalla nebbia verso il molo vecchio, a remi fasciati di stracci. L'uomo che salta sulle assi per legare la cima è grande come un armadio, e quando passa sotto il lampione della dogana lo riconosci: Dunstan Rook, il pescatore che non pesca mai.`, clue: 'b_barca'}, ko: {x: `Un passo dietro di te, un odore di tabacco masticato, un colpo alla nuca. Ti risvegli sulle assi bagnate con la testa che pulsa, il cielo che schiarisce e il portafoglio sparito. La campana tace.`, money: -2, san: -1}}]})},
    {id: 'rook', loc: 'taverna', label: `Chiedi chi esce in mare di notte`, scene: () => ({
      t: `Dunstan Rook`, talk: true, leave: `Lascialo al suo rum`,
      x: `Big Toller indica con il mento un tavolo in fondo, senza dire una parola. Lì siede Dunstan Rook, pescatore di professione e di nient'altro, a sentire lui. Occupa un tavolo intero con le spalle. Ha le maniche della camicia abbassate fino alle nocche e un bicchiere di rum che non si svuota mai, perché qualcuno lo riempie sempre.`,
      ch: [
        {t: `Chiedigli di Amos Penhallow`, q: 1, ok: {x: `Rook sputa per terra, con precisione. «Quel vecchio ficcanaso. Saliva su quel campanile a fare la guardia al mare, come se il mare fosse suo.» Beve. «Poveraccio. Il quarto gradino è sempre stato viscido, lo sanno tutti.» Si accorge di quello che ha detto un attimo troppo tardi, e il bicchiere si ferma a mezz'aria.`, clue: 'b_dettaglio'}},
        {t: `Offrigli rum e ascolta`, c: ['per', 6], p: 1, cost: 1, g: 'b_tatuaggio', ok: {x: `Al terzo rum Rook si scalda, ride, ti racconta di tempeste e di donne. Si tira su la manica per grattarsi l'avambraccio, e lì, sul polso, c'è un amo da pesca tatuato in blu. Ti vede guardarlo. Non lo nasconde. «Sì, la campana è il mio segnale. Ma il vecchio Amos non l'ho toccato.»`, clue: 'b_tatuaggio'}, ko: {x: `Beve il tuo rum, ti ringrazia con un cenno e non dice una parola di più. Quando te ne vai lo senti ridere.`}},
        {t: `Butta sul tavolo un pezzo della corda catramata`, req: () => has('b_corda') || has('b_barca'), g: 'b_tatuaggio', ok: {x: `Rook fissa la corda, poi te, poi di nuovo la corda. Lentamente si tira su la manica: sul polso, un amo tatuato in blu. «Sì, la campana è mia. Il segnale per le barche: tre lanterne vuol dire che la costa è libera.» Si piega verso di te. «Ma Amos è caduto. È caduto, ha capito?»`, clue: 'b_tatuaggio'}},
        {t: `Afferragli il polso e scopriglielo`, c: ['ner', 6], p: 1, g: 'b_tatuaggio', ok: {x: `Gli strappi la manica prima che possa reagire: un amo tatuato sul polso. Per un attimo vedi il pugno partire, enorme come un mattone, poi Rook ci ripensa e lo riapre sul tavolo. «Il segnale è mio. Il resto no.»`, clue: 'b_tatuaggio'}, ko: {x: `Rook ti solleva per il bavero con una mano sola e ti scaraventa contro il bancone. L'Ancora Annegata intera ride, e Big Toller ti mette sul conto i due bicchieri rotti.`, rep: -1, san: -1}},
      ]})},
    {id: 'amos', loc: 'obitorio', label: `Esamina il corpo di Amos Penhallow`, scene: () => ({
      t: `L'obitorio`, x: `Stubbs solleva il lenzuolo con delicatezza, come si scopre un bambino che dorme. Amos Penhallow è piccolo e grigio, con le mani nodose incrociate sul petto e il collo piegato in un angolo che non appartiene ai vivi. Ha sessantotto anni e la faccia di uno che è morto arrabbiato.`,
      ch: autopsy() ? [{t: `Esamina il corpo da medico`, ok: {x: `Il collo è spezzato, sì. Ma sui polsi, sotto la pelle sottile da vecchio, ci sono quattro lividi ovali per lato, disposti come dita. Qualcuno lo ha afferrato per i polsi, con forza, prima della caduta. Stubbs si fa il segno della croce.`, clue: 'b_lividi'}}]
        : [{t: `Osserva con attenzione mani e braccia`, c: ['oss', 5], ok: {x: `Sui polsi, sotto la pelle sottile da vecchio, lividi violacei a forma di dita. Qualcuno lo ha afferrato con forza prima che cadesse.`, clue: 'b_lividi'}, ko: {x: `Vedi solo un vecchio morto con il collo rotto. Stubbs ricopre il corpo e ti accompagna alla porta canticchiando «Abide with Me».`}}]})},
  ],
  accuse: {
    who: `Chi ha ucciso Amos Penhallow?`,
    suspects: [
      {id: 'rook', n: `Dunstan Rook, il pescatore`, culprit: true},
      {id: 'kit', n: `Kit, il chierichetto muto`,

  unproven: `Fai il nome di Rook, ma non puoi provare niente. Harrow lo convoca, lo interroga per un'ora e lo lascia andare. Rook passa sotto la tua finestra quella sera stessa, fischiettando. Padre Ambrose ti paga tre sterline e ti ringrazia, ma la campana suona ancora.`,
  fragX: `Rook ascolta la tua ricostruzione senza interromperti, seduto su una bitta del molo vecchio sotto la pioggia, le mani enormi abbandonate sulle ginocchia. Alla fine annuisce, come se gli avessi raccontato la storia di un altro.\n\n«Le dico una cosa gratis, prima. Nelle notti di marea alta, le mie barche passano vicino al relitto del Meridian. E lì c'è sempre una lancia, a luci spente, ancorata ore sopra il punto dov'è affondato. Ha la bandierina del dispensario del porto.» Si gratta il tatuaggio. «Noi contrabbandieri abbiamo i nostri peccati. Ma quelli lì fanno qualcos'altro.»`,
  finale: () => ({t: `Il molo vecchio, sotto la pioggia`, x: `«Amos voleva andare dalla polizia», dice Rook. «L'ho aspettato sulla scala per parlargli, solo parlargli. L'ho preso per i polsi perché non scappasse. Il gradino era bagnato.» Si guarda le mani. «Mio fratello è annegato sul Meridian. Mantengo sua moglie e i suoi tre figli con quello che porto a terra di notte. E so cose che a lei servono, ${tit()}. Su chi comanda davvero in questo porto.»`, ch: [
    {t: `Consegnalo a Harrow`, ok: {x: `Rook si alza, ti porge i polsi da solo, e cammina fino a Wharf Lane senza bisogno che nessuno lo spinga. Padre Ambrose suona la campana a mezzogiorno, per la prima volta dopo una settimana, e la suona a lungo.`, rep: 1, rel: {harrow: 1, ambrose: 1}, flag: 'cam_arresto'}},
    {t: `Lascialo andare in cambio di quello che sa`, ok: {x: `«Gaunt. Il capitano di porto.» Rook parla a voce bassissima, anche se intorno c'è solo la pioggia. «Prende la sua parte di ogni carico che passa da qui. E paga qualcuno per tenere chiusa la bocca ai vecchi del Meridian. Prima con i soldi. Adesso…» Non finisce la frase. All'alba la sua barca non c'è più. Padre Ambrose non te lo perdona.`, clue: 'f_gaunt', rel: {harrow: -1, ambrose: -1}, flag: 'cam_fuga'}},
  ]}),
};

/* ------------------------------------------------ LA SEDUTA DI CARROW STREET */
Object.assign(CL, {

  c_acquisto: ['seduta', `Registro dei veleni della farmacia Hobb: tintura di digitale venduta al signor C. Blythe, tre giorni prima della seduta.`],
  f_sindacato: ['frag', `La banca Thorne & Blythe custodiva il conto del Sindacato del Porto. Firmatari: Mortimer Gaunt e Silas Wren. L'ammanco scoperto da Thorne era su quel conto.`],
});
CASES.seduta = {
  title: `La Seduta di Carrow Street`, client: `Nell Quill, per Madame Varga`, days: 6, fee: 12, frag: 'f_sindacato',
  letter: `Un biglietto scritto in fretta su carta da bozze della Gazette, con l'inchiostro ancora sbavato.\n\n«Hanno arrestato Madame Ysolde Varga, la medium di Carrow Street: il banchiere Edmund Thorne le è morto davanti durante una seduta, con la mano ancora nella mano della figlia. La città vuole una strega da impiccare e il giudice ha voglia di accontentarla. Lei giura di essere innocente. Io non so se crederle, ma so che non mi piace come corre questa storia. Mi serve qualcuno che non creda ai fantasmi. Pago io, di tasca mia. — N. Quill, Saltmere Gazette»`,
  actions: [
    {id: 'sala', loc: 'carrow', label: `Esamina la sala delle sedute`, scene: () => ({
      t: `Il salotto di Madame Varga`, talk: true, leave: `Esci dal salotto`,
      x: `Un agente annoiato rompe il sigillo per te. Dentro, velluto viola alle pareti, un tavolo rotondo coperto da un panno nero, sei sedie, una sfera di vetro sotto un fazzoletto di seta. L'aria sa di incenso vecchio e di lavanda. Sul tavolo ci sono ancora i sei bicchieri della seduta: la polizia ha portato via il corpo e la medium, e si è dimenticata di tutto il resto.`,
      ch: [
        {t: `Ispeziona il tavolo, sopra e sotto`, c: ['oss', 5], ok: {x: `Sotto il tavolo, dalla parte della medium, un pedale di ottone collegato con un filo a un martelletto nascosto nel piano: premi, e tre colpi secchi rispondono dall'«aldilà». Un trucco da fiera, eseguito con cura da artigiano.`, clue: 'c_meccanismo'}, ko: {x: `Ti siedi al posto di Thorne per guardare la stanza dal suo punto di vista. L'agente spegne la lampada per scherzo. Nel buio, qualcosa batte tre colpi sotto il tavolo. Quando la luce torna sei in piedi, con la sedia rovesciata, e l'agente non ride più.`, san: -1}},
        {t: `Annusa uno per uno i bicchieri`, q: 1, ok: {x: `Brandy. Brandy. Brandy, di quello buono. Il bicchiere davanti alla sedia di Thorne ha lo stesso brandy, ma sotto c'è un odore amaro, erbaceo, come di foglie schiacciate.`, clue: 'c_bicchiere'}},
        {t: `Leggi l'agenda delle sedute`, q: 1, ok: {x: `Un'agenda rilegata in pelle viola, con le pagine scritte in una grafia tondeggiante da collegio. Martedì, ore nove: «Sig. Thorne e famiglia. Prenotato e saldato dal sig. C. Blythe. Contattare la defunta sig.ra Thorne». Accanto, una nota a matita: «Doppio compenso. Discrezione».`, clue: 'c_agenda'}},

    {id: 'varga', loc: 'polizia', label: `Visita Madame Varga in cella`, scene: () => ({
      t: `La cella numero tre`, talk: true, leave: `Chiama la guardia`,
      x: `Senza turbante e senza gioielli, Ysolde Varga sembra una sarta stanca di cinquant'anni, con i capelli grigi raccolti in fretta e le mani rovinate dal freddo. Solo gli occhi sono ancora da medium: neri, attenti, fermi su di te prima ancora che tu apra bocca.\n\n«Lei è quello della Quill», dice. «Mi sieda accanto. Gli spiriti dicono che porta buone notizie.» Sorride. «Scherzo. Gli spiriti non dicono niente a nessuno.»`,
      ch: [
        {t: `Chiedile chi c'era alla seduta`, q: 1, ok: {x: `Conta sulle dita. «Il signor Thorne, che voleva parlare con la moglie morta. Sua figlia Clara, che non voleva essere lì. Il socio, il signor Blythe, gentilissimo. E due vedove del porto, clienti fisse, sorde tutte e due.» Alza le spalle. «Una seduta come tante, finché il banchiere non mi è morto in mano.»`, clue: 'c_presenti'}},
        {t: `Ascoltala con pazienza`, c: ['per', 4], p: 1, g: 'c_varga', ok: {x: `Le lasci raccontare tutto, anche le cose che non c'entrano: l'Ungheria che forse non ha mai visto, il marito che forse non è mai esistito. Poi, quasi per caso, arriva al punto. «Il brandy l'ha portato il signor Blythe. Un regalo, ha detto, per scaldare gli spiriti. Ha versato lui, cominciando dal bicchiere del signor Thorne. Io non lo bevo, il brandy. Mi rovina la voce.»`, clue: 'c_varga'}, ko: {x: `Ti parla per un'ora di aure, ectoplasmi e di un capo indiano che la protegge dall'aldilà. Quando la guardia bussa, ti accorgi di non avere scritto niente.`}},
        {t: `Dille che sai del pedale sotto il tavolo`, req: () => has('c_meccanismo'), g: 'c_varga', ok: {x: `Varga ride, finalmente sincera, con una risata roca da fumatrice. «Allora sa che sono una ladra, non un'assassina. È già qualcosa.» Ti racconta tutto, senza fronzoli: Blythe e il suo brandy, il primo bicchiere riempito per Thorne, il banchiere che si porta la mano al petto a metà dell'invocazione.`, clue: 'c_varga', flag: 'varga_ammette'}},
        {t: `Spaventala: la forca è più vicina di quanto crede`, c: ['ner', 5], p: 1, g: 'c_varga', ok: {x: `La paura le scioglie la lingua in un modo che non ti piace. «Blythe! Il brandy l'ha portato Blythe, l'ha versato lui!» Poi si ricompone, e ti guarda come si guarda qualcuno di cui ci si ricorderà.`, clue: 'c_varga', flag: 'varga_odio'}, ko: {x: `«Le ho viste, le forche, signore. A Debrecen ne ho vista una con mio padre sopra.» Si sdraia sulla branda e ti volta le spalle. «Chiami la guardia, quando ha finito di spaventarmi.»`}},
      ]})},
    {id: 'thorne', loc: 'obitorio', label: `Esamina il corpo di Edmund Thorne`, scene: () => ({
      t: `L'obitorio`, x: `Edmund Thorne, sessant'anni, una vita di cene abbondanti e di firme su cambiali altrui. Sul marmo sembra più piccolo che nei ritratti della Gazette. Il coroner ha scritto «arresto cardiaco per forte emozione» con una calligrafia frettolosa e soddisfatta.`,
      ch: autopsy() ? [{t: `Esamina occhi e cuore`, ok: {x: `Le pupille sono anomale, con un alone giallastro. Il cuore, quando lo apri, è dilatato e floscio, come se fosse stato costretto a rallentare fino a fermarsi. Non è un'emozione: è digitale, e tanta.`, clue: 'c_digitale'}}]
        : [
          {t: `Chiedi di vedere il referto completo`, c: ['oss', 6], g: 'c_digitale', ok: {x: `Tra le note a margine del medico di turno, che il coroner ha ignorato: pupille con alone giallo, vomito, polso rallentato fino a quaranta battiti. Sintomi da manuale di un avvelenamento da digitale.`, clue: 'c_digitale'}, ko: {x: `Il referto è un muro di latino e di abbreviazioni che sembrano scritte apposta per non farsi capire.`}},
          {t: `Paga Stubbs perché te lo spieghi`, cost: 2, g: 'c_digitale', ok: {x: `Stubbs intasca le monete e si guarda intorno. «Il dottore giovane l'ha detto chiaro: questo è veleno di digitale, quello delle piante del cuore. Ma il coroner non vuole grane con la banca.» Si mette un dito sulle labbra.`, clue: 'c_digitale'}},
        ]})},
    {id: 'clara', loc: 'collina', label: `Fai visita a Clara Thorne`, scene: () => ({
      t: `Casa Thorne`, talk: true, leave: `Congedati`,
      x: `Clara Thorne porta il lutto come un'uniforme: nero fino al collo, nessun gioiello, la schiena dritta. Ha trent'anni e lo sguardo di chi ha tenuto i conti di casa da quando ne aveva quindici. Ti riceve in piedi, nel salotto, e non ti invita a sedere.`,
      ch: [
        {t: `Parlale di suo padre, non della sua morte`, c: ['per', 5], p: 1, g: 'c_libri', ok: {x: `Alla fine si siede. Ti parla di un uomo che le insegnava l'aritmetica con le monete d'oro della banca, e che negli ultimi mesi non dormiva. «Aveva trovato un ammanco nei conti. Un conto in particolare, di cui non voleva parlarmi. Quella settimana doveva affrontare il signor Blythe.» Si stringe le mani. «Non ha fatto in tempo.»`, clue: 'c_libri'}, ko: {x: `«Ha cinque minuti, signore.» Ne usi quattro male, e il quinto lo usa lei per accompagnarti alla porta.`}},
        {t: `Dille che suo padre è stato avvelenato`, req: () => has('c_digitale'), g: 'c_libri', ok: {x: `Clara si siede di colpo, come se le avessero tagliato i fili. Per un lungo momento non dice niente. Poi parla, piano, guardando il tappeto. «Aveva trovato un ammanco nei conti della banca. Un conto in particolare, di cui non voleva parlarmi. Quella settimana doveva affrontare il signor Blythe.» Alza gli occhi, asciutti e terribili. «Lo trovi, ${tit()}. Lo trovi, e io pagherò qualunque cifra.»`, clue: 'c_libri'}},
        {t: `Chiedile del testamento`, q: 1, ok: {x: `Il suo sguardo diventa di ghiaccio. «Eredito tutto, sì. Lo sa tutta Saltmere.» Una pausa. «E il giorno prima della seduta abbiamo litigato, davanti alla cameriera e al cuoco, perché non volevo andarci. Gli ho detto che era un vecchio sciocco a pagare una zingara per parlare con la mamma.» La voce le si incrina per un istante solo. «Sono state le ultime parole che gli ho detto da sola.»`, clue: 'c_eredita'}},
        {t: `Chiedile di Cornelius Blythe`, req: () => has('c_varga') || has('c_agenda') || has('c_presenti'), q: 1, ok: {x: `«Il socio di mio padre?» Clara arriccia le labbra. «Mi ha mandato fiori al funerale. Gigli bianchi, una montagna.» Guarda la finestra. «Papà odiava i gigli bianchi. Diceva che sapevano di morto. Il signor Blythe lo sapeva benissimo.»`}},
      ]})},
    {id: 'hobb', loc: 'porto', label: `Visita la farmacia Hobb`, scene: () => ({
      t: `Farmacia Hobb`, x: `Vasi di porcellana con scritte latine, sanguisughe in un barattolo di vetro che si muovono pigre, l'odore di canfora e di liquirizia. Dietro il banco, un garzone di sedici anni con i brufoli e un registro dei veleni legato al banco con una catenella.`,
      ch: [
        {t: `Allunga due sterline al garzone`, cost: 2, g: 'c_acquisto', ok: {x: `Il garzone guarda le monete, poi la porta, poi le monete. Sfoglia il registro con un dito sporco. «Eccolo. Tintura di digitale, una boccetta da un'oncia. Signor C. Blythe. Per il cuore, ha detto. Ha firmato qui.» La data è di tre giorni prima della seduta.`, clue: 'c_acquisto'}},
        {t: `Esigi di vedere il registro dei veleni`, need: () => S.rep >= 5 || S.bg === 'ispettore', why: `reputazione 5`, g: 'c_acquisto', ok: {x: `Il garzone non osa discutere con qualcuno che parla come un magistrato. Gira il registro verso di te. «Signor C. Blythe, tintura di digitale», tre giorni prima della seduta, con una firma svolazzante da banchiere.`, clue: 'c_acquisto'}},
      ]})},
  ],
  accuse: {

    suspects: [

      {id: 'varga', n: `Madame Ysolde Varga, la medium`,
        wrong: `Accusi Madame Varga. Il processo dura due giorni. Nell Quill scrive un articolo furioso contro di te che nessuno legge, e la medium lascia Saltmere in catene, verso il penitenziario di Dartmoor, guardandoti dal carro come si guarda un debito non pagato (−1 reputazione).`},
      {id: 'clara', n: `Clara Thorne, la figlia`, met: () => ['c_presenti', 'c_libri', 'c_eredita'].some(has),
        wrong: `Accusi Clara Thorne. Harrow la trattiene per una settimana, poi la rilascia per mancanza di prove. Ma Saltmere ha già deciso: per tutti sarà «la figlia che ha avvelenato il padre», e le finestre di casa Thorne restano chiuse anche di giorno (−1 reputazione).`},

    how: {q: `Come è morto Thorne?`, ok: ['c_digitale', 'c_bicchiere']},
    why: {q: `Perché doveva morire?`, ok: ['c_libri']},

  unproven: `Fai il nome di Blythe, ma senza prove. Il banchiere ti querela per diffamazione il giorno dopo, e il suo avvocato ti fa recapitare una lettera di quattro pagine. Nell Quill ti paga tre sterline e ti dice che almeno ci hai provato. Madame Varga resta in cella.`,
  fragX: `Mentre Harrow porta via Blythe, Clara Thorne ti ferma nell'ingresso della banca con un libro mastro aperto tra le braccia. «È questo il conto che mio padre aveva scoperto. Voglio che lo veda qualcuno che non lavora per loro.»\n\nIntestazione: «Sindacato del Porto di Saltmere». Firmatari autorizzati: Mortimer Gaunt, capitano di porto. Silas Wren, medico. L'ammanco scoperto da Thorne era lì: migliaia di sterline uscite in nove anni, a piccole rate, verso nomi che non dicono niente. E ogni anno, il 21 novembre, l'anniversario del Meridian, un prelievo più grande degli altri.`,
  finale: () => ({t: `Uscita dal carcere`, x: `Blythe viene arrestato nel suo ufficio, con la penna ancora in mano e una lettera a metà. Madame Varga esce dalla cella al tramonto, si sistema il turbante che qualcuno le ha restituito, e ti sorride come si sorride a un complice.\n\nNell Quill ha già il taccuino aperto e la matita tra i denti. «Allora, ${tit()}: la scriviamo tutta, la storia? Anche la parte del pedale sotto il tavolo?»`, ch: [
    {t: `Sì, tutta la verità, anche la truffa`, ok: {x: `La storia esce in prima pagina con un titolo a tre colonne. Varga lascia Saltmere entro la settimana, con i bauli e il turbante, e Nell ti offre da bere per un mese.`, rep: 1, rel: {nell: 1}, flag: 'sed_smaschera'}},
    {t: `Lascia fuori i trucchi di Varga`, ok: {x: `Nell storce il naso, mastica la matita, ma obbedisce. Varga ti mette in mano cinque sterline arrotolate e ti chiude le dita sopra. «Le devo una lettura. Una vera, stavolta. Quando avrà bisogno di sapere qualcosa che i vivi non dicono, venga a cercarmi.»`, money: 5, rel: {nell: -1}, flag: 'varga_debt'}},
  ]}),
};

/* ------------------------------------------------ IL MARINAIO TORNATO */
Object.assign(CL, {
  d_mancino: ['marinaio', `Nel registro della paga, le firme di Jonah Quayle degli anni passati pendono a destra. Quella di questo mese, e i nodi delle reti, sono di un mancino.`],

});
CASES.marinaio = {
  title: `Il Marinaio Tornato`, client: `Hester Quayle`, days: 7, fee: 8, frag: 'f_falle',
  letter: `Una grafia incerta, da chi ha imparato a scrivere tardi e con fatica, con le lettere grandi e premute forte sulla carta.\n\n«Mio marito Jonah è annegato due anni fa. Il mese scorso è tornato a casa. Ha la sua faccia, la sua voce, il suo modo di grattarsi la barba. I bambini sono felici. Io no. Lui è gentile con me, e Jonah non lo è stato mai. Non so chi dorme nel mio letto, e ho paura di chiederglielo. Vi pago con quello che ho.»`,
  actions: [
    {id: 'osserva', loc: 'porto', label: `Osserva «Jonah» al lavoro sul molo delle reti`, scene: () => ({
      t: `Il molo delle reti`, x: `Jonah Quayle ricuce reti con altri tre uomini, seduto su una cassa rovesciata, nel vento che sa di alghe e di catrame. È un uomo largo, con una barba rossiccia e le spalle curve di chi ha passato la vita a tirare cime. Ride poco, lavora il doppio. Ogni tanto alza gli occhi verso il mare, come se aspettasse qualcuno.\n\nIl caposquadra tiene il registro della paga appoggiato su un barile: ogni uomo firma quando ritira la settimana.`,
      ch: [{t: `Studia ogni suo gesto, e dai un'occhiata al registro`, c: ['oss', 5], ok: {x: `L'ago gli passa dalla mano sinistra alla destra solo per un attimo, poi torna nella sinistra. Annoda con la sinistra. E quando il caposquadra non guarda, sfogli il registro: le firme di Jonah Quayle degli anni passati pendono tutte a destra, strette e pesanti, come quelle di chi scrive con la destra. Quella di questo mese pende a sinistra, e l'inchiostro è sbavato dal lato del mignolo, come succede ai mancini.`, clue: 'd_mancino'}, ko: {x: `Ti nota. Smette di cucire e ti fissa, a lungo, senza ostilità e senza sorriso, finché non sei tu ad abbassare gli occhi e ad andartene.`}}]})},
    {id: 'battesimi', loc: 'archivio', label: `Cerca i Quayle nei registri dei battesimi`, scene: () => ({
      t: `I registri parrocchiali`, x: `La signorina Thursby ti porta tre volumi rilegati in pelle, con le costole spaccate. Nascite, battesimi, matrimoni e morti di tre generazioni di pescatori di Saltmere, scritti da parroci diversi con inchiostri diversi. Molti nomi hanno una croce a margine e una sola parola: «mare».`,
      ch: [{t: `Sfoglia l'anno di nascita di Jonah`, c: ['oss', 4], ok: {x: `Marzo 1849. «Quayle, Jonah, figlio di Thomas, pescatore.» E subito sotto, stessa data, stessa mano: «Quayle, Elias, figlio di Thomas, pescatore». Gemelli. A margine, aggiunto anni dopo con un inchiostro diverso: «Elias, emigrato a Halifax, Nuova Scozia, 1872».`, clue: 'd_gemelli'}, ko: {x: `Un'ora di nomi, di croci, di «mare». Nessun Quayle. Quando chiudi il volume ti accorgi che ti fanno male gli occhi.`}}]})},
    {id: 'ambrose_m', loc: 'chiesa', label: `Chiedi a Padre Ambrose dei Quayle`, scene: () => ({
      t: `La sagrestia`, x: `Padre Ambrose ti ascolta con le mani giunte sul tavolo. Quando pronunci il nome di Jonah Quayle, chiude gli occhi un momento.`,
      ch: [{t: `Chiedigli cosa sa dell'uomo tornato`, ok: {x: `«Da un mese qualcuno lascia del denaro nella cassetta, per le vedove del porto. Banconote, non spiccioli. Una sera sono rimasto nascosto dietro il confessionale per vedere chi era.» Riapre gli occhi. «Jonah Quayle. Il Jonah che conoscevo io non avrebbe dato un penny a una vedova nemmeno con un coltello alla gola.» Tace. «Un uomo che torna dalla morte e pensa prima alle vedove degli altri. Non so se sia un miracolo o un rimorso.»`, clue: 'd_soldi'}}]})},
    {id: 'kittiwake', loc: 'taverna', label: `Ascolta i vecchi della Kittiwake`, cost: 1, scene: () => ({
      t: `Il tavolo dei vecchi`, x: `Tre marinai della Kittiwake, la barca da cui Jonah scomparve, giocano a domino in un angolo con la concentrazione di chi non ha altro da fare fino alla morte. Paghi un giro, e il più vecchio, Ebenezer, sposta i pezzi per farti posto.`,
      ch: [{t: `Chiedigli com'è morto Jonah`, ok: {x: `«Jonah voleva la campana del Meridian.» Ebenezer si accende la pipa con calma. «Bronzo buono, diceva. Una fortuna. Si è legato una cima alla vita e si è buttato sopra il relitto, con la bassa marea.» Gli altri due smettono di giocare. «Non è più risalito. La cima l'abbiamo tirata su tagliata netta, come con un coltello. Poi la barca ha cominciato a imbarcare acqua da sola.» Si fa il segno della croce. «Mentre affondavamo, sotto di noi, la campana suonava.»`, clue: 'd_relitto'}}]})},
    {id: 'hester', loc: 'porto', label: `Parla con Hester Quayle`, scene: () => ({
      t: `Casa Quayle`, talk: true, leave: `Congedati`,
      x: `Una casetta di pietra in fondo a Gut Lane, con le reti appese ad asciugare alla finestra e un bambino piccolo che gioca con una conchiglia sulla soglia. Hester Quayle ha trentacinque anni e ne dimostra cinquanta, le mani screpolate di sale e uno sguardo che non sta fermo. Ti fa entrare quando l'uomo è al molo.`,
      ch: [
        {t: `Chiedile cosa la convince che sia lui`, q: 1, ok: {x: `«Sa tutto.» Lo dice come un'accusa. «Sa che il piccolo lo chiamiamo Granchio e la grande Stellina. Sa la canzone del gabbiano che Jonah cantava la sera, quando era sobrio, cioè quasi mai. Sa dov'è nascosto il coltello buono.» Si torce le mani. «Come può saperlo, se non è lui?»`, clue: 'd_ricordi'}},
        {t: `Chiedile cosa è diverso`, q: 1, ok: {x: `Hester guarda il bambino sulla soglia, e abbassa la voce. «Jonah beveva. Questo non beve. Jonah alzava le mani, su di me e sui bambini. Questo non le alza mai. Mai.» Gli occhi le si riempiono di lacrime che non scendono. «Dio mi perdoni, ${tit()}, ma è questo che mi fa paura. Che preferisco lui.»`, clue: 'd_diverso'}},
      ]})},
    {id: 'parla', loc: 'porto', label: `Parla con «Jonah»`, if: () => ['d_mancino', 'd_gemelli', 'd_soldi', 'd_relitto', 'd_ricordi', 'd_diverso'].some(has), scene: () => ({
      t: `Casa Quayle, a sera`, talk: true, leave: `Vattene`,
      x: `Jonah ti fa entrare senza chiederti chi sei: lo sa già. I bambini dormono nell'altra stanza, Hester è dalla vicina. Ti versa un bicchiere d'acqua, perché in casa non c'è altro da bere, e resta in piedi accanto alla stufa con le braccia conserte.\n\n«Mia moglie l'ha pagata per scoprire chi sono», dice. «Allora scopra. Ma piano. I bambini hanno il sonno leggero.»`,
      ch: [
        {t: `Chiedigli com'è sopravvissuto al naufragio`, q: 1, ok: {x: `«Mi sono aggrappato a un barile.» Lo dice guardando la stufa. «Le correnti mi hanno portato a nord. Un peschereccio scozzese mi ha tirato su mezzo morto. Ho perso la memoria per un anno, poi è tornata.» È un racconto liscio, senza un nodo, come una rete nuova mai usata. Quando parla della Kittiwake, la chiama «la barca», come chi l'ha vista solo da lontano.`}},
        {t: `Chiedigli con calma chi è davvero`, c: ['per', 5], p: 1, g: 'd_confessione', ok: {x: `Resta in silenzio così a lungo che senti la stufa ticchettare. Poi si siede, finalmente, e si prende la testa tra le mani. «Sono Elias. Jonah è morto. Ci scrivevamo, da Halifax: tutto, ogni cosa, i nomi dei bambini, le canzoni. Nell'ultima lettera mi faceva promettere: se mi succede qualcosa, pensa tu a loro.» Alza gli occhi. «Sono arrivato e ho visto Hester. E i lividi vecchi. E non ho avuto il coraggio di dire chi ero.»`, clue: 'd_confessione'}, ko: {x: `«Sono Jonah Quayle», dice, senza alzare la voce. «E lei è in casa mia.» Apre la porta e aspetta che tu esca.`}},
        {t: `Mostragli il registro dei battesimi`, req: () => has('d_gemelli'), g: 'd_confessione', ok: {x: `Guarda la pagina copiata a mano, i due nomi uno sotto l'altro. Chiude gli occhi. «Sono Elias. Jonah è annegato, due anni fa. Ci scrivevamo tutto. Mi aveva fatto promettere: se mi succede qualcosa, pensa tu a loro.» La voce gli si spezza sull'ultima parola. «Ho mantenuto la promessa nel modo sbagliato.»`, clue: 'd_confessione'}},

CASES.pegno = {

  letter: `Inchiostro verde, grafia minuta da contabile, nessuna cancellatura.\n\n«Qualcuno ha forzato il mio banco la notte di lunedì. Ha lasciato l'argenteria, gli orologi e la cassa. Ha preso solo un ciondolo da quattro soldi, impegnato da un marinaio per mezza corona. Non mi interessa il ciondolo. Mi interessa sapere chi entra in casa mia per rubare spazzatura, perché la prossima volta potrebbe non essere spazzatura. Pago bene e pago puntuale. — E. Voss»`,

        {t: `Chiedigli chi ha le chiavi del banco`, q: 1, ok: {x: `«Io, e la ragazza.» Indica con il mento la porta del magazzino, da cui viene un rumore di scatole spostate. «Lucy Marsh, l'apprendista. Brava, svelta, onesta. Almeno fino a lunedì.»`}},

        {t: `Mostrale dove sono caduti i vetri`, req: () => has('e_finto'), g: 'e_lucy', ok: {x: `Lucy guarda le schegge nel vicolo, poi te. Si copre la faccia con le mani. Racconta tutto: il signore che l'aspettava all'uscita, le cinque sterline, la porta aperta, la finestra rotta con il ferro da stiro. «Aveva una borsa da medico, nera, di cuoio. E odorava come l'ospedale, quel profumo che fa venire in mente i morti.»`, clue: ['e_lucy', 'e_borsa']}},

      ch: [
        {t: `Convincilo che sei dalla sua parte`, c: ['per', 5], p: 1, g: 'e_simbolo', ok: {x: `Gli parli di Fenn, di quello che hai visto, di quello che pensi. A poco a poco Ned smette di guardare la porta. «L'ho rubato a lui. Al dottore. Dalla tasca del cappotto, mentre mi visitava il petto.» Tossisce. «Volevo una prova. Una campana dentro un'onda: è il loro segno, ce l'hanno tutti, sotto la camicia. Poi ho avuto paura e l'ho impegnato da Voss, che almeno non fosse addosso a me.» Ti afferra la manica. «Il dottore lo rivuole. E rivuole anche me.»`, clue: 'e_simbolo', next: nedShelter}, ko: {x: `Scivola via dalla porta di servizio, lasciandosi dietro la coperta e l'odore della paura.`}},
        {t: `Pagagli una notte di letto e una cena calda`, cost: 2, g: 'e_simbolo', ok: {x: `Mangia come un lupo, con le mani, senza alzare gli occhi dal piatto. Poi si pulisce la bocca con la manica e parla. «Il ciondolo l'ho rubato al dottore, mentre mi visitava. Volevo una prova. È il loro segno, la campana nell'onda.» Ti guarda. «Il dottore lo rivuole. E rivuole anche me.»`, clue: 'e_simbolo', next: nedShelter}},

      ch: [
        {t: `Esamina il serbatoio dell'olio`, c: ['oss', 5], ok: {x: `Sviti il tappo del serbatoio e immergi un dito. L'olio è torbido, e sul fondo, quando inclini il recipiente, si muove uno strato più pesante e trasparente. Lo assaggi: sale. Qualcuno ha allungato l'olio con acqua di mare. La fiamma arde per qualche ora, poi l'acqua arriva allo stoppino e la lanterna si spegne da sola, come se qualcuno ci avesse soffiato sopra.`, clue: 'g_olio'}, ko: {x: `Il vento apre la porta della balconata con un colpo, e per un istante il vuoto ti tira verso di sé come una mano. Ti aggrappi all'ottone della lanterna con le nocche bianche, e quando il cuore smette di martellare hai dimenticato cosa stavi cercando.`, san: -1}},
        {t: `Esci sulla balconata`, q: 1, ok: {x: `Il vento ti schiaccia contro il muro. Ti muovi lungo la ringhiera centimetro per centimetro. In un punto, impigliato in una scaglia di ruggine, c'è un filo di pizzo bianco, sottile, da abito buono. Lo annusi: sa di catrame, come le mani di chi lavora sulle barche.`, clue: 'g_balcone'}},
      ]})},
    {id: 'penrose', loc: 'faro', label: `Parla con Josiah Penrose, il guardiano`, scene: () => ({
      t: `La casetta del guardiano`, talk: true, leave: `Lascialo al suo faro`,
      x: `Josiah Penrose ha sessant'anni, una barba bianca da profeta e le mani che tremano finché non le appoggia sul tavolo. La casetta è pulitissima, come se qualcuno la tenesse in ordine per un'ospite. Sul davanzale, accanto a una conchiglia, c'è un ritratto di una donna giovane con un velo da sposa.\n\n«Lei pensa che io beva», dice prima che tu parli. «Lo pensano tutti. Hanno ragione. Ma non bevo per vedere Mary. Bevo dopo averla vista.»`,
      ch: [
        {t: `Chiedigli di sua moglie Mary`, q: 1, ok: {x: `Penrose prende il ritratto dal davanzale e lo tiene con entrambe le mani. «Mary. Trent'anni di matrimonio su questo scoglio. La febbre se l'è presa in tre giorni, due inverni fa.» Si schiarisce la voce. «Non avevo i soldi per il funerale. Ho venduto tutti i suoi vestiti al banco dei pegni, in città. Anche l'abito da sposa. Era l'unica cosa bella che avevamo.»`, clue: 'g_mary'}},
        {t: `Chiedigli da dove viene il gin`, c: ['per', 4], p: 1, g: 'g_gin', ok: {x: `Esita, poi indica la soglia con il mento. «Ogni sera, da un mese, trovo una bottiglia lì. Gin buono, di Plymouth. Non so chi la lascia.» Abbassa gli occhi. «Pensavo fosse la Corporazione, per pietà. O Mary.» Ride, senza allegria. «Mary non ha mai sopportato che bevessi.»`, clue: 'g_gin'}, ko: {x: `«Quello che bevo sono affari miei e di Dio.» Si alza e mette su il bollitore, dandoti la schiena.`}},
        {t: `Chiedigli cosa è successo la notte del Rosalind`, q: 1, ok: {x: `Penrose guarda le sue mani. «Ho visto Mary sulla balconata, alle due. Bianca, con il velo, che mi guardava dalla vetrata. Sono sceso a bere. Quando sono risalito la lanterna era spenta e sentivo le grida del Rosalind sugli scogli.» Alza gli occhi, umidi. «Sì, avevo bevuto. Lo scriva pure. È colpa mia. Ma la lanterna l'avevo riempita io, quella sera, e l'avevo accesa io.»`, clue: 'g_ubriaco'}},
      ]})},
    {id: 'veglia', loc: 'faro', notte: true, label: `Veglia di notte ai piedi del faro`, scene: () => ({
      t: `La veglia`, x: `Ti nascondi tra gli scogli ai piedi della torre, avvolto nel cappotto, con il mare che ti bagna le scarpe a ogni onda. Sopra di te la lanterna gira lenta, e il suo fascio passa sul mare come una mano che accarezza un animale nero. Le ore passano. Poi, poco dopo le due, il fascio vacilla, si fa giallo, si spegne.\n\nSulla balconata, nella luce della luna, c'è una figura bianca.`,
      ch: [{t: `Corri su per la scala`, c: ['ner', 5], ok: {x: `Sali a due a due, con il cuore in gola. A metà scala senti dei passi che scendono di corsa, pesanti, e una porta di servizio che sbatte. Quando arrivi in cima la balconata è vuota. Ma sulla polvere degli scalini, illuminate dalla tua lanterna, ci sono impronte di zoccoli di legno, quelli che portano le pescatrici, e nell'aria resta un odore di catrame e di acqua di rose. I fantasmi non portano zoccoli.`, clue: 'g_figura'}, ko: {x: `La figura bianca si volta verso di te, giù, sugli scogli. Ha il velo sulla faccia, e il vento lo solleva un istante. Sotto non vedi niente: solo buio. Quando riesci a muoverti, la balconata è vuota e tu hai le mani piene di sangue, per quanto hai stretto la roccia.`, san: -1}}]})},
    {id: 'sedge', loc: 'taverna', label: `Chiedi dei raccoglitori di relitti`, cost: 1, scene: () => ({
      t: `L'Ancora Annegata`, x: `Paghi un giro al tavolo dei piloti, e quando nomini Gull Point uno di loro, un vecchio con la pelle come cuoio, sputa nel fuoco.`,
      ch: [{t: `Chiedigli chi ci guadagna se una nave si spacca sugli scogli`, ok: {x: `«I Sedge.» Lo dicono in tre, insieme. «Madre Sedge e sua figlia Ruth, e i cugini. Vivono in una baracca sugli scogli di Gull Point, e campano di quello che il mare porta a riva: botti, corde, casse, anelli dalle dita dei morti.» Il vecchio si pulisce la bocca. «Prima di Penrose c'era un naufragio ogni inverno, e i Sedge si vestivano di seta. Da quando c'è lui, niente. Madre Sedge è nervosa, dicono. Molto nervosa.»`, clue: 'g_sedge'}}]})},
    {id: 'abito', loc: 'pegni', label: `Chiedi a Voss dei vestiti di Mary Penrose`, if: () => has('g_mary') || has('g_balcone') || has('g_figura'), scene: () => ({
      t: `Il registro di Voss`, x: `Voss solleva la lente e ti fissa. «I vestiti di una morta, di due inverni fa? Lei ha una curiosità ben strana, ${tit()}.» Ma tira giù il registro, perché un registro, per lui, è una cosa che si mostra con orgoglio.`,
      ch: [{t: `Cerca l'abito da sposa`, ok: {x: `Voss scorre le pagine con il dito guantato. «Penrose, Josiah. Lotto di abiti femminili. Venduti quasi tutti alla rigattiera di Fish Street.» Il dito si ferma. «Tranne uno. Abito da sposa in seta e pizzo, venduto il mese scorso per sei scellini.» Gira il registro verso di te. «A Ruth Sedge. Me lo ricordo, perché ha pagato in monete bagnate.»`, clue: 'g_abito'}}]})},
  ],
  accuse: {

    suspects: [
      {id: 'sedge', n: `Ruth e Madre Sedge, i raccoglitori di relitti`, culprit: true, met: () => has('g_sedge') || has('g_abito')},
      {id: 'penrose', n: `Josiah Penrose, il guardiano`,
        wrong: `Riferisci alla Corporazione che il guardiano beve e trascura la lanterna. Penrose viene licenziato e lascia il faro con una valigia e il ritratto di Mary sotto il braccio. Il nuovo guardiano arriva dopo tre settimane. Nella seconda, una goletta norvegese si spacca su Gull Point (−1 reputazione).`},
      {id: 'mary', n: `Lo spirito di Mary Penrose`,
        wrong: `Riferisci al capitano Ardley che non hai trovato spiegazioni naturali. Ardley ti guarda come si guarda un uomo che ha deluso il reggimento, e chiama un prete. Il prete benedice il faro. Due settimane dopo la lanterna si spegne di nuovo (−1 reputazione).`},
