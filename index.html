    how: {q: `Come fanno spegnere la lanterna, e come fanno credere al fantasma?`, ok: ['g_olio', 'g_figura', 'g_abito']},
    why: {q: `Perché lo fanno?`, ok: ['g_sedge']},
  },
  unproven: `Fai il nome dei Sedge, ma non hai prove. Ardley manda due piloti alla baracca sugli scogli: trovano solo una vecchia che sputa e una ragazza che ride. La Corporazione ti paga tre sterline e licenzia Penrose «per prudenza».`,
  fragX: `Quando Harrow e i piloti circondano la baracca dei Sedge, Madre Sedge non scappa. È una vecchia minuscola, con le mani nere di catrame e gli occhi chiari come l'acqua bassa. Ti chiama con un dito.\n\n«Vuoi sapere una cosa, investigatore? Gratis. La notte del Meridian, il faro era acceso e il mare era liscio come un piatto. Mio marito era sugli scogli, ad aspettare, perché noi aspettiamo sempre. E ha visto una lancia staccarsi dal brigantino prima che andasse giù. Dentro c'erano due signori. Il capitano di porto, quello giovane, allora. E il dottorino.» Sorride senza denti. «Il Meridian è affondato dopo. Da solo. Con quaranta uomini chiusi sotto. Noi Sedge rubiamo ai morti. Quelli lì i morti li fanno.»`,
  finale: () => ({t: `Gli scogli di Gull Point`, x: `Ruth Sedge ha diciotto anni, i capelli neri bagnati di salsedine e l'abito da sposa di Mary Penrose arrotolato sotto il braccio come uno straccio. Madre Sedge le tiene una mano sulla spalla. Il capitano Ardley aspetta la tua decisione a qualche passo, con due piloti armati di bastone.\n\n«Siamo poveri, signore», dice Madre Sedge. «Il mare è la nostra terra. Senza naufragi si muore di fame, su questi scogli.»`, ch: [
    {t: `Consegnale alla giustizia`, ok: {x: `Harrow arriva con il carro all'alba. Madre Sedge sale da sola, dritta come una regina, e Ruth la segue piangendo. Ardley ti stringe la mano. «Trenta uomini del Rosalind le devono la pelle, ${tit()}. La Corporazione non lo dimenticherà.»`, rep: 1, rel: {harrow: 1}, flag: 'faro_arresto'}},
    {t: `Lasciale andare, a patto che lascino Gull Point`, ok: {x: `Madre Sedge ti guarda a lungo, poi annuisce. Entro una settimana la baracca sugli scogli è vuota. Ardley borbotta, ma paga. Penrose torna a riempire la lanterna con olio pulito, ogni sera, e non trova più gin sulla soglia.`, san: 1, flag: 'faro_esilio'}},
    {t: `Paga di tasca tua le cure di Penrose`, cost: 4, ok: {x: `Lasci che la Corporazione si occupi dei Sedge, e porti tu stesso Penrose dal medico dell'ospedale dei marinai, non da quello del dispensario. Quattro sterline per un mese di cure. Penrose ti stringe le mani con le sue, che non tremano più tanto. «Mary le avrebbe preparato le frittelle», dice.`, san: 1, rep: 1, flag: 'faro_penrose'}},
  ]}),
};

CASES.cera = {
  title: `Il Bambino di Cera`, client: `Maggie Rourke`, days: 6, fee: 6, frag: 'f_davy',
  letter: `Non è una lettera: è un foglio di carta da pacchi, scritto a matita da qualcuno che non ha l'abitudine, con le parole divise in sillabe.\n\n«Mio figlio Davy ha dodici anni. È sparito da sei giorni. Lavora alla corderia di Rope Walk, è un bravo ragazzo, non scappa. La polizia dice che è annegato e che il mare me lo ridarà. Ieri nella vetrina del Museo delle Cere hanno messo un bambino di cera uguale a lui, con scritto sotto Il Piccolo Annegato. Ho sei sterline messe da parte. Sono vostre. Ditemi se mio figlio è morto. — Maggie Rourke»`,
  actions: [
    {id: 'vetrina', loc: 'cere', label: `Guarda la figura nella vetrina`, scene: () => ({
      t: `La vetrina di Fish Street`, talk: true, leave: `Allontanati dalla vetrina`,
      x: `Una piccola folla si accalca davanti alla vetrina del Museo delle Cere, tra pescivendole e garzoni. Tra Maria Stuarda e il capitano Kidd, su un drappo di velluto verde come le alghe, c'è un bambino di cera di dodici anni, con i calzoni rattoppati, i piedi nudi, gli occhi di vetro aperti. La pelle è grigiastra, lucida come quella di un annegato. È così vero che una donna, accanto a te, si fa il segno della croce e se ne va.\n\nSotto, un cartello: «IL PICCOLO ANNEGATO, ripescato dalla nebbia. Prossimamente in esposizione, sei pence.»`,
      ch: [
        {t: `Guarda da vicino i capelli`, c: ['oss', 4], ok: {x: `Appoggi la fronte al vetro. I capelli della figura non sono di lana o di crine, come quelli di Maria Stuarda: sono capelli veri, castani, sottili come quelli di un bambino, piantati uno a uno nella cera. E sulle punte si vede il taglio netto, fresco, di una forbice.`, clue: 'k_capelli'}, ko: {x: `Più guardi la figura, più ti sembra che il petto si muova, piano, come quello di chi dorme. Ti stacchi dal vetro con la nausea, e la folla ti guarda come se fossi tu, lo spettacolo.`, san: -1}},
        {t: `Guarda le sue mani`, q: 1, ok: {x: `La mano destra della figura è chiusa a pugno. Tra le dita di cera esce un nastro blu da capelli, sbiadito dai lavaggi, di quelli che si comprano a un penny al mercato. Non c'entra niente con un annegato. Sembra un messaggio.`, clue: 'k_nastro'}},
      ]})},
    {id: 'quint', loc: 'cere', label: `Parla con Tobiah Quint, il proprietario`, scene: () => ({
      t: `Il museo`, talk: true, leave: `Lascialo ai suoi manifesti`,
      x: `Tobiah Quint è un ometto con i baffi impomatati e un panciotto a quadri gialli, che si muove tra le sue figure di cera come un sacerdote tra i santi. Ti accoglie con un inchino da palcoscenico. «Benvenuto, benvenuto! Il Museo Quint: la storia, il crimine, la morte. Tutto a due pence. Per lei, che ha l'aria di un intenditore, uno.»`,
      ch: [
        {t: `Chiedigli della figura nuova`, q: 1, ok: {x: `Quint si gonfia come un gallo. «Il Piccolo Annegato! La mia opera migliore. L'ho fatta io, con le mie mani, da un ritratto.» Ti mostra un fascio di manifesti ancora umidi d'inchiostro. «Sei pence per vederlo da vicino. Con la storia di un bambino scomparso proprio in questi giorni, ${tit()}, la gente farà la fila fino al porto.» Si frega le mani. «Il dolore delle madri è la miglior pubblicità che esista.»`, clue: 'k_quint'}},
        {t: `Fagli capire che sai che mente`, c: ['per', 5], p: 1, g: 'k_vero', ok: {x: `Lo lasci parlare, poi gli fai notare, con calma, che le sue figure hanno tutte capelli di crine, e quella no. Che lui ha le mani pulite come un notaio. Quint si sgonfia. «E va bene. Va bene. Una mattina sono sceso in laboratorio e l'ho trovata lì, finita, su un tavolo. Non l'ho fatta io.» Si guarda alle spalle, verso una porta a tende. «L'ha fatta Mabel. Mabel Fry, la mia scultrice. Non le ho chiesto niente. Una figura così vale oro.»`, clue: 'k_vero'}, ko: {x: `«Mi offende, signore. Mi offende profondamente.» Quint ti accompagna alla porta tenendoti per il gomito, sempre sorridendo, e ti restituisce il penny dell'ingresso perché tu non torni.`}},
      ]})},
    {id: 'mabel', loc: 'cere', label: `Parla con Mabel Fry, la scultrice`, if: () => has('k_vero') || has('k_briciole'), scene: () => ({
      t: `Il laboratorio`, talk: true, leave: `Esci dal laboratorio`,
      x: `Dietro la tenda, il laboratorio: un fornello con una pentola di cera che sobbolle, teste senza corpo sugli scaffali, occhi di vetro in una scatola di biscotti. Mabel Fry è una donna di quarant'anni, grande e silenziosa, con un grembiule di cuoio e le maniche arrotolate. Sta modellando un orecchio, e non si ferma quando entri.`,
      ch: [
        {t: `Guardale le mani mentre lavora`, q: 1, ok: {x: `Ha le dita incrostate di cera d'api, gialla e dura sotto le unghie. E impigliati nella cera, quando muove le mani alla luce del fornello, vedi due o tre capelli castani, sottili, corti. Si accorge che guardi. Si pulisce le mani nel grembiule, lentamente.`, clue: 'k_mani'}},
        {t: `Dille che vuoi solo sapere se Davy è vivo`, c: ['per', 6], p: 1, g: 'k_davy', ok: {x: `Mabel posa l'orecchio di cera sul tavolo. Ti guarda a lungo, con occhi grigi e stanchi, poi prende una candela. «Venga. Piano.» Ti porta su per una scala a pioli fino al sottotetto. Tra le casse, sotto una coperta, un bambino di dodici anni dorme con la bocca aperta e un fischietto di latta in mano. «Davy. Si è presentato alla mia porta sei notti fa, bagnato fradicio, e non vuole tornare a casa. Ha visto qualcosa, e ha paura che se ne accorgano.» Sospira. «La figura l'ho fatta per sua madre. Il nastro gliel'aveva dato lei. Volevo che sapesse, senza che nessun altro capisse.»`, clue: 'k_davy'}, ko: {x: `«Non so di cosa parla.» Mabel riprende a modellare l'orecchio, e non dice più una parola. Il fornello borbotta.`}},
        {t: `Mostrale cosa hai trovato nel sottotetto`, req: () => has('k_briciole'), g: 'k_davy', ok: {x: `Le metti sul tavolo il fischietto di latta. Mabel lo guarda e chiude gli occhi. «Allora lo sa già.» Ti porta su lei stessa: Davy è nascosto dietro le casse, con le ginocchia al petto, sveglio. «Ha visto qualcosa la notte che è morto il cordaio. Non vuole tornare a casa perché ha paura che lo trovino lì.» Ti guarda. «La figura era per sua madre. Il nastro gliel'aveva dato lei.»`, clue: 'k_davy'}},
      ]})},
    {id: 'sottotetto', loc: 'cere', notte: true, label: `Entra nel museo di notte`, scene: () => ({
      t: `Il museo di notte`, x: `La porta sul retro ha una serratura vecchia che si apre con un temperino e un po' di pazienza. Dentro, al buio, le figure di cera sono peggio che di giorno: le vedi solo quando la tua lanterna le sfiora, e ognuna sembra appena essersi fermata. Il capitano Kidd ha la testa girata verso di te. Prima, ne sei sicuro, guardava la porta.`,
      ch: [{t: `Sali fino al sottotetto`, c: ['ner', 5], ok: {x: `La scala a pioli scricchiola a ogni gradino. Nel sottotetto, tra le casse di figure rotte e i barattoli di colore, trovi un angolo pulito: briciole di pane fresco, una coperta da bambino ancora tiepida e, dimenticato su una trave, un fischietto di latta come quelli che usano i ragazzi della corderia per chiamarsi da un capo all'altro della strada. Chiunque dormisse qui, è scappato quando ti ha sentito salire.`, clue: 'k_briciole'}, ko: {x: `A metà del museo una mano di cera ti sfiora la nuca. Ti giri con la lanterna alta: è Maria Stuarda, decapitata, che ti porge la sua testa. Esci di corsa, e solo in strada ti accorgi che la testa non era nelle sue mani quando sei entrato.`, san: -1}}]})},
    {id: 'maggie', loc: 'porto', label: `Parla con Maggie Rourke`, scene: () => ({
      t: `Rope Walk`, talk: true, leave: `Prometti di trovarlo`,

      ch: [
        {t: `Chiedile quando è sparito Davy`, q: 1, ok: {x: `«Martedì notte. Era di turno di notte alla corderia, a portare il catrame.» Si asciuga la faccia con il dorso della mano. «La stessa notte che è morto il signor Fenn, il cordaio, quello qui accanto, al numero 22. Davy gli portava la legna, ogni sera. Gli voleva bene.» Ti guarda come se dovessi capire qualcosa che lei non capisce. «La mattina dopo Davy non c'era più.»`, clue: 'k_sparito'}},
        {t: `Mostrale il nastro blu della figura`, req: () => has('k_nastro'), q: 1, ok: {x: `Maggie si porta una mano alla bocca. «È il mio. È il mio nastro. Gliel'ho legato al polso il primo giorno che è andato alla corderia, perché si ricordasse di me durante i turni lunghi.» Ti afferra il braccio con una forza che non ti aspettavi. «Chi gliel'ha preso? Chi?»`, clue: 'k_nastro_m'}},

  unproven: `Sospetti Mabel, ma non hai prove, e lei nega con la calma di una statua. Maggie ti paga tre sterline. Due giorni dopo, la figura sparisce dalla vetrina, e nessuno sa dove sia finita.`,

  finale: () => ({t: `Il sottotetto`, x: `Mabel tiene una mano sulla spalla di Davy. Giù in strada, attraverso l'abbaino, si sente la voce di Maggie che chiama il nome del figlio tra la gente, come fa ogni sera da sei giorni.\n\n«Cosa ne facciamo di lui, ${tit()}?» chiede Mabel. «Quelli là lo cercano. Lo sento.»`, ch: [
    {t: `Riportalo da sua madre, adesso`, ok: {x: `Scendi in strada con Davy per mano. Maggie lo vede, e il grido che fa ti resterà nelle orecchie per anni. Lo stringe così forte che il ragazzo ride e piange insieme. Quella notte, in casa Rourke, si tengono le finestre chiuse e la candela accesa.`, rep: 1, san: 1, flag: 'cera_madre'}},
    {t: `Convincilo a testimoniare davanti a Harrow`, ok: {x: `Davy trema, ma accetta, se Mabel resta con lui. Harrow ascolta il suo racconto chiuso in ufficio, con le tende tirate, e alla fine scrive tutto di suo pugno e fa firmare il ragazzo con una croce. «Questo vale più di dieci dei miei agenti», ti dice. Poi manda un uomo a sorvegliare casa Rourke, giorno e notte.`, rel: {harrow: 1}, heat: 1, flag: ['davy_witness', 'cera_madre']}},
    {t: `Lascialo nascosto da Mabel finché tutto non sarà finito`, ok: {x: `Racconti a Maggie che suo figlio è vivo e al sicuro, ma non dove. Lei ti guarda come se le avessi dato e tolto la vita nello stesso istante, poi annuisce. Mabel ti stringe la mano con la sua, grande e calda di cera. «Nessuno guarda in un museo delle cere, ${tit()}. Qui dentro sono tutti morti.»`, flag: 'cera_nascosto'}},
  ]}),

        {t: `Chiedile chi conosce il suo segreto`, q: 1, ok: {x: `Conta sulle dita guantate, con riluttanza. «Polly, la cameriera, che ha trovato le lettere di mia madre in soffitta, l'anno scorso. Mio genero Reginald, perché mia figlia non sa tenere la bocca chiusa a letto.» Esita. «E un impiegato della capitaneria, il signor Finch. Fu lui, trent'anni fa, a trascrivere i miei documenti di nozze. Per un piccolo compenso. Un uomo discreto.» Si stringe le mani. «Lo era.»`, clue: 'l_segreto'}},

    {id: 'polly', loc: 'collina', label: `Parla con Polly Dunn, la cameriera`, if: () => has('l_segreto'), scene: () => ({

        {t: `Mostrale una delle lettere anonime`, c: ['per', 4], p: 1, g: 'l_croce', ok: {x: `Polly guarda la lettera, la gira, la guarda di nuovo, con la fronte aggrottata. Poi arrossisce. «Non so leggere, signore. Firmo con la croce. Per me queste parole sono tutte uguali, come le formiche.» Ti restituisce il foglio con due dita. «Se volessi far male alla signora, le metterei il sale nel tè. Non perderei tempo con le forbici.»`, clue: 'l_croce'}, ko: {x: `«Non tocco niente che sia della signora, io.» Ti volta le spalle e ricomincia a stirare, con più forza di prima.`}},

        {t: `Guarda la sua scrivania mentre parla`, c: ['oss', 5], g: 'l_forbici', ok: {x: `Mentre Finch cerca un registro sullo scaffale più alto, i tuoi occhi corrono sulla scrivania. Sotto un libro mastro aperto, sporgono le lame di un paio di forbici da sarto, lunghe e affilate. E intorno, caduti a terra accanto alla sedia, piccoli ritagli di carta spessa e ingiallita, a righe, con frammenti di un'intestazione a stampa: «…ITANERIA DI PORTO…».`, clue: 'l_forbici'}, ko: {x: `Finch torna dallo scaffale prima che tu riesca a vedere qualcosa, e appoggia il gomito sulla scrivania come per caso, coprendo un libro mastro aperto.`}},
        {t: `Metti sul tavolo uno dei ritagli`, req: () => has('l_forbici') || has('l_cassetta'), g: 'l_motivo', ok: {x: `Finch guarda il ritaglio con l'intestazione della capitaneria come si guarda una lettera di condanna. Si toglie gli occhiali. «Trent'anni, ${tit()}. Trent'anni a tenere in ordine i registri del capitano Gaunt senza vedere niente. Il mese scorso mi ha licenziato: un mese di preavviso, nessuna pensione. Uomini più giovani, ha detto.» Le mani gli tremano. «Volevo solo i soldi per andarmene a Bath, da mia sorella. Lontano dal mare. Cinquanta sterline. Che cosa sono cinquanta sterline, per una che ha mentito per trent'anni?»`, clue: 'l_motivo'}},
        {t: `Chiedigli come vanno le cose in capitaneria`, c: ['per', 5], p: 1, g: 'l_motivo', ok: {x: `Finch ride, un suono secco come un ramo che si spezza. «Come vanno? Trent'anni, ${tit()}. Trent'anni a tenere in ordine i suoi registri, a non vedere niente, a non chiedere niente.» Abbassa la voce. «Il mese scorso il capitano Gaunt mi ha chiamato nel suo ufficio. Un mese di preavviso. Nessuna pensione. "Ci sono uomini più giovani", ha detto. Uomini più giovani che non sanno cosa c'è scritto nei registri vecchi.» Si interrompe. Ha detto troppo, e lo sa.`, clue: 'l_motivo'}, ko: {x: `«Come sempre, signore. Bene.» Finch abbassa la testa sul registro e intinge la penna nel calamaio, aspettando che te ne vada.`}},

    {id: 'cassetta', loc: 'capitaneria', notte: true, label: `Sorveglia la cassetta della capitaneria fino all'alba`, if: () => has('l_consegna'), scene: () => ({
      t: `La cassetta del Sig. Meridian`, x: `Ti nascondi nel portone di fronte alla capitaneria, con il bavero alzato e una busta vuota imbucata nella cassetta, all'attenzione del «Sig. Meridian». Le ore passano. Un ubriaco canta sotto la pioggia. L'orologio della facciata batte le quattro, le cinque. Il cielo diventa grigio come l'acqua sporca.`,
      ch: [{t: `Resisti al freddo e aspetta`, c: ['ner', 4], ok: {x: `Alle sei meno un quarto, prima ancora del portiere, una figura magra con l'ombrello si avvicina alla cassetta, si guarda intorno, la apre con una piccola chiave e infila la tua busta nella tasca del cappotto. Quando passa sotto il lampione, la luce brilla su due lenti spesse come fondi di bottiglia. Aldous Finch.`, clue: 'l_cassetta'}, ko: {x: `Ti svegli di soprassalto nel portone, con la schiena rigida e la luce del mattino in faccia. La cassetta è aperta, e vuota. La tua busta non c'è più.`}}]})},

  unproven: `Fai il nome di Finch, ma senza prove. Mrs. Ashby ti guarda con sospetto: un impiegato così mite, così discreto. Ti paga tre sterline per «il disturbo» e non ti riceve più. Le lettere, almeno, smettono di arrivare.`,

  m_cripta: ['main', `Padre Ambrose: uomini incappucciati si riuniscono nella cripta della vecchia St. Brendan, che si raggiunge solo con la bassa marea. Uno portava una borsa da medico.`],
  m_simboli: ['main', `La campana dentro l'onda è il segno della Marea Grigia, una setta di naufragatori: credevano che il mare restituisse i morti, se gli si pagava il conto. «Quaranta per quaranta.»`, 'odd'],

function mainDayEvents() {

    note(`Harrow ti manda un ragazzo con un biglietto scritto in fretta: Agnes Coyle è stata trovata morta nel suo letto, la porta chiusa a chiave dall'interno. Annegata. Le lenzuola sono asciutte (−1 sanità).`);
  }

  if (h >= 2 && !F('h1')) { S.flags.h1 = 1; S.pend.push('avvertimento'); }
  else if (h >= 4 && !F('h2')) { S.flags.h2 = 1; S.pend.push('perquisizione'); }
  else if (h >= 5 && !F('h3')) { S.flags.h3 = 1; witnessAttack(); }
  else if (h >= 6 && !F('h4') && S.day < TIDE) { S.flags.h4 = 1; S.pend.push('gaunt'); }
  if (MEETINGS.includes(S.day) && (has('m_tavola') || has('m_ufficio'))) note(`Stanotte è una delle notti segnate sulla tavola delle maree: la setta si riunirà nella cripta.`);

    if (!has('m_cripta') && S.rel.nell >= 1) { S.clues.push('m_cripta'); note(`Nell Quill ti infila un biglietto sotto la porta: «Ho seguito Gaunt. Scende nella cripta della vecchia St. Brendan, quella sulla spiaggia. Stanotte. Non andarci da solo.»`); }
  }
}
function witnessAttack() {
  if (has('e_ned') && !F('ned_safe') && !F('ned_fuga') && !F('ned_dead')) {
    S.flags.ned_dead = 1; S.san = clamp(S.san - 1, 0, S.maxSan);
    note(`Big Toller ti aspetta sulla porta dello studio, con il cappello in mano. Ned Garrow è stato trovato all'alba nel ripostiglio dell'Ancora, tra i barili, annegato. La porta era sprangata da dentro. «Non aveva neanche un capello bagnato», dice Toller (−1 sanità).`);
  } else if (F('ned_safe')) {

  } else if (F('davy_witness')) {
    note(`L'agente di guardia a casa Rourke ha messo in fuga due figure incappucciate che stavano provando la porta sul retro, alle tre di notte. Davy sta bene. Harrow ha raddoppiato la sorveglianza.`);

  }
}

      ch: [
        {t: `Chiedile della notte del Meridian`, q: 1, g: 'm_coyle', ok: {x: `Agnes guarda la gabbia del canarino. «Mio figlio Alfie era il mozzo più giovane, quattordici anni. Le sue lettere sono tutte lì.» Batte un dito sulla scatola. «La sera della partenza ero in cambusa. Ho visto salire a bordo all'ultimo momento due signori che non c'entravano niente con la nave: il giovane vice capitano di porto, quello con la barba rossa, e un dottore con gli occhiali d'oro. Sono scesi sulla lancia un'ora prima che affondassimo.» Tossisce a lungo. «Nessuno me l'ha mai chiesto, in nove anni.»`, clue: 'm_coyle'}},
        {t: `Spiegale tutto, senza addolcire niente`, ok: {x: `Ti ascolta fino alla fine, senza interromperti. Poi si alza, apre un cassetto e ti mette in mano una boccetta di vetro scuro. «Il dottor Wren me le porta ogni settimana. Gratis. Dice che noi del Meridian abbiamo diritto a dormire bene.» Sull'etichetta del dispensario del porto c'è scritto «Laudano – Dott. S. Wren». Agnes si mette lo scialle. «Ho una sorella a Whitby. Parto domattina, con la diligenza delle sei.» Prende la gabbia del canarino. «E questo viene con me.»`, clue: 'm_laudano', flag: 'coyle_safe', close: true}},
      ]})},
    {id: 'coylestanza', loc: 'porto', label: `Esamina la stanza di Agnes Coyle`, if: () => F('coyle_dead'), scene: () => ({
      t: `La stanza di Agnes Coyle`, x: `La stanza sopra la bottega di cordami è come doveva essere ieri: la tazza sbeccata sul tavolo, la scatola di lettere, il letto. Un letto asciutto, con una donna annegata dentro, che qualcuno ha già portato via. La gabbia del canarino è aperta e vuota.`,
      ch: [{t: `Esamina il comodino`, c: ['oss', 4], ok: {x: `Dietro il bicchiere vuoto, una boccetta di vetro scuro. L'etichetta del dispensario del porto dice «Laudano – Dott. S. Wren». Nel bicchiere, sul fondo, un residuo bruno e amaro. Agnes ha dormito profondamente, l'ultima notte. Non si è accorta di niente. O almeno, speri.`, clue: 'm_laudano'}, ko: {x: `Sul pavimento ci sono impronte bagnate che vanno dal letto al muro e lì finiscono. Esci senza guardare altro, e ti accorgi sulle scale che stai trattenendo il fiato.`, san: -1}}]})},
    {id: 'nell', loc: 'taverna', label: `Chiedi a Nell Quill del dottor Wren`, if: () => ['m_assicurazione', 'f_sindacato', 'e_borsa', 'm_laudano', 'm_hackett', 'f_davy', 'm_coyle'].some(has), scene: () => ({
      t: `Nell Quill`, talk: true, leave: `Lasciala al suo articolo`,
      x: `Nell Quill scrive in piedi al bancone dell'Ancora Annegata, il cappello di traverso, l'inchiostro sulle dita e una pinta di stout che si scalda accanto al gomito. Ha trent'anni, la voce roca e la reputazione di aver fatto dimettere due sindaci.\n\n«${tit()}.» Non alza gli occhi dal foglio. «Hai la faccia di chi ha una domanda che vale una colonna.»`,
      ch: [
        {t: `Chiedile un favore, tra amici`, need: () => S.rel.nell >= 1, why: `fiducia di Nell`, g: 'm_wren', ok: {x: `Nell posa la penna. «Silas Wren. Medico del dispensario del porto da dodici anni. Cura i poveri gratis, ha le mani più pulite di Saltmere, e firma i certificati di morte di tutto il porto da dieci anni.» Ti guarda. «Anche quello di Fenn${F('coyle_dead') ? ', e quello della Coyle' : ''}. "Annegamento accidentale", tutti. Ne ho contati trentasei, in nove anni. Trentasei annegati che il mare non ha restituito, e che lui ha visto lo stesso.»`, clue: 'm_wren'}},
        {t: `Offrile una storia in cambio`, c: ['per', 4], p: 1, g: 'm_wren', ok: {x: `Le racconti abbastanza da farle brillare gli occhi. «Wren firma i certificati di morte del porto, tutti, da dieci anni. Anche quello di Fenn. Ne ho contati trentasei, di "annegati accidentali" firmati da lui.» Si picchietta la matita sui denti. «Me la devi, quella storia. Tutta.»`, clue: 'm_wren', rel: {nell: 1}}, ko: {x: `«Torna quando hai qualcosa che valga almeno un trafiletto.» Riprende a scrivere.`}},
      ]})},
    {id: 'gaunt_uff', loc: 'capitaneria', label: `Presentati al capitano di porto Gaunt`, giorno: true, if: () => has('m_assicurazione') || has('f_gaunt') || has('f_sindacato') || has('f_manifesto'), scene: () => ({
      t: `L'ufficio del capitano di porto`, talk: true, leave: `Congedati`,
      x: `Mogano, ottone, carte nautiche incorniciate, un barometro che segna tempesta. Mortimer Gaunt ti riceve in piedi dietro la scrivania, massiccio, la barba rossa curata, l'uniforme con i bottoni lucidati a specchio. Ha la stretta di mano di un uomo abituato a decidere quanto deve durare.\n\n«L'investigatore di Lantern Row. Ho sentito parlare di lei.» Indica una sedia. «Il porto è il mio salotto, ${tit()}. Mi piace sapere chi ci gira.»`,
      ch: [
        {t: `Chiedigli del Meridian`, q: 1, ok: {x: `Gaunt non batte ciglio. «Una tragedia. Ero giovane, allora, vice capitano. Ho passato tre giorni sugli scogli a cercare superstiti.» Si liscia la barba. «Il mare dà e il mare prende, ${tit()}. Qui lo sanno anche i bambini. Chi lo dimentica, prima o poi ci finisce dentro.» Ti sorride. Non c'è niente in quel sorriso, nemmeno la minaccia.`, heat: 1}},
        {t: `Osserva il suo ufficio mentre parla`, c: ['oss', 6], g: 'm_ufficio', ok: {x: `Mentre Gaunt parla di maree e di bacini di carenaggio, i tuoi occhi fanno il giro della stanza. Sulla parete dietro di lui, tra le carte nautiche, c'è una tavola delle maree dell'anno. Tre notti sono cerchiate con l'inchiostro rosso: il 12, il 15, e la notte della grande marea d'equinozio. Accanto all'ultima, piccolissima, una campanella disegnata a matita.`, clue: 'm_ufficio'}, ko: {x: `Gaunt si accorge del tuo sguardo che vaga, e si sposta, con naturalezza, davanti alla parete. «Le piacciono le carte nautiche? Gliene regalerò una. Per ricordo.»`}},
        {t: `Chiedigli del dottor Wren`, q: 1, ok: {x: `«Silas?» Gaunt si illumina, quasi con affetto. «Il miglior uomo di Saltmere. Cura i poveri senza chiedere un penny, conforta le vedove, ricorda i morti.» Si appoggia allo schienale. «Lui crede in cose in cui io non credo, ${tit()}. Ma rispetto la fede. È rara, di questi tempi. E rende le persone molto… determinate.»`}},
      ]})},
    {id: 'harrow_prove', loc: 'polizia', label: `Porta le prove a Harrow`, if: () => proofs() >= NEED && has('m_cripta') && !F('harrow_ready') && S.day < TIDE, scene: () => ({
      t: `L'ufficio di Harrow`, talk: true, leave: `Esci`,
      x: `Spargi sul tavolo di Harrow tutto quello che hai: appunti, ritagli, nomi, date. Lui li guarda uno per uno senza toccarli, con la pipa spenta tra i denti, mentre fuori si fa buio.\n\n«Il capitano di porto e il medico dei poveri», dice alla fine. «Lei sa cosa mi succede se sbaglio, ${tit()}? Non mi licenziano. Mi trovano annegato nel mio letto.»`,
      ch: [
        {t: `Chiedigli di venire con te nella cripta`, need: () => S.rel.harrow >= 1 || S.rep >= 5 || S.bg === 'ispettore', why: `fiducia di Harrow o reputazione 5`, ok: {x: `Harrow si toglie la pipa di bocca e la posa sul tavolo, accanto alla foto girata verso il muro. Poi gira la foto. «Va bene. Due agenti, quelli di cui mi fido, cioè due. Lanterne schermate. Ci dica lei dove e quando.» Ti tende la mano. «E se va male, lei non mi ha mai conosciuto.»`, flag: 'harrow_ready', close: true}},
        {t: `Convincilo che è l'unico modo`, c: ['per', 6], p: 1, ok: {x: `Gli parli di Fenn, della Coyle, del canarino nella gabbia vuota. Di Pryce che si siede per terra come un bambino. Harrow ascolta, e alla fine annuisce piano, una volta sola. «Due agenti. Lanterne schermate. Ci dica lei dove e quando.»`, flag: 'harrow_ready', close: true}, ko: {x: `«Non basta.» Harrow raccoglie le tue carte e te le restituisce. «Non contro di loro. Mi porti qualcosa che un giudice non possa far sparire, e poi ne riparliamo.»`}},
      ]})},
    {id: 'cripta', loc: 'cripta', notte: true, label: `Scendi nella cripta con la bassa marea`, if: () => S.day < TIDE && !MEETINGS.includes(S.day), scene: () => ({
      t: `La cripta sommersa`, x: `Scendi tra i resti della vecchia chiesa con la lanterna schermata. Gli scalini sono coperti di alghe e di cozze che scricchiolano sotto le suole. L'acqua ti arriva alle caviglie, poi si ritira, poi torna, come se la cripta respirasse lentamente. L'aria sa di sale, di cera e di qualcosa di dolciastro.\n\nSulle pareti, alla luce tremante, una campana dentro un'onda. Incisa, dipinta, graffiata. Cento volte. Duecento.`,
      ch: [{t: `Spingiti fino all'altare`, c: ['ner', 5], ok: {x: `Dietro l'altare di pietra, sotto una tela incerata, c'è una cassa di legno sigillata con la pece. Dentro: tuniche di lana grigia piegate con cura, lunghe fino ai piedi. Una pompa gastrica da medico, di ottone e gomma, ancora umida di acqua salata. E una tavola delle maree dell'anno, con date scritte a mano: la notte della morte di Fenn, una croce accanto al nome Coyle, una piccola campana disegnata accanto alle notti del 12 e del 15. E accanto alla notte d'equinozio, in lettere maiuscole, un nome: PRYCE.\n\nMentre risali, senti la campana. Non viene dal mare. Viene da sotto i tuoi piedi.`, clue: ['m_pompa', 'm_tavola'], san: -1, heat: 1}, ko: {x: `A metà strada senti la campana, sotto i piedi, e l'acqua comincia a salire troppo in fretta, fredda, fino alle ginocchia. Nella luce della lanterna, per un istante, vedi decine di volti pallidi appena sotto la superficie, con gli occhi aperti, rivolti verso di te. Risali gli scalini a quattro zampe e corri sulla spiaggia fino a non avere più fiato.`, san: -2}}]})},
    {id: 'riunione', loc: 'cripta', notte: true, label: `Sorprendi la riunione della Marea Grigia`, if: () => MEETINGS.includes(S.day) && (has('m_tavola') || has('m_ufficio')), scene: () => ({
      t: `La riunione`, talk: true, leave: `Torna indietro senza farti vedere`,
      x: `Ti acquatti tra le pietre crollate in cima alla scala. Giù, nella cripta, una dozzina di candele galleggiano sull'acqua bassa su tavolette di sughero. Intorno all'altare, dieci figure in tunica grigia, con il cappuccio calato. Una di loro, più alta delle altre, legge da un libro a voce bassa e cantilenante. Quando alza la testa, la luce delle candele si riflette su due lenti d'oro.${harrowWith() && F('harrow_ready') ? `\n\nDietro di te, nel buio della spiaggia, Harrow e i suoi due agenti aspettano un tuo cenno.` : ''}`,
      ch: [
        {t: `Ascolta in silenzio quello che dicono`, c: ['ner', 5], g: 'm_rito', ok: {x: `Trattieni il fiato. La voce dell'uomo con gli occhiali sale dalla cripta chiara come in una chiesa. «Trentotto sono tornati al mare. Il conto si chiude. Alla marea d'equinozio, il trentanovesimo: Edmund Pryce.» Le figure rispondono in coro: «Quaranta per quaranta.» Poi un'altra voce, profonda, più pratica, che conosci: Gaunt. «E poi basta, Silas. Dopo Pryce, basta.» L'uomo con gli occhiali non risponde.`, clue: 'm_rito', heat: 1}, ko: {x: `Una pietra si stacca sotto il tuo ginocchio e rotola giù per la scala, rimbalzando, fino all'acqua. Tutte le teste incappucciate si voltano verso di te nello stesso istante. Corri. Senti passi bagnati dietro di te per tutta la spiaggia, e non ti volti fino a Lantern Row.`, san: -2, heat: 2, done: true}},
        {t: `Irrompi e accusali, prove alla mano`, need: () => proofs() >= NEED, why: `servono ${NEED} prove`, ...(harrowWith() ? {ok: {flag: 'early', end: 'nebbia'}} : {c: ['ner', 6], ok: {flag: 'early', end: 'nebbia'}, ko: {x: `Scendi gridando i loro nomi, ma sei solo, e le candele si spengono tutte insieme. Nel buio ti afferrano, ti spingono sott'acqua, una, due volte. Riesci a liberarti con un calcio e a trascinarti fuori. Quando arrivi in cima alla scala la cripta è vuota e silenziosa. Adesso sanno chi sei.`, san: -2, heat: 2, close: true}})},
      ]})},
    {id: 'marea', loc: 'cripta', label: `Scendi nella cripta: è la notte della marea`, if: () => S.day === TIDE && S.slot >= 2, scene: () => finale(false)},
  ],
};

function finale(skipOffer) {
  const hw = harrowWith(), p = proofs();
  const ch = [
    {t: `Accusali, prove alla mano`, tag: `${Math.min(p, NEED)}/${NEED} prove`, need: () => p >= NEED, why: `servono ${NEED} prove`,
      ...(hw ? {ok: {end: 'nebbia'}} : {c: ['ner', 6], ok: {end: 'nebbia'}, ko: {flag: 'wren_fuga', end: 'marea'}})},
    {t: `Taglia le corde di Pryce e trascinalo fuori`, c: ['ner', 5], ok: {end: 'marea'}, ko: {flag: 'pryce_morto', san: -2, end: 'marea'}},
  ];
  if (!skipOffer) ch.push({t: `Ascolta l'offerta di Gaunt`, ok: {next: offerta}});
  if (S.san <= 4) ch.push({t: `Ascolta la campana`, ok: {end: 'abisso'}});
  return {t: `La notte della marea`, x: `La marea sale in fretta, stanotte. Scendi gli ultimi scalini con l'acqua che ti arriva già alle ginocchia, nera e gelida. Le candele galleggiano su tavolette di sughero e girano piano, come in un ballo. Una dozzina di figure in grigio, immobili. Pryce è legato all'altare, in camicia da notte, la bocca forzata da un morso di cuoio, gli occhi spalancati.\n\nIl dottor Silas Wren, con gli occhiali d'oro che brillano sotto il cappuccio, sta riempiendo la pompa di ottone da un secchio di legno, con la calma di chi prepara una medicina. Mortimer Gaunt ti vede per primo, e non sembra sorpreso.\n\n«${tit()}.» ${F('bribed') ? `Sorride. «Le avevo pagato una notte a casa sua. Pazienza: i morti non restituiscono i soldi.» ` : ''}«Quaranta per quaranta. Il mare vuole che i conti si chiudano. Siamo quasi in pari.»\n\nSotto l'acqua, distinta, lenta, suona una campana.${hw ? `\n\nDietro di te, sugli scalini, l'ispettore Harrow e due agenti tolgono gli schermi alle lanterne.` : `\n\nSei venuto da solo.`}`, ch};
}
function offerta() {
  return {t: `L'offerta`, x: `Gaunt si avvicina nell'acqua, tranquillo, le mani dietro la schiena. Parla piano, perché lo senta solo tu. «Trecento sterline, ${tit()}. Sono più di quanto guadagnerà in dieci anni di mariti infedeli e ritratti che piangono. Domani lei lascia Saltmere, e il mare chiude il suo conto. Nessuno saprà niente. Nemmeno lei, tra un anno, ci penserà più.»`, ch: [
    {t: `Accetta`, ok: {money: 300, end: 'oro'}},
    {t: `Rifiuta`, ok: {next: () => finale(true)}},
  ]};
}

/* ---------- finali ---------- */
const ENDINGS = {
  nebbia: () => ({h: `La Nebbia si Alza`, x: `${F('early') ? `Non aspetti la marea. Scendi nella cripta mentre la setta è ancora intorno all'altare, e Pryce dorme nel suo letto dietro le finestre murate senza sapere niente.` : ''}${harrowWith() ? ` Harrow e i suoi agenti scendono nell'acqua alle tue spalle mentre tu elenchi le prove ad alta voce, una per una, come un rosario.` : ` Non hai Harrow alle spalle, solo le prove e la voce. Le elenchi una per una, come un rosario, finché le figure in grigio cominciano a guardarsi tra loro.`} Il primo a cedere non è Wren ma Gaunt: si toglie il cappuccio e alza le mani. «Basta, Silas», dice. «È finita.»\n\nAl processo, alle assise di Exeter, Gaunt confessa il Meridian. Quaranta morti per una polizza da trentamila sterline, e nove anni di buste per comprare il silenzio. Wren non dice una parola in tre giorni di udienze. Sorride soltanto, a volte, quando dalla finestra dell'aula si sente il mare. Il giudice lo condanna all'impiccagione.\n\n${F('pryce_morto') ? '' : `Pryce testimonia piangendo${F('ned_dead') ? '' : F('ned_safe') ? `, e accanto a lui Ned Garrow, vivo, pallido, finalmente creduto` : ''}${F('davy_witness') ? `. Davy Rourke racconta quello che ha visto con la voce che non trema, e Maggie, in fondo all'aula, non smette di guardarlo` : ''}.`}\n\nLa Gazette ti chiama «la persona più ostinata di Saltmere». Nell Quill firma l'articolo. La signora Pell lo ritaglia e lo incornicia, e lo appende in merceria accanto alla foto di suo fratello Thomas.`,
    coda: `La notte dell'esecuzione di Wren, la marea è stranamente alta. Rientri a Lantern Row e trovi sul pavimento dello studio una fila di impronte bagnate. Entrano dalla porta. Si fermano davanti al tuo scrittoio, come chi aspetta di ringraziare. Non escono.`}),
  marea: () => ({h: `Marea Calante`, x: F('pryce_morto') ? `L'acqua sale troppo in fretta. Tagli la prima corda, la seconda ti scivola dalle dita intorpidite dal freddo, e quando finalmente riemergi con Pryce tra le braccia lui non respira più. Le figure in grigio sono sparite nella nebbia come se non fossero mai esistite.\n\nIl coroner scrive «annegamento accidentale». Harrow firma senza guardarti. Il certificato porta, in calce, la firma ordinata del dottor Silas Wren.` : `Trascini Pryce su per gli scalini mentre l'acqua invade la cripta e spegne le candele una dopo l'altra. Dietro di te, nel buio, nessuno ti insegue.${F('wren_fuga') ? ` Wren si getta nell'acqua nera della cripta, il cappuccio che si gonfia come una vela, e non riemerge.` : ''}\n\nPryce vive. Lascia Saltmere una settimana dopo, per Londra, e non tornerà mai. Gaunt si dimette per motivi di salute e si ritira in una villa nel Devon. ${F('wren_fuga') ? `Il corpo di Wren non viene mai trovato.` : `Wren continua a curare i poveri al dispensario del porto, gratis, e ti saluta togliendosi il cappello quando vi incrociate sul molo.`} Non ci sono prove sufficienti per un processo.`,
    coda: `Ogni notte di marea alta, dalla finestra di Lantern Row, senti suonare una campana al largo di Gull Point. Hai contato i rintocchi, una volta. Erano trentanove.`}),
  oro: () => ({h: `L'Oro del Sindacato`, x: `Risali gli scalini con trecento sterline nel cappotto, il peso che ti tira giù una spalla. Dietro di te l'acqua copre l'altare, e qualcuno, sotto il morso di cuoio, smette di gridare. Non ti volti.\n\nLasci Saltmere il giorno dopo, con la diligenza delle sei. Apri uno studio a Londra, poi un altro a Manchester, con una targa d'ottone più grande. Gli affari vanno bene. Leggi sul Times, mesi dopo, che l'assessore Pryce di Saltmere è stato trovato annegato nel suo letto, con le finestre murate, asciutto. Nessuno ti chiede niente.`,
    coda: `Dovunque tu vada, l'acqua dei rubinetti sa di sale. I medici dicono che è suggestione. Tu dormi con la luce accesa e un catino vuoto accanto al letto, rovesciato, per sicurezza.`}),
  abisso: () => ({h: `Quaranta per Quaranta`, x: `La campana suona sotto l'acqua, e finalmente capisci le parole. Non è un richiamo, è un conteggio. Lo hai sempre saputo. Trentotto. Trentanove.\n\nPosi la lanterna su un gradino. Wren ti guarda da sotto il cappuccio con qualcosa di molto simile alla pietà, e annuisce. Scendi i gradini dell'altare, nell'acqua che sale, e il freddo è meno freddo di quanto pensavi. È quasi una casa.`,
    coda: `Il mattino dopo Pryce viene trovato vivo sull'altare, slegato, in una cripta vuota. Della persona che indagava sugli annegati asciutti restano solo un cappotto piegato con cura sull'ultimo gradino e, sulla pietra, una fila di impronte bagnate che scende nell'acqua. Quaranta.`}),
  dinfna: () => ({h: `Il Ricovero di Santa Dinfna`, x: `Hai smesso di dormire, poi di mangiare, poi di distinguere la pioggia sui vetri dalla voce che ti chiama per nome. La signora Pell ti trova all'alba nello studio, con la finestra spalancata sulla nebbia, a contare le onde ad alta voce.\n\nIl ricovero di Santa Dinfna, sulla strada per Exeter, ha stanze bianche, infermiere gentili e un giardino con un muro alto, da cui non si vede il mare. Ti lasciano tenere il taccuino. Ci scrivi sempre la stessa cosa, una riga sotto l'altra, fino al fondo della pagina.`,
    coda: `Le infermiere dicono che di notte, nella tua stanza, il pavimento è sempre bagnato.`}),
  tardi: () => ({h: `Troppo Tardi`, x: `La notte d'equinozio passa senza che tu sappia dove guardare. La marea sale e scende sotto la luna, e tu sei dall'altra parte della città, o a letto, o a cercare nel posto sbagliato. All'alba, Harrow bussa alla tua porta, con il cappello in mano.\n\nL'assessore Pryce è stato trovato annegato nella sua biblioteca senza finestre, con il revolver ancora carico sul tavolino. Asciutto.\n\n«Il coroner scriverà "accidentale"», dice Harrow. «E stavolta firmo.» Si rimette il cappello. «Non ho più niente per non farlo.»`,
    coda: `Al largo di Gull Point, quella notte, i pescatori hanno sentito la campana del Meridian suonare a lungo, come una festa. Poi più niente. Da allora, dicono, il mare di Saltmere ha ricominciato a restituire i suoi morti.`}),
};

/* =====================================================================
   MOTORE DI GIOCO — Le Nebbie di Saltmere v2
   I contenuti (casi, scene, testi) stanno nei file content_*.js.
   ===================================================================== */
const SAVE_VERSION = 2;
const SLOTS = ['Mattina', 'Pomeriggio', 'Sera', 'Notte'];
const STATN = {oss: 'Osservazione', per: 'Persuasione', ner: 'Sangue freddo'};

let S = null;
const UI = {tab: 'citta', loc: null, scene: null, cur: null, ded: null, creating: null, confirm: null,
  howto: false, exported: null, impText: '', impErr: '', newClues: []};

const $ = s => document.querySelector(s);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const has = c => S.clues.includes(c);
const F = f => !!S.flags[f];
const act = id => S.cases[id] && S.cases[id].st === 'attivo';
const solved = id => S.cases[id] && S.cases[id].st === 'risolto' && S.cases[id].culprit;
const surname = () => S.name.trim().split(/\s+/).slice(-1)[0];
const tit = () => S.tit + ' ' + surname();
const night = () => S.slot === 3;
const ESC = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const val = v => typeof v === 'function' ? v() : v;

/* ---------- salvataggi ---------- */
const OLD_KEY = 'saltmere_v1';
const SK = n => 'saltmere_slot_' + n;
function save() { if (!S) return; try { localStorage.setItem(SK(S.saveSlot || 1), JSON.stringify(S)); } catch (e) {} }
function loadSlot(n) { try { const r = localStorage.getItem(SK(n)); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function delSlot(n) { try { localStorage.removeItem(SK(n)); } catch (e) {} }
(function migrate() { try { const o = localStorage.getItem(OLD_KEY); if (o && !localStorage.getItem(SK(1))) { const v = JSON.parse(o); v.saveSlot = 1; localStorage.setItem(SK(1), JSON.stringify(v)); } localStorage.removeItem(OLD_KEY); } catch (e) {} })();
const CODE_PREFIX = 'SALTMERE2:';
function encodeSave(v) { return CODE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(v)))); }
function decodeSave(c) {
  c = (c || '').trim().replace(/\s+/g, '');
  if (c.startsWith('SALTMERE1:')) throw 'old';
  if (!c.startsWith(CODE_PREFIX)) throw 0;
  const v = JSON.parse(decodeURIComponent(escape(atob(c.slice(CODE_PREFIX.length)))));
  if (!v || !v.name || !v.day || !v.stats || v.v !== SAVE_VERSION) throw 0;
  return v;
}
const compatible = v => v && v.v === SAVE_VERSION;

/* ---------- feedback ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800); }
function note(t) { S.notes.push(t); }
function addClue(c) { if (!CL[c]) { console.warn('indizio sconosciuto', c); return; } if (!has(c)) { S.clues.push(c); UI.newClues.push(c); } }

function apply(o) {
  if (!o) return;
  if (o.clue) [].concat(o.clue).forEach(addClue);
  if (o.san) S.san = clamp(S.san + o.san, 0, S.maxSan);
  if (o.rep) S.rep = clamp(S.rep + o.rep, 0, 10);
  if (o.money) S.money = Math.max(0, S.money + o.money);
  if (o.rel) for (const k in o.rel) S.rel[k] = clamp((S.rel[k] || 0) + o.rel[k], -3, 4);
  if (o.flag) [].concat(o.flag).forEach(f => S.flags[f] = 1);
  if (o.heat) S.heat = Math.max(0, (S.heat || 0) + o.heat);
  if (o.fn) o.fn();
}
function roll(stat, diff) {
  const d = 1 + Math.floor(Math.random() * 6), v = S.stats[stat], m = S.san <= 3 ? -1 : 0, tot = v + d + m;
  return {ok: tot >= diff, txt: `${STATN[stat]} ${v} + dado ${d}${m ? ' − 1 nervi scossi' : ''} = ${tot} su ${diff} · ${tot >= diff ? 'riuscito' : 'fallito'}`};
}

/* ---------- tempo ---------- */
function advance(n) {
  for (let i = 0; i < n; i++) {
    S.slot++;
    if (S.slot > 3) { S.slot = 0; S.day++; note(`Hai passato la notte fuori e rientri all'alba, con le ossa fredde e gli occhi che bruciano. Non hai riposato.`); dayStart(); }
  }
}
function sleep() { S.day++; S.slot = 0; S.san = clamp(S.san + 1, 0, S.maxSan); dayStart(); }
function dayStart() {
  if (S.day % 7 === 1 && S.day > 1) {
    if (S.money >= 6) { S.money -= 6; note(`La signora Pell bussa con discrezione: sono 6 sterline per la settimana. Le conta due volte, le infila nel grembiule e ti lascia sulla soglia una fetta di torta di mele.`); }
    else { S.rep = clamp(S.rep - 1, 0, 10); S.rel.pell--; S.san = clamp(S.san - 1, 0, S.maxSan); note(`Non hai le 6 sterline dell'affitto. La signora Pell non dice nulla, ma entro sera lo sa mezza Lantern Row (−1 reputazione, −1 sanità).`); }
  }
  for (const id in S.cases) {
    const c = S.cases[id];
    if (c.st === 'attivo' && S.day > c.due) { c.st = 'fallito'; S.rep = clamp(S.rep - 1, 0, 10); note(`${CASES[id].client} ha smesso di aspettarti. «${CASES[id].title}» resterà senza risposta, e a Saltmere le porte chiuse si ricordano (−1 reputazione).`); }
    if (c.st === 'offerto' && c.exp && S.day > c.exp) { c.st = 'perso'; }
  }
  // nuove lettere a ondate
  if (LETTER_DAYS.includes(S.day)) deliverLetter();
  const open = Object.values(S.cases).filter(c => c.st === 'offerto' || c.st === 'attivo').length;
  if (open === 0 && S.day < TIDE - 2) deliverLetter();
  // incarichi
  JOBS.forEach(j => { if (j.from === S.day && j.loc === 'porto') note(`Sulla bacheca del Porto Vecchio è comparso un nuovo avviso.`); });
  mainDayEvents();
}
function deliverLetter() {
  const n = S.pool.find(id => !S.cases[id]);
  if (n) { S.cases[n] = {st: 'offerto', exp: S.day + 3}; note(`Sotto la porta dello studio c'è una lettera nuova. La puoi leggere allo scrittoio.`); }
}
function solvedCount() { return Object.values(S.cases).filter(c => c.st === 'risolto').length; }
function afterAction() {
  if (S.ending) return;
  if (S.san <= 0) { S.ending = 'dinfna'; return; }
  if (!S.main && ((solvedCount() >= 1 && S.day >= 4) || S.day >= 6)) { S.main = 'attivo'; S.pend.push('mainIntro'); }
  if (S.main === 'attivo' && S.day > TIDE) S.ending = 'tardi';
}

/* ---------- azioni e scelte ---------- */
function allActions() {
  const list = [];
  GENERIC.forEach(a => list.push({...a, key: 'g.' + a.id}));
  JOBS.forEach(a => list.push({...a, key: 'job.' + a.id, job: true}));
  for (const id in S.cases) if (S.cases[id].st === 'attivo') CASES[id].actions.forEach(a => list.push({...a, key: id + '.' + a.id, caseId: id}));
  if (S.main === 'attivo') MAIN.actions.forEach(a => list.push({...a, key: 'main.' + a.id, caseId: 'main'}));
  for (const id in S.cases) if (S.cases[id].st === 'attivo') list.push({id: 'ded', loc: 'studio', key: 'ded.' + id, caseId: id, ded: id, time: 0, rep: true,
    label: `Ricostruisci il caso: ${CASES[id].title}`, scene: () => ({t: '', x: '', ch: [{t: ''}]})});
  return list;
}
function buildScene(fn, key) { const sc = fn(); sc.key = key; sc.ch = (sc.ch || []).slice(); return sc; }
function ckey(sc, i) { return sc.key + '#' + i; }
function choiceState(sc, c, i, repeatable) {
  const k = ckey(sc, i);
  if (c.leave) return 'ok';
  if (!repeatable && S.used[k]) return 'hidden';
  if (repeatable && UI.vused && UI.vused[k]) return 'hidden';
  if (c.req && !c.req()) return 'hidden';
  if (c.g && [].concat(c.g).every(has)) return 'hidden';
  const f = S.fails[k];
  if (f && c.p && f.n >= 2) return 'perm';
  if (f && f.day === S.day) return 'cool';
  if (c.need && !c.need()) return 'locked';
  if (c.cost && S.money < c.cost) return 'poor';
  return 'ok';
}
function actionStatus(a) {
  if (a.if && !a.if()) return 'hidden';
  if (a.notte && !night()) return 'night';
  if (a.giorno && night()) return 'day';
  if (a.cost && S.money < a.cost) return 'poor';
  if (a.ded) return CASES[a.ded].accuse.suspects.some(s => !s.met || s.met()) ? 'ok' : 'hidden';
  if (!a.rep && S.done[a.key]) return 'hidden';
  const sc = buildScene(a.scene, a.key);
  const st = sc.ch.map((c, i) => c.leave ? 'hidden' : choiceState(sc, c, i, a.rep)).filter(s => s !== 'hidden' && s !== 'perm');
  if (!st.length) return 'hidden';
  if (st.some(s => s === 'ok' || s === 'locked' || s === 'poor')) return 'ok';
  return 'cool';
}
function actionsAt(loc) {
  return allActions().filter(a => a.loc === loc).map(a => ({a, st: actionStatus(a)}))
    .filter(x => x.st !== 'hidden' && !(x.st === 'night' && x.a.hideDay));
}

function startAction(a) {
  const st = actionStatus(a);
  if (st !== 'ok') return;
  if (a.ded) { UI.ded = {id: a.ded, sus: null, how: null, why: null}; render(); return; }
  if (a.cost) S.money -= a.cost;
  UI.cur = {a, key: a.key, night: night(), time: a.time === 0 ? 0 : 1};
  UI.vused = {};
  UI.newClues = [];
  showScene(a.scene, a.key);
}
function showScene(fn, key, extra) {
  const sc = buildScene(fn, key);
  if (sc.talk) sc.ch.push({t: sc.leave || 'Congedati', leave: true});
  sc.fn = fn;
  UI.scene = Object.assign(sc, extra || {});
  render();
}
function repeatableCur() { return UI.cur && UI.cur.a && UI.cur.a.rep; }

function choose(i) {
  const sc = UI.scene, c = sc.ch[i];
  if (!c) return;
  if (c.leave) { closeVisit(); return; }
  if (choiceState(sc, c, i, repeatableCur()) !== 'ok') return;
  UI.newClues = [];
  if (c.cost) S.money -= c.cost;
  let out, rt = null, ok = true;
  const k = ckey(sc, i);
  if (c.c) { const r = roll(c.c[0], c.c[1]); rt = r.txt; ok = r.ok; out = r.ok ? c.ok : c.ko; } else out = c.ok;
  out = out || {};
  if (ok || out.done) { if (!repeatableCur()) S.used[k] = 1; else UI.vused[k] = 1; }
  if (!ok) { const f = S.fails[k] || {n: 0}; S.fails[k] = {n: f.n + 1, day: S.day}; }
  apply(out);
  if (out.close && UI.cur && UI.cur.key) S.done[UI.cur.key] = 1;
  const x = val(out.x) || '';
  if (out.end) { S.ending = out.end; UI.scene = null; UI.cur = null; save(); render(); return; }
  if (S.ending) { UI.scene = null; UI.cur = null; save(); render(); return; }
  const extra = {pre: x, roll: rt, rollOk: ok, fresh: UI.newClues.slice()};
  if (!ok && c.p && S.fails[k].n >= 2) extra.lost = true;
  if (!ok && !extra.lost) extra.cool = true;
  if (out.next) { const nf = out.next; showScene(nf, sc.key + '>' + i, extra); save(); return; }
  if ((c.q || out.back || sc.talk) && !out.close) {
    const again = buildScene(sc.fn, sc.key);
    const left = again.ch.some((cc, j) => choiceState(again, cc, j, repeatableCur()) === 'ok' || choiceState(again, cc, j, repeatableCur()) === 'locked');
    if (left) { showScene(sc.fn, sc.key, extra); save(); return; }
  }
  UI.scene = {t: sc.t, x: '', ch: [], key: sc.key, end: true, ...extra};
  save(); render();
}
function closeVisit() {
  const cur = UI.cur; UI.scene = null; UI.newClues = []; UI.vused = {};
  if (cur && !cur.pend) {
    if (cur.time) advance(cur.time);
    if (cur.night && UI.loc !== 'studio' && !S.ending && Math.random() < .3) {
      UI.cur = {pend: true, key: 'night.' + S.day + '.' + S.slot};
      afterAction();
      const ev = rnd(NIGHT_EVENTS);
      showScene(() => ev, UI.cur.key); save(); return;
    }
  }
  UI.cur = null;
  afterAction(); save(); render();
}

/* ---------- accusa ---------- */
function caseClues(id) { return S.clues.filter(k => CL[k][0] === id); }
function submitAccuse() {
  const id = UI.ded.id, C = CASES[id], A = C.accuse;
  const sus = A.suspects.find(s => s.id === UI.ded.sus);
  const how = A.how.ok.includes(UI.ded.how), why = A.why.ok.includes(UI.ded.why);
  const culprit = !!sus.culprit, proofs = (how ? 1 : 0) + (why ? 1 : 0);
  const c = S.cases[id];
  c.st = 'risolto'; c.culprit = culprit; c.proofs = proofs;
  let pre, fin;
  UI.newClues = [];
  if (culprit && proofs === 2) { S.money += C.fee; S.rep = clamp(S.rep + 1, 0, 10); pre = `Ogni tassello va al suo posto, e nessuno nella stanza può fingere il contrario. ${C.client} ti paga £${C.fee} senza contrattare (+1 reputazione).`; }
  else if (culprit && proofs === 1) { const f = Math.round(C.fee * .6); S.money += f; pre = `Hai visto giusto, ma una parte della tua ricostruzione si regge su un'intuizione più che su una prova. Basta, a stento. ${C.client} ti paga £${f}.`; }
  else if (culprit) { S.money += 3; pre = val(C.unproven); }
  else { S.money += 3; S.rep = clamp(S.rep - 1, 0, 10); pre = val(sus.wrong); if (sus.eff) apply(sus.eff); }
  if (culprit && proofs >= 1) { addClue(C.frag); pre += '\n\n' + val(C.fragX); fin = C.finale(); }
  else fin = {t: C.title, x: '', ch: []};
  UI.ded = null;
  UI.cur = {key: 'ded.' + id, time: 1, night: false};
  if (fin.rel) apply({rel: fin.rel});
  showScene(() => fin, 'fin.' + id, {pre, fresh: UI.newClues.slice()});
  save();
}

/* ---------- attesa ---------- */
function waitUntil(cond, max) {
  let n = 0;
  while (n < max && !S.ending) { sleep(); n++; afterAction(); if (S.pend.length || cond()) break; }
  return n;
}

/* ---------- RENDER ---------- */
function para(t) { return String(t || '').split('\n\n').filter(Boolean).map(p => `<p>${p}</p>`).join(''); }
function statusBar() {
  const pips = (n, max, cls = '') => Array.from({length: max}, (_, i) => `<span class="pip ${cls} ${i < n ? 'on' : ''}"></span>`).join('');
  return `<div class="bar"><div class="bar-row"><div class="when">Giorno ${S.day}<small>${SLOTS[S.slot]}</small></div><div class="bar-right"><div class="purse">£ ${S.money}</div>${!UI.scene && !UI.ded ? '<button class="menu" data-menu>Menu</button>' : ''}</div></div>
  <div class="meters"><div class="meter ${S.san <= 3 ? 'low' : ''}" title="Sanità ${S.san} su ${S.maxSan}">Sanità <span class="pips">${pips(S.san, S.maxSan)}</span></div>
  <div class="meter" title="Reputazione ${S.rep} su 10">Reputazione <span class="pips">${pips(S.rep, 10, 'rep')}</span></div></div>
  ${S.main === 'attivo' ? `<div class="tide">Marea d'equinozio: ${S.day < TIDE ? `tra ${TIDE - S.day} ${TIDE - S.day === 1 ? 'giorno' : 'giorni'}` : 'stanotte'}</div>` : ''}</div>`;
}
function render() {
  const app = $('#app');
  if (!S) { app.innerHTML = UI.confirm ? confirmView() : UI.howto ? howtoView(true) : UI.creating ? createView() : titleView(); bindTitle(); window.scrollTo(0, 0); return; }
  if (S.ending) { app.innerHTML = endingView(); window.scrollTo(0, 0); return; }
  if (!UI.scene && !UI.ded && S.pend.length) {
    const k = S.pend.shift(); UI.cur = {pend: true, key: 'pend.' + k}; UI.newClues = [];
    showScene(PEND[k], 'pend.' + k); save(); return;
  }
  let body = '';
  if (UI.scene) body = sceneView(UI.scene);
  else if (UI.ded) body = dedView();
  else {
    const tabs = [['citta', 'Città'], ['casi', 'Casi'], ['taccuino', 'Taccuino'], ['guida', 'Guida']];
    body = `<div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button class="tab" role="tab" aria-selected="${UI.tab === k}" data-tab="${k}">${n}</button>`).join('')}</div>` +
      (UI.tab === 'citta' ? (UI.loc ? locView(UI.loc) : mapView()) : UI.tab === 'casi' ? casesView() : UI.tab === 'guida' ? howtoView(false) : notebookView());
  }
  app.innerHTML = statusBar() + body;
  window.scrollTo(0, 0);
}

function visibleLocs() { return Object.keys(LOCS).filter(k => !LOCS[k].c || LOCS[k].c()); }
function caseName(id) { return id === 'main' ? MAIN.title : CASES[id] ? CASES[id].title : ''; }
function mapView() {
  const notes = S.notes.length ? `<div class="notes">${S.notes.map(n => `<p>${n}</p>`).join('')}<button class="btn ghost" data-clear>Ho letto</button></div>` : '';
  return notes + `<div class="locs">${visibleLocs().map(k => {
    const acts = actionsAt(k).filter(x => x.st === 'ok');
    const dots = acts.filter(x => x.a.caseId || x.a.job).map(x => `<span class="dot ${x.a.caseId === 'main' ? 'main' : x.a.job ? 'job' : ''}"></span>`).slice(0, 6).join('');
    return `<button class="loc" data-loc="${k}"><div class="loc-h"><span class="loc-n">${LOCS[k].n}</span><span class="dots">${dots}</span></div><div class="loc-d">${val(LOCS[k].d)}</div></button>`;
  }).join('')}</div>`;
}
function locView(k) {
  const acts = actionsAt(k);
  const tagFor = ({a, st}) => st === 'night' ? 'solo di notte' : st === 'day' ? 'solo di giorno' : st === 'poor' ? `servono £${a.cost}` : st === 'cool' ? 'riprova domani' :
    [a.tag, a.cost ? `£${a.cost}` : '', a.time === 0 ? '' : '1 fascia'].filter(Boolean).join(' · ');
  return `<button class="back" data-back>← Torna alla città</button><div class="loc-head"><h2>${LOCS[k].n}</h2><p>${val(LOCS[k].long || LOCS[k].d)}</p></div>
  <div class="acts">${acts.length ? acts.map((x, i) => `<button class="act" data-act="${i}" ${x.st !== 'ok' ? 'disabled' : ''}><span class="lbl">${x.a.caseId ? `<span class="case ${x.a.caseId === 'main' ? 'main' : ''}">${caseName(x.a.caseId)}</span>` : x.a.job ? '<span class="case job">Incarico</span>' : ''}${val(x.a.label)}</span><span class="tag">${tagFor(x)}</span></button>`).join('') : `<p class="muted">Non c'è niente da fare qui, per ora.</p>`}</div>`;
}
function sceneView(sc) {
  const vis = !UI.cur?.pend && !sc.end && S.san <= 4 && Math.random() < .5 ? `<p class="vision">${rnd(VISIONS)}</p>` : '';
  const rep = repeatableCur();
  const fresh = (sc.fresh || []).map(k => `<p class="annot-c ${CL[k][0] === 'frag' || CL[k][2] === 'frag' ? 'frag' : ''}">${CL[k][1]}</p>`).join('');
  const where = UI.cur && UI.cur.a ? (UI.cur.a.caseId ? caseName(UI.cur.a.caseId) : UI.cur.a.job ? 'Incarico' : LOCS[UI.cur.a.loc] ? LOCS[UI.cur.a.loc].n : 'Saltmere') : 'Saltmere';
  const cool = sc.lost ? `<p class="hint">Questa strada ora è chiusa: non ti darà una seconda occasione.</p>` : sc.cool ? `<p class="hint">Potrai ritentare questo approccio da domani.</p>` : '';
  const list = sc.end ? `<button class="btn" data-close>Continua</button>` :
    sc.ch.map((c, i) => {
      const st = choiceState(sc, c, i, rep);
      if (st === 'hidden') return '';
      const dis = st !== 'ok';
      const tag = st === 'cool' ? 'riprova domani' : st === 'perm' ? 'non ti ascolterà più' : st === 'locked' ? c.why : st === 'poor' ? `servono £${c.cost}` :
        [c.tag, c.c ? `${STATN[c.c[0]]} ${c.c[1]}` : '', c.cost ? `£${c.cost}` : ''].filter(Boolean).join(' · ');
      return `<button class="choice ${c.leave ? 'leave' : ''}" data-ch="${i}" ${dis ? 'disabled' : ''}><span>${val(c.t)}</span><span class="tag">${tag || ''}</span></button>`;
    }).join('') || `<button class="btn" data-close>Continua</button>`;
  return `<div class="scene"><div class="eyebrow">${where}</div>${sc.t ? `<h2>${val(sc.t)}</h2>` : ''}
  ${sc.roll ? `<div class="roll ${sc.rollOk ? 'ok' : 'ko'}">${sc.roll}</div>` : ''}
  ${sc.pre ? `<div class="pre-out">${para(sc.pre)}</div>` : ''}${fresh ? `<div class="annot"><div class="eyebrow">Annotato nel taccuino</div>${fresh}</div>` : ''}${cool}
  ${sc.pre && sc.x && !sc.end ? '<div class="sep"></div>' : ''}${!sc.end ? `<div class="${sc.pre ? 'pre' : ''}">${para(val(sc.x))}</div>` : ''}${vis}
  <div class="choices">${list}</div></div>`;
}

function casesView() {
  let h = '';
  if (S.main) {
    const p = proofs();
    h += `<div class="casecard main"><div class="eyebrow" style="color:var(--rust)">Il caso della città</div><h3>${MAIN.title}</h3><div class="meta">Scadenza: notte del giorno ${TIDE}</div><p>${mainSummary()}</p><p class="mono-s">Prove per un'accusa: ${Math.min(p, NEED)} su ${NEED}${harrowWith() ? ' · Harrow è dalla tua parte' : ''}</p></div>`;
  }
  const ids = Object.keys(S.cases);
  ids.forEach(id => {
    const c = S.cases[id], d = CASES[id];
    const st = {offerto: `Lettera in attesa allo studio · scade a fine giorno ${c.exp}`, attivo: `Aperto · scade a fine giorno ${c.due}`, risolto: 'Chiuso', fallito: 'Abbandonato', perso: 'Lettera ignorata'}[c.st];
    h += `<div class="casecard"><h3>${d.title}</h3><div class="meta">${d.client} · ${st}</div>${c.st === 'attivo' ? `<p>Indizi raccolti: ${caseClues(id).length}. Quando ti senti pronto, formula l'accusa dallo studio.</p>` : ''}${c.st === 'risolto' ? `<p>${!c.culprit ? 'Hai accusato la persona sbagliata.' : c.proofs === 2 ? 'Soluzione impeccabile.' : c.proofs === 1 ? 'Soluzione giusta, ma provata a metà.' : 'Avevi ragione, ma non hai potuto provarlo.'}</p>` : ''}</div>`;
  });
  const jobs = JOBS.filter(j => S.done['job.' + j.id]).length;
  if (jobs) h += `<p class="muted">Incarichi completati: ${jobs}</p>`;
  if (!ids.length && !S.main) h = `<p>Nessun caso, per ora.</p>`;
  return h;
}
function attitude(v) { return v <= -2 ? ['Ostile', 'bad'] : v < 0 ? ['Diffidente', 'bad'] : v === 0 ? ['Neutrale', ''] : v < 2 ? ['Cordiale', 'good'] : ['Alleato', 'good']; }
function notebookView() {
  const groups = {};
  S.clues.forEach(c => { const g = CL[c][0] === 'frag' ? 'main' : CL[c][0]; (groups[g] = groups[g] || []).push(c); });
  let h = `<div class="sec"><div class="eyebrow">${BGS[S.bg].n}</div><h3>${ESC(S.tit)} ${ESC(S.name)}</h3>${Object.keys(STATN).map(k => `<div class="stat"><span>${STATN[k]}</span><span>${S.stats[k]}</span></div>`).join('')}<div class="stat"><span>Sanità</span><span>${S.san} / ${S.maxSan}</span></div><div class="stat"><span>Reputazione</span><span>${S.rep} / 10</span></div></div>`;
  h += `<div class="sec"><h3>Persone</h3><div class="people">${Object.keys(PEOPLE).map(k => { const [a, c] = attitude(S.rel[k] || 0); return `<div class="person"><span><b>${PEOPLE[k][0]}</b>, ${PEOPLE[k][1]}</span><span class="att ${c}">${a}</span></div>`; }).join('')}</div></div>`;
  ['main', ...Object.keys(S.cases), 'job'].forEach(g => { if (!groups[g]) return; h += `<div class="sec"><h3>${g === 'job' ? 'Altro' : caseName(g)}</h3>${groups[g].map(c => `<p class="clue ${CL[c][0] === 'frag' ? 'frag' : ''} ${CL[c][2] === 'odd' ? 'odd' : ''}">${CL[c][1]}</p>`).join('')}</div>`; });
  if (!S.clues.length) h += `<p class="muted">Il taccuino è ancora vuoto.</p>`;
  return h;
}
function dedView() {
  const id = UI.ded.id, C = CASES[id], A = C.accuse, d = UI.ded;
  const sus = A.suspects.filter(s => !s.met || s.met()).slice().sort((a, b) => a.n.localeCompare(b.n));
  const clues = caseClues(id);
  const pick = (field, q) => `<div class="q"><h3>${q}</h3>${clues.map(k => `<button class="opt" data-pick="${field}" data-v="${k}" aria-pressed="${d[field] === k}">${CL[k][1]}</button>`).join('')}<button class="opt muted-opt" data-pick="${field}" data-v="none" aria-pressed="${d[field] === 'none'}">Non ho una prova per questo</button></div>`;
  return `<div class="scene"><div class="eyebrow">Studio · l'accusa</div><h2>${C.title}</h2><p class="pre">Il taccuino aperto sullo scrittoio, la lampada abbassata. Scegli chi accusare e, per ogni punto, la prova del taccuino che lo dimostra. Formulare l'accusa richiede una fascia del giorno e chiude il caso.</p>
  <div class="q"><h3>${A.who}</h3>${sus.map(s => `<button class="opt" data-pick="sus" data-v="${s.id}" aria-pressed="${d.sus === s.id}">${s.n}</button>`).join('')}</div>
  ${pick('how', A.how.q)}${pick('why', A.why.q)}
  <div class="row"><button class="btn" id="dsub" ${d.sus && d.how && d.why ? '' : 'disabled'}>Formula l'accusa</button><button class="btn ghost" id="dback">Non ancora</button></div></div>`;
}
function endingView() {
  const e = ENDINGS[S.ending]();
  const epi = Object.keys(EPI).filter(F).map(k => val(EPI[k]));
  return `<div class="ending" style="padding-top:8vh"><div class="eyebrow">Fine · giorno ${S.day}</div><h1>${e.h}</h1>${para(e.x)}
  ${epi.length ? `<div class="sec" style="margin-top:24px"><div class="eyebrow">Che ne è stato degli altri</div>${epi.map(t => `<p class="clue">${t}</p>`).join('')}</div>` : ''}
  <p class="mono-s">Casi risolti: ${solvedCount()} · Indizi: ${S.clues.length} · Reputazione finale: ${S.rep}/10 · Sanità: ${S.san}/10</p>
  <p class="coda">${e.coda}</p><div class="row" style="margin-top:20px"><button class="btn" id="again">Torna al titolo</button></div></div>`;
}

/* ---------- titolo e slot ---------- */
const ENDNAMES = {nebbia: 'La Nebbia si Alza', marea: 'Marea Calante', oro: "L'Oro del Sindacato", abisso: 'Quaranta per Quaranta', dinfna: 'Il Ricovero di Santa Dinfna', tardi: 'Troppo Tardi'};
function titleView() {
  return `<div class="title"><div class="eyebrow">Indagini gotiche · 1887</div><h1>Le Nebbie<span>di Saltmere</span></h1>
  <p>Un porto vittoriano, una città che annega asciutta, quaranta morti che il mare non ha dimenticato. Ogni partita pesca casi diversi; le tue scelte decidono chi pagherà, e quanto.</p>
  <div class="row"><button class="btn ghost" id="how">Come si gioca</button></div></div>
  <div class="sec"><div class="eyebrow">Le tue indagini</div><div class="slots">${[1, 2, 3].map(slotCard).join('')}</div></div>
  ${UI.exported ? `<div class="sec code-box"><h3>Codice dello slot ${UI.exported.n}</h3><p class="muted">${UI.exported.copied ? 'Copiato negli appunti. ' : ''}Incollalo su un altro dispositivo con «Carica un codice». Se la copia non è riuscita, seleziona il testo qui sotto.</p><textarea id="expcode" readonly rows="4">${UI.exported.code}</textarea><div class="row"><button class="btn ghost" id="expclose">Chiudi</button></div></div>` : ''}
  <div class="sec"><div class="eyebrow">Carica un codice</div><p class="muted" style="margin:.4em 0 .8em">Incolla qui un codice di salvataggio e scegli in quale slot metterlo.</p><textarea id="imp" rows="3" placeholder="SALTMERE2:…">${ESC(UI.impText || '')}</textarea>${UI.impErr ? `<p class="err">${UI.impErr}</p>` : ''}<div class="row" style="margin-top:8px">${[1, 2, 3].map(n => `<button class="btn ghost" data-imp="${n}">Nello slot ${n}</button>`).join('')}</div></div>`;
}
function slotCard(n) {
  const v = loadSlot(n);
  if (!v) return `<div class="slotc empty"><div class="slot-n">Slot ${n}</div><p class="muted">Vuoto</p><div class="row"><button class="btn" data-newslot="${n}">Nuova indagine</button></div></div>`;
  if (!compatible(v)) return `<div class="slotc"><div class="slot-n">Slot ${n}</div><h3>${ESC(v.tit || '')} ${ESC(v.name || '')}</h3><div class="meta">Partita della versione precedente del gioco: non si può continuare con questa versione.</div><div class="row"><button class="btn ghost" data-newslot="${n}">Nuova</button><button class="btn ghost danger" data-del="${n}">Elimina</button></div></div>`;
  const solvedN = Object.values(v.cases || {}).filter(c => c.st === 'risolto').length;
  const st = v.ending ? `Conclusa · ${ENDNAMES[v.ending] || ''}` : `Giorno ${v.day} · ${SLOTS[v.slot]}`;
  return `<div class="slotc"><div class="slot-n">Slot ${n}</div><h3>${ESC(v.tit)} ${ESC(v.name)}</h3><div class="meta">${BGS[v.bg] ? BGS[v.bg].n : ''} · ${st} · casi risolti ${solvedN}</div>
  <div class="row">${v.ending ? '' : `<button class="btn" data-cont="${n}">Continua</button>`}<button class="btn ghost" data-newslot="${n}">Nuova</button><button class="btn ghost" data-export="${n}">Copia codice</button><button class="btn ghost danger" data-del="${n}">Elimina</button></div></div>`;
}
function slotLabel(n) { const v = loadSlot(n); return v ? `${ESC(v.tit || '')} ${ESC(v.name || '')}${compatible(v) ? `, ${v.ending ? 'partita conclusa' : 'giorno ' + v.day}` : ''}` : ''; }
function confirmView() { const c = UI.confirm; return `<div class="title" style="padding-top:14vh"><div class="eyebrow">Conferma</div><h1 style="font-size:2.4rem">${c.title}</h1><p>${c.msg}</p><div class="row"><button class="btn ${c.danger ? 'danger-fill' : ''}" id="cyes">${c.yes}</button><button class="btn ghost" id="cno">Annulla</button></div></div>`; }
function ask(title, msg, yes, fn, danger) { UI.confirm = {title, msg, yes, fn, danger}; render(); }
function howtoView(standalone) {
  return `${standalone ? '<div style="padding-top:6vh"><div class="eyebrow">Prima di cominciare</div><h1 style="font-size:2.8rem;font-style:italic;margin-bottom:18px">Come si gioca</h1>' : ''}${HOWTO.map(([h, t]) => `<div class="sec"><h3>${h}</h3><p style="margin:0;max-width:62ch">${t}</p></div>`).join('')}${standalone ? '<button class="btn" id="hb">Torna al titolo</button></div>' : ''}`;
}
function createView() {
  const c = UI.creating;
  return `<div class="title" style="padding-top:6vh"><div class="eyebrow">La tua targa d'ottone</div><h1 style="font-size:2.8rem">Chi indaga?</h1>
  <div class="field" style="margin-top:22px"><label for="nm">Nome e cognome</label><input id="nm" value="${ESC(c.name)}" maxlength="40" autocomplete="off"></div>
  <div class="field"><label>Come ti chiamano</label><div class="pick inline">${['Mr.', 'Mrs.', 'Miss'].map(t => `<button class="opt" data-tit="${t}" aria-pressed="${c.tit === t}"><b>${t}</b></button>`).join('')}</div></div>
  <div class="field"><label>Il tuo passato</label><div class="pick">${Object.entries(BGS).map(([k, b]) => `<button class="opt" data-bg="${k}" aria-pressed="${c.bg === k}"><b>${b.n}</b><small>${b.d}</small><small class="bg-stats">OSS ${b.st.oss} · PER ${b.st.per} · SANGUE FREDDO ${b.st.ner} · SANITÀ ${b.san} · £${b.money}</small></button>`).join('')}</div></div>
  <div class="field"><label>Un tratto</label><div class="pick inline">${Object.entries(TRAITS).map(([k, t]) => `<button class="opt" data-tr="${k}" aria-pressed="${c.tr === k}"><b>${t[0]}</b><small>${t[1]}</small></button>`).join('')}</div></div>
  <div class="row"><button class="btn" id="go" ${c.bg && c.tr && c.name.trim() ? '' : 'disabled'}>Apri lo studio</button><button class="btn ghost" id="bk">Indietro</button></div></div>`;
}
function bindTitle() {
  const nm = $('#nm'); if (nm) nm.oninput = e => { UI.creating.name = e.target.value; $('#go').disabled = !(UI.creating.bg && UI.creating.tr && UI.creating.name.trim()); };
  const imp = $('#imp'); if (imp) imp.oninput = e => { UI.impText = e.target.value; };
  const ex = $('#expcode'); if (ex) ex.onfocus = () => ex.select();
}
function startNew(n) { UI.creating = {name: '', tit: 'Mr.', bg: null, tr: null, slot: n}; UI.exported = null; render(); }
function titleClick(t) {
  if (t.id === 'cyes') { const c = UI.confirm; UI.confirm = null; c.fn(); return; }
  if (t.id === 'cno') { UI.confirm = null; render(); return; }
  if (t.id === 'how') { UI.howto = true; render(); return; }
  if (t.id === 'hb') { UI.howto = false; render(); return; }
  if (t.id === 'expclose') { UI.exported = null; render(); return; }
  const d = t.dataset;
  if (d.newslot) { const n = +d.newslot; if (loadSlot(n)) ask('Sovrascrivere?', `Lo slot ${n} contiene la partita di ${slotLabel(n)}. Una nuova indagine la cancellerà per sempre.`, 'Sì, ricomincia', () => startNew(n), true); else startNew(n); return; }
  if (d.cont) { const v = loadSlot(+d.cont); if (compatible(v)) { S = v; S.saveSlot = +d.cont; UI.tab = 'citta'; UI.loc = null; UI.exported = null; render(); } return; }
  if (d.del) { const n = +d.del; ask('Eliminare?', `Vuoi eliminare la partita di ${slotLabel(n)}? Non si potrà recuperare, a meno che tu non abbia copiato il suo codice.`, 'Elimina', () => { delSlot(n); if (UI.exported && UI.exported.n === n) UI.exported = null; render(); }, true); return; }
  if (d.export) { const n = +d.export, v = loadSlot(n); if (!v) return; const code = encodeSave(v); UI.exported = {n, code, copied: false};
    try { navigator.clipboard.writeText(code).then(() => { if (UI.exported && UI.exported.code === code) { UI.exported.copied = true; render(); } }).catch(() => {}); } catch (e) {}
    render(); return; }
  if (d.imp) { const n = +d.imp; let v;
    try { v = decodeSave(UI.impText); } catch (e) { UI.impErr = e === 'old' ? 'Questo codice viene dalla versione precedente del gioco e non è compatibile con questa.' : 'Il codice non è valido. Controlla di averlo copiato per intero, a partire da «SALTMERE2:».'; render(); return; }
    UI.impErr = ''; const put = () => { v.saveSlot = n; try { localStorage.setItem(SK(n), JSON.stringify(v)); } catch (e) {} UI.impText = ''; render(); };
    if (loadSlot(n)) ask('Sovrascrivere?', `Lo slot ${n} contiene la partita di ${slotLabel(n)}. Caricare il codice la sostituirà.`, 'Sì, sostituisci', put, true); else put(); return; }
  if (d.tit) { UI.creating.tit = d.tit; render(); return; }
  if (d.bg) { UI.creating.bg = d.bg; render(); return; }
  if (d.tr) { UI.creating.tr = d.tr; render(); return; }
  if (t.id === 'go') { const c = UI.creating; newGame(c.name.trim(), c.tit, c.bg, c.tr, c.slot); UI.creating = null; render(); return; }
  if (t.id === 'bk') { UI.creating = null; render(); return; }
}
function newGame(name, t, bg, tr, slotN) {
  const b = BGS[bg];
  S = {v: SAVE_VERSION, saveSlot: slotN || 1, name, tit: t, bg, stats: {...b.st}, san: b.san, maxSan: 10, rep: b.rep, money: b.money, day: 1, slot: 0,
    clues: [], flags: {}, done: {}, used: {}, fails: {}, heat: 0, rel: Object.assign({harrow: 0, nell: 0, ambrose: 0, pell: 1}, b.rel),
    pool: shuffle(Object.keys(CASES)).slice(0, CASES_PER_GAME), cases: {}, main: null, notes: [], pend: ['guida', 'prologo'], ending: null};
  S.stats[tr]++;
  S.pool.slice(0, 2).forEach(id => S.cases[id] = {st: 'offerto', exp: 4});
  UI.tab = 'citta'; UI.loc = 'studio';
  save();
}

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (!S) { titleClick(t); return; }
  if (t.id === 'again') { save(); S = null; UI.loc = null; render(); return; }
  if (t.hasAttribute('data-menu')) { save(); S = null; UI.loc = null; UI.scene = null; UI.ded = null; UI.cur = null; render(); return; }
  if (t.dataset.tab) { UI.tab = t.dataset.tab; UI.loc = null; render(); return; }
  if (t.dataset.loc) { UI.loc = t.dataset.loc; render(); return; }
  if (t.hasAttribute('data-back')) { UI.loc = null; render(); return; }
  if (t.hasAttribute('data-clear')) { S.notes = []; save(); render(); return; }
  if (t.dataset.act !== undefined) { const x = actionsAt(UI.loc)[+t.dataset.act]; if (x) startAction(x.a); return; }
  if (t.dataset.ch !== undefined) { choose(+t.dataset.ch); return; }
  if (t.hasAttribute('data-close')) { closeVisit(); return; }
  if (t.dataset.pick) { UI.ded[t.dataset.pick] = t.dataset.v; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.id === 'dsub') { submitAccuse(); return; }
  if (t.id === 'dback') { UI.ded = null; render(); return; }
});

S = null; render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !/claudeusercontent|claude\.ai/.test(location.host)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

</script>
</body>
</html>
